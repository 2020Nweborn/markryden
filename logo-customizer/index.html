  .process-options{display:flex;flex-wrap:nowrap;gap:9px;margin-bottom:18px;min-width:0}

  .adjust-grid{margin-top:22px}

  .actions{margin-top:24px}
  .btn{display:block;width:334px;height:47px;border:0;border-radius:2px;background:var(--dark);color:#fff;font-size:15px;font-weight:400;cursor:pointer}

  .btn+.btn{margin-top:12px}
  .note{text-align:center;margin-top:17px;color:#aaa;font-size:11px}
  .btn:disabled{opacity:.6;cursor:default}
  .export-tip{position:fixed;left:50%;bottom:34px;transform:translate(-50%,10px);z-index:300;background:#303030;color:#fff;font-size:12px;line-height:1.5;padding:9px 16px;border-radius:6px;opacity:0;visibility:hidden;transition:opacity .2s ease,transform .2s ease,visibility .2s ease;max-width:80vw;text-align:center}

const DEFAULT_VIEW_ZOOM = 0.7;

function setRangeFill(el){

function trimToContent(srcCanvas,pad){
  const w=srcCanvas.width,h=srcCanvas.height;
  const ctx=srcCanvas.getContext('2d',{willReadFrequently:true});
  const px=ctx.getImageData(0,0,w,h).data;
  let minX=w,minY=h,maxX=-1,maxY=-1;
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      if(px[(y*w+x)*4+3]>16){
        if(x<minX)minX=x;
        if(x>maxX)maxX=x;
        if(y<minY)minY=y;
        if(y>maxY)maxY=y;
      }
    }
  }
  if(maxX<0)return null;
  const p=(pad==null?2:pad);
  minX=Math.max(0,minX-p);minY=Math.max(0,minY-p);
  maxX=Math.min(w-1,maxX+p);maxY=Math.min(h-1,maxY+p);
  const nw=maxX-minX+1,nh=maxY-minY+1;
  if(nw>=w&&nh>=h)return null;
  const out=document.createElement('canvas');
  out.width=nw;out.height=nh;
  out.getContext('2d').drawImage(srcCanvas,minX,minY,nw,nh,0,0,nw,nh);
  return out;
}

function logoMm(){
  if(!logoImg)return null;
  return {w:logoImg.width*logoImg.scaleX,h:logoImg.height*logoImg.scaleY};
}
function updateSizeReadout(){

  const s=logoMm();
  if(!s){el.textContent=(I18N[currentLang]&&I18N[currentLang].sizeEmpty)||'—';el.classList.remove('is-over');return;}
  const w=Math.round(s.w),h=Math.round(s.h);
  el.textContent=w+' × '+h+' mm  ('+(w/10).toFixed(1)+' × '+(h/10).toFixed(1)+' cm)';
  el.classList.toggle('is-over',Math.max(s.w,s.h)>120);
}

function detectEdgeBackground(px,w,h){
  const bins=new Map(),samples=[];
  const take=(x,y)=>{const i=(y*w+x)*4;if(px[i+3]<16)return;const r=px[i],g=px[i+1],b=px[i+2];samples.push([r,g,b]);const key=`${r>>4},${g>>4},${b>>4}`;bins.set(key,(bins.get(key)||0)+1);};
  const step=Math.max(1,Math.floor(Math.min(w,h)/80));
  for(let x=0;x<w;x+=step){take(x,0);take(x,h-1)}
  for(let y=step;y<h-1;y+=step){take(0,y);take(w-1,y)}
  let winner='',count=-1;
  bins.forEach((n,k)=>{if(n>count){winner=k;count=n}});
  if(!winner)return null;
  const [br,bg,bb]=winner.split(',').map(Number);let r=0,g=0,b=0,n=0;
  samples.forEach(c=>{if((c[0]>>4)===br&&(c[1]>>4)===bg&&(c[2]>>4)===bb){r+=c[0];g+=c[1];b+=c[2];n++}});
  return [r/n,g/n,b/n];
}
function processLogo(imgEl,tolerance,removeBackground,invert){
  const oc=document.createElement('canvas');
  oc.width=imgEl.naturalWidth||imgEl.width;oc.height=imgEl.naturalHeight||imgEl.height;
  const ctx=oc.getContext('2d',{willReadFrequently:true});ctx.drawImage(imgEl,0,0,oc.width,oc.height);
  const data=ctx.getImageData(0,0,oc.width,oc.height),px=data.data,w=oc.width,h=oc.height;
  if(removeBackground){
    const bg=detectEdgeBackground(px,w,h);
    if(bg){
      const hard=4+Number(tolerance)*1.45;
      const soft=hard+18+Number(tolerance)*0.35;
      for(let i=0;i<px.length;i+=4){
        if(px[i+3]===0)continue;
        const dr=px[i]-bg[0],dg=px[i+1]-bg[1],db=px[i+2]-bg[2];
        const distance=Math.sqrt(dr*dr+dg*dg+db*db);
        if(distance<=hard){
          px[i+3]=0;
        }else if(distance<soft){
          const ratio=(distance-hard)/(soft-hard);
          px[i+3]=Math.round(px[i+3]*ratio);
        }
      }
    }
  }
  if(invert){for(let i=0;i<px.length;i+=4){if(px[i+3]){px[i]=255-px[i];px[i+1]=255-px[i+1];px[i+2]=255-px[i+2]}}}
  ctx.putImageData(data,0,0);return oc;
}
function processedCurrent(){return processLogo(currentOriginal,Number(tol.value),rmwhite.checked,invert.checked)}
function displayCanvas(){
  const processed=processedCurrent();
  return trimToContent(processed,2)||processed;
}
function addLogo(srcCanvas,keepWidthMm){
  if(logoImg)canvas.remove(logoImg);
  fabric.Image.fromURL(srcCanvas.toDataURL(),img=>{
    const z=MODEL.logoSpot;
    let scale;
    if(keepWidthMm&&keepWidthMm>0){scale=keepWidthMm/img.width;}
    else{scale=Math.min(z.maxWMm/img.width,z.maxHMm/img.height);}
    img.set({left:z.cxMm,top:z.cyMm,originX:'center',originY:'center',scaleX:scale,scaleY:scale,lockUniScaling:true,lockScalingFlip:true,transparentCorners:false,cornerColor:'#fff',cornerStrokeColor:'#222',borderColor:'#222',cornerSize:9,padding:2,opacity:Number(opa.value)/100,angle:Number(rot.value)});
    img.setControlsVisibility({mt:false,mb:false,ml:false,mr:false});
    logoImg=img;canvas.add(img);canvas.setActiveObject(img);canvas.renderAll();updateSizeReadout();
  });
}
function reprocess(){
  if(!logoImg||!currentOriginal)return;
  const version=++processVersion;
  const keepWidthMm=logoImg.width*logoImg.scaleX;
  const geo={left:logoImg.left,top:logoImg.top,angle:logoImg.angle,opacity:logoImg.opacity};
  const nextSrc=displayCanvas().toDataURL();
  logoImg.setSrc(nextSrc,()=>{
    if(version!==processVersion)return;
    const s=keepWidthMm/logoImg.width;
    logoImg.set({scaleX:s,scaleY:s,left:geo.left,top:geo.top,angle:geo.angle,opacity:geo.opacity});
    canvas.renderAll();updateSizeReadout();
  });
}

function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  if(ctx.roundRect){ctx.roundRect(x,y,w,h,r);return;}
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function drawSizeHudOn(ctx,cw,ch,k){
  const s=logoMm();if(!s)return;
  const t=I18N[currentLang]||I18N.zh;
  const wmm=Math.round(s.w),hmm=Math.round(s.h);
  const over=Math.max(s.w,s.h)>120;
  const fs=Math.max(10,11*k);
  const label=(t.sizeTitle||'LOGO 参考尺寸')+' ';
  const value=wmm+' × '+hmm+' mm  ('+(wmm/10).toFixed(1)+' × '+(hmm/10).toFixed(1)+' cm)';
  ctx.font='400 '+fs+'px '+HUD_FONT;
  const lw=ctx.measureText(label).width;
  ctx.font=(over?900:400)+' '+fs+'px '+HUD_FONT;
  const vw=ctx.measureText(value).width;
  const padX=10*k,padY=4*k,gap=6*k;
  const boxW=lw+gap+vw+padX*2,boxH=fs+padY*2;
  const x=(cw-boxW)/2,y=ch-10*k-boxH;
  ctx.fillStyle='rgba(255,255,255,0.82)';
  roundRectPath(ctx,x,y,boxW,boxH,9*k);ctx.fill();
  ctx.textBaseline='top';
  ctx.fillStyle='#9a9a9a';ctx.font='400 '+fs+'px '+HUD_FONT;
  ctx.fillText(label,x+padX,y+padY);
  ctx.fillStyle=over?'#c0392b':'#8a8a8a';ctx.font=(over?900:400)+' '+fs+'px '+HUD_FONT;
  ctx.fillText(value,x+padX+lw+gap,y+padY);
}
function exportImage(){
  const active=canvas.getActiveObject();
  canvas.discardActiveObject();
  const savedZoom=viewZoom,savedBg=canvas.backgroundColor;
  viewZoom=DEFAULT_VIEW_ZOOM;applyView();
  canvas.backgroundColor='#ffffff';
  canvas.renderAll();
  let outUrl='';
  try{outUrl=canvas.toDataURL({format:'jpeg',quality:.94,multiplier:2});}
  finally{
    canvas.backgroundColor=savedBg||'';
    if(active)canvas.setActiveObject(active);
    viewZoom=savedZoom;applyView();
  }
  return outUrl;
}
function saveBlob(blob,filename){
  const a=document.createElement('a');
  if(window.navigator&&window.navigator.msSaveBlob){window.navigator.msSaveBlob(blob,filename);return;}
  const objUrl=URL.createObjectURL(blob);
  a.href=objUrl;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(objUrl),10000);
}
function exportWithHud(){
  const src=exportImage();
  if(!src)throw new Error('empty canvas');
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const oc=document.createElement('canvas');
        oc.width=img.width;oc.height=img.height;
        const ctx=oc.getContext('2d');
        ctx.drawImage(img,0,0);
        drawSizeHudOn(ctx,oc.width,oc.height,oc.width/stageDisplayWidth());
        if(oc.toBlob){oc.toBlob(b=>b?resolve(b):reject(new Error('toBlob null')),'image/jpeg',0.94);}
        else{resolve(oc.toDataURL('image/jpeg',0.94));}
      }catch(e){reject(e);}
    };
    img.onerror=()=>reject(new Error('image decode failed'));
    img.src=src;
  });
}
function showExportTip(msg){
  let el=document.getElementById('exportTip');
  if(!el){
    el=document.createElement('div');
    el.id='exportTip';el.className='export-tip';
    document.body.appendChild(el);
  }
  el.textContent=msg;el.classList.add('is-on');
  clearTimeout(showExportTip._t);
  showExportTip._t=setTimeout(()=>el.classList.remove('is-on'),4200);
}
document.getElementById('export').addEventListener('click',()=>{
  const btn=document.getElementById('export');
  if(btn&&btn.disabled)return;
  if(btn)btn.disabled=true;
  const t=I18N[currentLang]||I18N.zh;
  exportWithHud().then(out=>{
    saveBlob(out,MODEL.id+'_LOGO预览.jpg');
    showExportTip(t.exportOk||'图片已导出');
  }).catch(e=>{
    console.error('export failed',e);
    showExportTip((t.exportFail||'导出失败，请重试')+'（'+e.message+'）');
  }).then(()=>{if(btn)btn.disabled=false;});
});
const tutMask=document.getElementById('tutMask'),tutTitle=document.getElementById('tutTitle'),tutBody=document.getElementById('tutBody');
const tutNext=document.getElementById('tutNext'),tutSkip=document.getElementById('tutSkip'),tutDots=document.getElementById('tutDots'),tutProgress=document.getElementById('tutProgress');
const TUT_KEY='markryden-logo-tutorial';
let tutIndex=0;
function tutData(){return (I18N[currentLang]||I18N.zh).tutorial||I18N.zh.tutorial;}
function renderTut(){
  const d=tutData();
  tutTitle.textContent=d.title;
  tutBody.textContent=d.steps[Math.min(tutIndex,d.steps.length-1)];
  tutProgress.textContent=(tutIndex+1)+' / '+d.steps.length;
  tutNext.textContent=tutIndex===d.steps.length-1?d.done:d.next;
  tutSkip.textContent=d.skip;
  tutDots.innerHTML='';
  d.steps.forEach((_,i)=>{const s=document.createElement('span');s.className='tut-dot'+(i===tutIndex?' is-on':'');tutDots.appendChild(s);});
}
function openTut(){tutIndex=0;renderTut();tutMask.hidden=false;}
function closeTut(){tutMask.hidden=true;try{localStorage.setItem(TUT_KEY,'1')}catch(e){}}
tutNext.addEventListener('click',()=>{const d=tutData();if(tutIndex<d.steps.length-1){tutIndex++;renderTut();}else{closeTut();}});
tutSkip.addEventListener('click',closeTut);
tutMask.addEventListener('click',e=>{if(e.target===tutMask)closeTut();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!tutMask.hidden)closeTut();});
document.getElementById('tutReopen').addEventListener('click',openTut);
let seenTut=null;try{seenTut=localStorage.getItem(TUT_KEY)}catch(e){}
if(!seenTut)setTimeout(openTut,500);

let savedLang='zh';try{savedLang=localStorage.getItem('markryden-logo-lang')||'zh'}catch(e){}setLanguage(I18N[savedLang]?savedLang:'zh');
loadBag();
</script>
