  logoSpot:{cx:265,cy:236,maxW:125,maxH:70}
};
const canvas = new fabric.Canvas('c',{preserveObjectStacking:true,selection:false,uniformScaling:true,uniScaleTransform:true});
canvas.setDimensions({width:CANVAS_SIZE,height:CANVAS_SIZE});
let bagImg=null,logoImg=null,currentOriginal=null,processVersion=0;

function setRangeFill(el){
  const pct=(Number(el.value)-Number(el.min))/(Number(el.max)-Number(el.min))*100;
  el.style.setProperty('--value',pct+'%');
}
document.querySelectorAll('input[type=range]').forEach(el=>{setRangeFill(el);el.addEventListener('input',()=>setRangeFill(el));});

function loadBag(){
  fabric.Image.fromURL(MODEL.image,img=>{
    img.set({left:0,top:0,originX:'left',originY:'top',scaleX:CANVAS_SIZE/img.width,scaleY:CANVAS_SIZE/img.height,selectable:false,evented:false});
    bagImg=img;canvas.add(img);canvas.sendToBack(img);canvas.renderAll();
  });
}

function detectEdgeBackground(px,w,h){
  const bins=new Map(),samples=[];
  const take=(x,y)=>{const i=(y*w+x)*4;if(px[i+3]<16)return;const r=px[i],g=px[i+1],b=px[i+2];samples.push([r,g,b]);const key=`${r>>4},${g>>4},${b>>4}`;bins.set(key,(bins.get(key)||0)+1);};
  const step=Math.max(1,Math.floor(Math.min(w,h)/80));
  for(let x=0;x<w;x+=step){take(x,0);take(x,h-1)}
  for(let y=step;y<h-1;y+=step){take(0,y);take(w-1,y)}
  let winner='',count=-1;
  bins.forEach((n,k)=>{if(n>count){winner=k;count=n}});
  if(!winner)return null;
  const [br,bg,bb]=winner.split(',').map(Number);let r=0,g=0,b=0,n=0;
  samples.forEach(c=>{if((c[0]>>4)===br&&(c[1]>>4)===bg&&(c[2]>>4)===bb){r+=c[0];g+=c[1];b+=c[2];n++}});
  return [r/n,g/n,b/n];
}
function processLogo(imgEl,tolerance,removeBackground,invert){
  const oc=document.createElement('canvas');
  oc.width=imgEl.naturalWidth||imgEl.width;oc.height=imgEl.naturalHeight||imgEl.height;
  const ctx=oc.getContext('2d',{willReadFrequently:true});ctx.drawImage(imgEl,0,0,oc.width,oc.height);
  const data=ctx.getImageData(0,0,oc.width,oc.height),px=data.data,w=oc.width,h=oc.height;
  if(removeBackground){
    const bg=detectEdgeBackground(px,w,h);
    if(bg){
      const hard=4+Number(tolerance)*1.45;
      const soft=hard+18+Number(tolerance)*0.35;
      for(let i=0;i<px.length;i+=4){
        if(px[i+3]===0)continue;
        const dr=px[i]-bg[0],dg=px[i+1]-bg[1],db=px[i+2]-bg[2];
        const distance=Math.sqrt(dr*dr+dg*dg+db*db);
        if(distance<=hard){
          px[i+3]=0;
        }else if(distance<soft){
          const ratio=(distance-hard)/(soft-hard);
          px[i+3]=Math.round(px[i+3]*ratio);
        }
      }
    }
  }
  if(invert){for(let i=0;i<px.length;i+=4){if(px[i+3]){px[i]=255-px[i];px[i+1]=255-px[i+1];px[i+2]=255-px[i+2]}}}
  ctx.putImageData(data,0,0);return oc;
}
function processedCurrent(){return processLogo(currentOriginal,Number(tol.value),rmwhite.checked,invert.checked)}
function addLogo(srcCanvas){
  if(logoImg)canvas.remove(logoImg);
  fabric.Image.fromURL(srcCanvas.toDataURL(),img=>{
    const z=MODEL.logoSpot,scale=Math.min(z.maxW/img.width,z.maxH/img.height,1);
    img.set({left:z.cx,top:z.cy,originX:'center',originY:'center',scaleX:scale,scaleY:scale,lockUniScaling:true,lockScalingFlip:true,transparentCorners:false,cornerColor:'#fff',cornerStrokeColor:'#222',borderColor:'#222',cornerSize:9,padding:2,opacity:Number(opa.value)/100,angle:Number(rot.value)});
    img.setControlsVisibility({mt:false,mb:false,ml:false,mr:false});
    logoImg=img;canvas.add(img);canvas.setActiveObject(img);canvas.renderAll();
  });
}
function reprocess(){
  if(!logoImg||!currentOriginal)return;
  const version=++processVersion;
  const geo={left:logoImg.left,top:logoImg.top,scaleX:logoImg.scaleX,scaleY:logoImg.scaleY,angle:logoImg.angle,opacity:logoImg.opacity};
  const nextSrc=processedCurrent().toDataURL();
  logoImg.setSrc(nextSrc,()=>{if(version!==processVersion)return;logoImg.set(geo);canvas.renderAll();});
}

const uploadBox=document.getElementById('uploadBox');
const fileInput=document.getElementById('file');
const tol=document.getElementById('tol'),rmwhite=document.getElementById('rmwhite'),invert=document.getElementById('invert');
const opa=document.getElementById('opa'),rot=document.getElementById('rot');
const sizeWarning=document.getElementById('sizeWarning');
let warningTimer=null;
function showSizeWarning(){
  clearTimeout(warningTimer);
  sizeWarning.classList.add('is-open');
  warningTimer=setTimeout(()=>sizeWarning.classList.remove('is-open'),4200);
}
sizeWarning.addEventListener('mouseenter',()=>clearTimeout(warningTimer));
sizeWarning.addEventListener('mouseleave',()=>{if(sizeWarning.classList.contains('is-open'))warningTimer=setTimeout(()=>sizeWarning.classList.remove('is-open'),900)});
uploadBox.addEventListener('click',()=>{fileInput.value='';fileInput.click();});
fileInput.addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{currentOriginal=img;rmwhite.checked=true;opa.value=100;tol.value=0;setRangeFill(opa);setRangeFill(tol);addLogo(processedCurrent());upThumb.src=ev.target.result;upThumb.hidden=false;upPlus.style.display='none';upText.textContent='点击更换 LOGO';showSizeWarning();};
    img.src=ev.target.result;
  };
  reader.readAsDataURL(f);
});
rmwhite.addEventListener('change',reprocess);invert.addEventListener('change',reprocess);tol.addEventListener('input',reprocess);
opa.addEventListener('input',()=>{if(logoImg){logoImg.set('opacity',Number(opa.value)/100);canvas.renderAll();}});
rot.addEventListener('input',()=>{if(logoImg){logoImg.set('angle',Number(rot.value));canvas.renderAll();}});
canvas.on('object:scaling',e=>{if(e.target===logoImg){const s=(logoImg.scaleX+logoImg.scaleY)/2;logoImg.set({scaleX:s,scaleY:s});}});
canvas.on('object:rotating',e=>{if(e.target===logoImg){const snapped=Math.round(logoImg.angle/5)*5;logoImg.set('angle',snapped);rot.value=Math.max(-180,Math.min(180,snapped));setRangeFill(rot);}});
canvas.on('object:modified',e=>{if(e.target===logoImg){const s=(logoImg.scaleX+logoImg.scaleY)/2;logoImg.set({scaleX:s,scaleY:s});let a=Math.round(logoImg.angle/5)*5%360;if(a>180)a-=360;if(a<-180)a+=360;logoImg.set('angle',a);rot.value=a;setRangeFill(rot);canvas.renderAll();}});

document.getElementById('reset').addEventListener('click',()=>{
  if(logoImg){canvas.remove(logoImg);logoImg=null;}currentOriginal=null;fileInput.value='';upThumb.hidden=true;upPlus.style.display='';upText.innerHTML=I18N[currentLang].uploadHint;opa.value=100;rot.value=0;rmwhite.checked=true;[opa,rot].forEach(setRangeFill);canvas.renderAll();
});
document.getElementById('export').addEventListener('click',()=>{
  const active=canvas.getActiveObject();
  canvas.discardActiveObject();
  const previousBg=canvas.backgroundColor;
  canvas.setBackgroundColor('#ffffff',()=>{
    canvas.renderAll();
    const url=canvas.toDataURL({format:'jpeg',quality:.94,multiplier:2});
    const a=document.createElement('a');a.href=url;a.download=MODEL.id+'_LOGO预览.jpg';a.click();
    canvas.setBackgroundColor(previousBg||'',()=>{if(active)canvas.setActiveObject(active);canvas.renderAll();});
  });
});
let savedLang='zh';try{savedLang=localStorage.getItem('markryden-logo-lang')||'zh'}catch(e){}setLanguage(I18N[savedLang]?savedLang:'zh');
loadBag();
</script>
</body>
