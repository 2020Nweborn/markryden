  .export-tip{position:fixed;left:50%;bottom:34px;transform:translate(-50%,10px);z-index:300;background:#303030;color:#fff;font-size:12px;line-height:1.5;padding:9px 16px;border-radius:6px;opacity:0;visibility:hidden;transition:opacity .2s ease,transform .2s ease,visibility .2s ease;max-width:80vw;text-align:center}

  /* ===== 教程：聚光灯引导 ===== */
  .tour{position:fixed;inset:0;z-index:400}
  .tour[hidden]{display:none!important}
  .tour-shades,.tour-rings{position:absolute;inset:0;pointer-events:none}
  .tour-shade{position:absolute;display:block;background:rgba(0,0,0,.62)}
  .tour-ring{position:absolute;border:2px solid #fff;border-radius:8px;pointer-events:none;animation:tourPulse 1.9s ease-in-out infinite}
  .tour-ring.is-peek{border-style:dashed;border-radius:10px;animation:tourPeek 1.9s ease-in-out infinite}
  @keyframes tourPulse{
    0%,100%{box-shadow:0 0 0 4px rgba(255,255,255,.16),0 12px 34px rgba(0,0,0,.30)}
    50%{box-shadow:0 0 0 10px rgba(255,255,255,.07),0 12px 34px rgba(0,0,0,.30)}
  }
  @keyframes tourPeek{
    0%,100%{box-shadow:0 0 0 3px rgba(255,255,255,.14),0 10px 26px rgba(0,0,0,.24);opacity:1}
    50%{box-shadow:0 0 0 10px rgba(255,255,255,.05),0 10px 26px rgba(0,0,0,.24);opacity:.72}
  }
  .tour-pointer{position:absolute;pointer-events:none;filter:drop-shadow(0 3px 8px rgba(232,53,43,.42));animation:tourBounce .85s ease-in-out infinite alternate}
  .tour-pointer[hidden]{display:none}
  .tour-pointer svg{display:block;width:26px;height:17px}
  @keyframes tourBounce{
    from{transform:translate(-50%,-100%) translateY(0)}
    to{transform:translate(-50%,-100%) translateY(6px)}
  }
  .tour-bubble{position:absolute;width:min(310px,calc(100vw - 32px));padding:15px 17px 13px;background:#fff;border-radius:12px;box-shadow:0 18px 46px rgba(0,0,0,.26)}

  .tour-body{font-size:12px;line-height:1.75;color:#5f5f5f}
  .tour-foot{display:flex;align-items:center;gap:10px;margin-top:15px}
  .tour-skip{flex:0 0 auto;background:none;border:0;padding:4px 0;font-size:11px;color:#a8a8a8;cursor:pointer}

  .tour-prev[disabled]:hover{border-color:#e2e2e2}
  .tour-next{height:32px;padding:0 18px;border:0;border-radius:4px;background:#151515;color:#fff;font-size:12px;cursor:pointer}
  .tour-next:hover{background:#2c2c2c}

/* 语言自动判定：只有中国大陆显示中文，其他地区一律英文 */
function detectLang(){
  let tag='';
  try{tag=(navigator.languages&&navigator.languages[0])||navigator.language||'';}catch(e){}
  tag=String(tag||'').toLowerCase();
  if(tag){
    const p=tag.split('-');
    if(p[0]!=='zh')return 'en';
    const region=(p[1]||'').toUpperCase();
    if(region==='CN'||region==='HANS')return 'zh';   /* zh-CN / zh-Hans(-CN) → 中文 */
    if(region)return 'en';                           /* zh-TW / zh-HK / zh-MO / zh-SG 等 → 英文 */
  }
  return timezoneIsMainland()?'zh':'en';             /* 只给到 'zh' 或读不到语言时，用时区兜底 */
}
function timezoneIsMainland(){
  try{
    const tz=String(Intl.DateTimeFormat().resolvedOptions().timeZone||'').toLowerCase();
    return /^asia\/(shanghai|chongqing|urumqi|harbin|kashgar)$/.test(tz);
  }catch(e){return false;}
}

const DEFAULT_VIEW_ZOOM = 0.7;

function trimToContent(srcCanvas,pad){
  const w=srcCanvas.width,h=srcCanvas.height;
  const ctx=srcCanvas.getContext('2d',{willReadFrequently:true});
  const px=ctx.getImageData(0,0,w,h).data;
  let minX=w,minY=h,maxX=-1,maxY=-1;
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      if(px[(y*w+x)*4+3]>16){
        if(x<minX)minX=x;
        if(x>maxX)maxX=x;
        if(y<minY)minY=y;
        if(y>maxY)maxY=y;
      }
    }
  }
  if(maxX<0)return null;
  const p=(pad==null?2:pad);
  minX=Math.max(0,minX-p);minY=Math.max(0,minY-p);
  maxX=Math.min(w-1,maxX+p);maxY=Math.min(h-1,maxY+p);
  const nw=maxX-minX+1,nh=maxY-minY+1;
  if(nw>=w&&nh>=h)return null;
  const out=document.createElement('canvas');
  out.width=nw;out.height=nh;
  out.getContext('2d').drawImage(srcCanvas,minX,minY,nw,nh,0,0,nw,nh);
  return out;
}

function logoMm(){
  if(!logoImg||logoImg.visible===false)return null;

function updateSizeReadout(){
  const el=document.getElementById('logoSizeValue');

  const s=logoMm();
  if(!s){el.textContent=(I18N[currentLang]&&I18N[currentLang].sizeEmpty)||'—';el.classList.remove('is-over');return;}
  const w=Math.round(s.w),h=Math.round(s.h);
  el.textContent=w+' × '+h+' mm  ('+(w/10).toFixed(1)+' × '+(h/10).toFixed(1)+' cm)';
  el.classList.toggle('is-over',Math.max(s.w,s.h)>120);
}

function detectEdgeBackground(px,w,h){
  const bins=new Map(),samples=[];
  const take=(x,y)=>{const i=(y*w+x)*4;if(px[i+3]<16)return;const r=px[i],g=px[i+1],b=px[i+2];samples.push([r,g,b]);const key=`${r>>4},${g>>4},${b>>4}`;bins.set(key,(bins.get(key)||0)+1);};
  const step=Math.max(1,Math.floor(Math.min(w,h)/80));
  for(let x=0;x<w;x+=step){take(x,0);take(x,h-1)}
  for(let y=step;y<h-1;y+=step){take(0,y);take(w-1,y)}
  let winner='',count=-1;
  bins.forEach((n,k)=>{if(n>count){winner=k;count=n}});
  if(!winner)return null;
  const [br,bg,bb]=winner.split(',').map(Number);let r=0,g=0,b=0,n=0;
  samples.forEach(c=>{if((c[0]>>4)===br&&(c[1]>>4)===bg&&(c[2]>>4)===bb){r+=c[0];g+=c[1];b+=c[2];n++}});
  return [r/n,g/n,b/n];
}
function processLogo(imgEl,tolerance,removeBackground,invert){
  const oc=document.createElement('canvas');
  oc.width=imgEl.naturalWidth||imgEl.width;oc.height=imgEl.naturalHeight||imgEl.height;
  const ctx=oc.getContext('2d',{willReadFrequently:true});ctx.drawImage(imgEl,0,0,oc.width,oc.height);
  const data=ctx.getImageData(0,0,oc.width,oc.height),px=data.data,w=oc.width,h=oc.height;
  if(removeBackground){
    const bg=detectEdgeBackground(px,w,h);
    if(bg){
      const hard=4+Number(tolerance)*1.45;
      const soft=hard+18+Number(tolerance)*0.35;
      for(let i=0;i<px.length;i+=4){
        if(px[i+3]===0)continue;
        const dr=px[i]-bg[0],dg=px[i+1]-bg[1],db=px[i+2]-bg[2];
        const distance=Math.sqrt(dr*dr+dg*dg+db*db);
        if(distance<=hard){
          px[i+3]=0;
        }else if(distance<soft){
          const ratio=(distance-hard)/(soft-hard);
          px[i+3]=Math.round(px[i+3]*ratio);
        }
      }
    }
  }
  if(invert){for(let i=0;i<px.length;i+=4){if(px[i+3]){px[i]=255-px[i];px[i+1]=255-px[i+1];px[i+2]=255-px[i+2]}}}
  ctx.putImageData(data,0,0);return oc;
}
function processedCurrent(){return processLogo(currentOriginal,Number(tol.value),rmwhite.checked,invert.checked)}
function displayCanvas(){
  const processed=processedCurrent();

function addLogo(srcCanvas,keepWidthMm,done){

    img.set({left:z.cxMm,top:z.cyMm,originX:'center',originY:'center',scaleX:scale,scaleY:scale,lockUniScaling:true,lockScalingFlip:true,transparentCorners:false,cornerColor:'#fff',cornerStrokeColor:'#222',borderColor:'#222',cornerSize:9,padding:2,opacity:Number(opa.value)/100,angle:Number(rot.value)});
    img.setControlsVisibility({mt:false,mb:false,ml:false,mr:false});
    logoImg=img;canvas.add(img);canvas.setActiveObject(img);canvas.renderAll();updateSizeReadout();
    if(typeof done==='function')done(img);
  });
}
function reprocess(){
  if(!logoImg||!currentOriginal)return;
  const version=++processVersion;
  const keepWidthMm=logoImg.width*logoImg.scaleX;
  const geo={left:logoImg.left,top:logoImg.top,angle:logoImg.angle,opacity:logoImg.opacity};
  const nextSrc=displayCanvas().toDataURL();
  logoImg.setSrc(nextSrc,()=>{
    if(version!==processVersion||!logoImg)return;
    const s=keepWidthMm/logoImg.width;
    logoImg.set({scaleX:s,scaleY:s,left:geo.left,top:geo.top,angle:geo.angle,opacity:geo.opacity});
    canvas.renderAll();updateSizeReadout();
  });
}

const tourRoot=document.getElementById('tourRoot');
const tourShadeLayer=document.getElementById('tourShades'),tourRingLayer=document.getElementById('tourRings');
const tourPointer=document.getElementById('tourPointer'),tourBubble=document.getElementById('tourBubble');
const tourStepNum=document.getElementById('tourStepNum'),tourTitle=document.getElementById('tourTitle'),tourBody=document.getElementById('tourBody');
const tourPrev=document.getElementById('tourPrev'),tourNext=document.getElementById('tourNext'),tourSkip=document.getElementById('tourSkip');
let tourOpen=false,tourIndex=0,tourSnapshot=null,tourToken=0;
let currentHoles=[],holeAnim=null;
let demoAnim=null,demoTimers=[],demoLoaded=false,demoTried=false,demoSource=null;

function tourUI(){const t=I18N[currentLang]||I18N.zh;return t.guideUI||I18N.zh.guideUI;}
function renderTourStep(){
  const s=TOUR_STEPS[tourIndex];if(!s)return;
  const l=currentLang;
  tourStepNum.textContent=(tourIndex+1)+' / '+TOUR_STEPS.length;
  tourTitle.textContent=s.title[l]||s.title.zh;
  tourBody.textContent=s.body[l]||s.body.zh;
  const u=tourUI();
  tourPrev.textContent=u.back;tourNext.textContent=(tourIndex===TOUR_STEPS.length-1)?u.done:u.next;tourSkip.textContent=u.skip;
  tourPrev.disabled=tourIndex===0;
}
function clampHole(h){
  const vw=window.innerWidth,vh=window.innerHeight;
  const x1=Math.max(0,Math.min(vw,h.x)),y1=Math.max(0,Math.min(vh,h.y));
  const x2=Math.max(x1,Math.min(vw,h.x+h.w)),y2=Math.max(y1,Math.min(vh,h.y+h.h));
  return {x:Math.round(x1),y:Math.round(y1),w:Math.round(x2-x1),h:Math.round(y2-y1)};
}
function rectOfSelectors(sel,pad){
  let x1=Infinity,y1=Infinity,x2=-Infinity,y2=-Infinity;
  sel.forEach(s=>{
    document.querySelectorAll(s).forEach(el=>{
      const q=el.getBoundingClientRect();
      if(q.width<=0||q.height<=0)return;
      x1=Math.min(x1,q.left);y1=Math.min(y1,q.top);
      x2=Math.max(x2,q.right);y2=Math.max(y2,q.bottom);
    });
  });
  if(!isFinite(x1))return null;
  return clampHole({x:x1-pad,y:y1-pad,w:x2-x1+pad*2,h:y2-y1+pad*2});
}
/* 画布上 LOGO 在屏幕中的位置：场景坐标 → 视口变换 → 页面坐标 */
function logoHoleOnScreen(pad){
  if(!logoImg)return null;
  const el=canvas.getElement();if(!el)return null;
  const cb=el.getBoundingClientRect();
  const disp=stageDisplayWidth();
  const z=disp/MODEL.canvasMm*viewZoom;
  const t=disp/2-z*MODEL.canvasMm/2;
  const hw=logoImg.width*logoImg.scaleX/2,hh=logoImg.height*logoImg.scaleY/2;
  const a=(logoImg.angle||0)*Math.PI/180;
  const hx=Math.abs(hw*Math.cos(a))+Math.abs(hh*Math.sin(a));
  const hy=Math.abs(hw*Math.sin(a))+Math.abs(hh*Math.cos(a));
  return clampHole({x:cb.left+z*(logoImg.left-hx)+t-pad,y:cb.top+z*(logoImg.top-hy)+t-pad,w:2*hx*z+pad*2,h:2*hy*z+pad*2});
}
function holesFor(step){
  const out=[];
  const main=rectOfSelectors(step.sel,step.pad==null?8:step.pad);
  if(main)out.push(main);
  if(step.peek){const p=logoHoleOnScreen(step.peekPad==null?34:step.peekPad);if(p)out.push(p);}
  return out;
}
/* 把「挖了若干洞的视口」拆成互不重叠的矩形（扫描线法），避免叠加变黑 */
function decomposeHoles(holes,vw,vh){
  const xs=[0,vw];holes.forEach(h=>{xs.push(h.x,h.x+h.w)});
  const ux=Array.from(new Set(xs.map(v=>Math.max(0,Math.min(vw,Math.round(v)))))).sort((a,b)=>a-b);
  const out=[];
  for(let i=0;i<ux.length-1;i++){
    const x0=ux[i],x1=ux[i+1];if(x1<=x0)continue;
    const mx=(x0+x1)/2,ys=[0,vh];
    holes.forEach(h=>{if(h.x<=mx&&mx<=h.x+h.w)ys.push(h.y,h.y+h.h)});
    const uy=Array.from(new Set(ys.map(v=>Math.max(0,Math.min(vh,Math.round(v)))))).sort((a,b)=>a-b);
    for(let j=0;j<uy.length-1;j++){
      const y0=uy[j],y1=uy[j+1];if(y1<=y0)continue;
      const my=(y0+y1)/2;
      if(holes.some(h=>h.x<=mx&&mx<=h.x+h.w&&h.y<=my&&my<=h.y+h.h))continue;
      out.push({x:x0,y:y0,w:x1-x0,h:y1-y0});
    }
  }
  return out;
}
function renderHoles(holes){
  const vw=window.innerWidth,vh=window.innerHeight;
  const rects=decomposeHoles(holes,vw,vh);
  while(tourShadeLayer.children.length<rects.length){
    const el=document.createElement('i');el.className='tour-shade';tourShadeLayer.appendChild(el);
  }
  for(let i=0;i<tourShadeLayer.children.length;i++){
    const el=tourShadeLayer.children[i];
    if(i<rects.length){const r=rects[i];el.style.cssText='left:'+r.x+'px;top:'+r.y+'px;width:'+r.w+'px;height:'+r.h+'px';}
    else el.style.cssText='left:0;top:0;width:0;height:0';
  }
  while(tourRingLayer.children.length<holes.length){
    const el=document.createElement('div');el.className='tour-ring';tourRingLayer.appendChild(el);
  }
  for(let i=0;i<tourRingLayer.children.length;i++){
    const el=tourRingLayer.children[i];
    if(i<holes.length){
      const h=holes[i];
      el.style.cssText='left:'+(h.x-2)+'px;top:'+(h.y-2)+'px;width:'+(h.w+4)+'px;height:'+(h.h+4)+'px';
      const cls=i===0?'tour-ring':'tour-ring is-peek';
      if(el.className!==cls)el.className=cls;
    }else el.style.cssText='left:0;top:0;width:0;height:0';
  }
}
function placeBubble(hole){
  if(!hole)return;
  const vw=window.innerWidth,vh=window.innerHeight;
  const bw=tourBubble.offsetWidth,bh=tourBubble.offsetHeight;
  const gap=14,m=16,y2=hole.y+hole.h;
  const sp=TOUR_STEPS[tourIndex];
  let bx=null,by=null;
  /* 目标区太大时（如整块画布），气泡让到右侧，避免压住 LOGO 与数值 */
  if(sp&&sp.bubble==='right'&&vw-(hole.x+hole.w)>=bw+28){
    const anchor=logoHoleOnScreen(0)||hole;
    bx=hole.x+hole.w+24;
    by=anchor.y+anchor.h/2-bh/2;
  }
  if(bx===null){
    bx=Math.max(m,Math.min(hole.x+hole.w/2-bw/2,vw-bw-m));
    if(y2+gap+bh<=vh-m)by=y2+gap;
    else if(hole.y-gap-bh>=m)by=hole.y-gap-bh;
    else by=hole.y+hole.h/2-bh/2;
  }
  bx=Math.max(m,Math.min(bx,vw-bw-m));
  by=Math.max(m,Math.min(by,vh-bh-m));
  tourBubble.style.left=Math.round(bx)+'px';tourBubble.style.top=Math.round(by)+'px';
}
function placePointer(){
  const s=TOUR_STEPS[tourIndex];
  const el=(s&&s.pointer)?document.querySelector(s.pointer):null;
  if(!el){tourPointer.hidden=true;return;}
  const r=el.getBoundingClientRect();
  tourPointer.hidden=false;
  tourPointer.style.left=Math.round(r.left+r.width/2)+'px';
  tourPointer.style.top=Math.round(r.top-9)+'px';
}
function animateHoles(target,dur){
  if(holeAnim){cancelAnimationFrame(holeAnim);holeAnim=null;}
  const from=currentHoles.map(h=>({...h}));
  const n=Math.max(from.length,target.length),pairs=[];
  for(let i=0;i<n;i++){
    const a=from[i],b=target[i];
    if(a&&b)pairs.push({a:{...a},b:{...b}});
    else if(!a&&b)pairs.push({a:{x:b.x+b.w/2,y:b.y+b.h/2,w:0,h:0},b:{...b}});
    else if(a&&!b)pairs.push({a:{...a},b:{x:a.x+a.w/2,y:a.y+a.h/2,w:0,h:0}});
  }
  if(!pairs.length){currentHoles=[];renderHoles([]);placePointer();return;}
  const start=performance.now();
  const tick=now=>{
    const k=Math.min(1,(now-start)/(dur||200));
    const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    const cur=pairs.map(p=>({x:p.a.x+(p.b.x-p.a.x)*e,y:p.a.y+(p.b.y-p.a.y)*e,w:p.a.w+(p.b.w-p.a.w)*e,h:p.a.h+(p.b.h-p.a.h)*e}));
    currentHoles=cur;renderHoles(cur);placeBubble(cur[0]);placePointer();
    if(k<1)holeAnim=requestAnimationFrame(tick);
    else{
      holeAnim=null;
      currentHoles=target.map(h=>({...h}));
      renderHoles(currentHoles);placeBubble(currentHoles[0]);placePointer();
    }
  };
  holeAnim=requestAnimationFrame(tick);
}
function refreshTour(animate){
  const s=TOUR_STEPS[tourIndex];if(!s)return;
  const holes=holesFor(s);
  if(holeAnim){cancelAnimationFrame(holeAnim);holeAnim=null;}
  if(animate)animateHoles(holes,200);
  else{currentHoles=holes;renderHoles(currentHoles);placeBubble(currentHoles[0]);placePointer();}
}
function sampleKeys(keys,k){
  for(let i=0;i<keys.length-1;i++){
    const a=keys[i],b=keys[i+1];
    if(k<=b.k){
      const span=b.k-a.k;
      const t=span>0?(k-a.k)/span:1;
      const e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
      return a.m+(b.m-a.m)*e;
    }
  }
  return keys[keys.length-1].m;
}
function clearDemo(){
  if(demoAnim){cancelAnimationFrame(demoAnim);demoAnim=null;}
  demoTimers.forEach(t=>clearTimeout(t));demoTimers=[];
}
function playTimeline(keys,dur,onValue,minGap){
  clearDemo();
  const start=performance.now();
  let last=-1e9;
  const tick=now=>{
    const k=Math.min(1,(now-start)/dur);
    if(k>=1||now-last>=(minGap||0)){last=now;onValue(sampleKeys(keys,k));}
    if(k<1)demoAnim=requestAnimationFrame(tick);else demoAnim=null;
  };
  demoAnim=requestAnimationFrame(tick);
}
function enterTourDemo(step){
  if(!step||!step.demo)return;
  try{
    if(step.demo==='tol'){
      playTimeline([{k:0,m:0},{k:1,m:70}],1700,v=>{
        tol.value=Math.round(v);setRangeFill(tol);reprocess();
      },150);
    }else if(step.demo==='invert'){
      clearDemo();
      invert.checked=true;reprocess();
      demoTimers.push(setTimeout(()=>{if(!tourOpen)return;invert.checked=false;reprocess();},1050));
      demoTimers.push(setTimeout(()=>{if(!tourOpen)return;invert.checked=true;reprocess();},2100));
    }else if(step.demo==='scale'&&logoImg){
      /* 教程打开时若还没有 LOGO，快照里没有尺寸，这里补记一次，保证中途退出也能还原 */
      if(tourSnapshot&&!tourSnapshot.logoScale)tourSnapshot.logoScale=logoImg.scaleX;
      const base=(tourSnapshot&&tourSnapshot.logoScale)||logoImg.scaleX;
      playTimeline([{k:0,m:1},{k:.28,m:.3},{k:.72,m:1},{k:1,m:1}],3000,m=>{
        if(!logoImg)return;
        logoImg.set({scaleX:base*m,scaleY:base*m});
        canvas.renderAll();updateSizeReadout();placePointer();
      },0);
    }
  }catch(e){}
}
function exitTourDemo(step,nextIndex){
  clearDemo();
  if(!step||!step.demo||!tourSnapshot)return;
  try{
    if(step.demo==='tol'){
      /* 往前进（第4步及以后）保留已擦除的效果，避免后面的步骤又把边缘还原回去 */
      if(nextIndex==null||nextIndex<3){tol.value=tourSnapshot.tol;setRangeFill(tol);reprocess();}
    }
    else if(step.demo==='invert'){
      /* 往前进时锁定为"已勾选"，让第5步看到的就是反白后的 LOGO */
      invert.checked=(nextIndex!=null&&nextIndex>3)?true:tourSnapshot.invert;
      reprocess();
    }
    else if(step.demo==='scale'&&logoImg&&tourSnapshot.logoScale){logoImg.set({scaleX:tourSnapshot.logoScale,scaleY:tourSnapshot.logoScale});canvas.renderAll();updateSizeReadout();}
  }catch(e){}
}
function setLogoVisible(v){
  if(!logoImg||logoImg.visible===v)return;
  logoImg.set('visible',v);canvas.renderAll();
}
function ensureDemoLogo(){
  if(currentOriginal&&logoImg){demoLoaded=true;return Promise.resolve(true);}
  if(demoTried)return Promise.resolve(demoLoaded);
  demoTried=true;
  return loadDemoLogo().then(ok=>{demoLoaded=!!ok;return demoLoaded;});
}
function goTourStep(i){
  const token=++tourToken;
  const next=Math.max(0,Math.min(TOUR_STEPS.length-1,i));
  exitTourDemo(TOUR_STEPS[tourIndex],next);
  tourIndex=next;
  const s=TOUR_STEPS[tourIndex];
  renderTourStep();
  setLogoVisible(tourIndex>=1);
  if(tourIndex===0)tourPointer.hidden=true;
  const first=document.querySelector(s.sel[0]);
  if(first){
    const q=first.getBoundingClientRect();
    if(q.top<48||q.bottom>window.innerHeight-48)first.scrollIntoView({block:'center',behavior:'auto'});
  }
  refreshTour(true);
  setTimeout(()=>{if(token===tourToken&&tourOpen)refreshTour(true);},190);
  const start=()=>{
    if(token!==tourToken||!tourOpen)return;
    refreshTour(true);
    enterTourDemo(s);
  };
  if(tourIndex>=1&&!demoLoaded)ensureDemoLogo().then(start);
  else start();
}
function loadDemoLogo(){
  return new Promise(resolve=>{
    let settled=false;
    const finish=v=>{if(!settled){settled=true;resolve(v);}};
    setTimeout(()=>finish(false),4000);
    const img=new Image();
    img.onload=()=>{
      try{
        rmwhite.checked=true;invert.checked=false;opa.value=100;rot.value=0;tol.value=0;
        [opa,rot,tol].forEach(setRangeFill);
        currentOriginal=img;demoSource=img;
        const shown=displayCanvas();
        addLogo(shown,0,()=>finish(true));
        upThumb.src=shown.toDataURL();upThumb.hidden=false;upPlus.style.display='none';
        upText.textContent=(I18N[currentLang]&&I18N[currentLang].replace)||'点击更换 LOGO';
      }catch(e){finish(false);}
    };
    img.onerror=()=>finish(false);
    img.src=DEMO_LOGO;
  });
}
function openTour(){
  if(tourOpen)return;
  tourOpen=true;tourIndex=-1;tourToken++;
  demoTried=false;demoLoaded=!!(currentOriginal&&logoImg);
  tourSnapshot={tol:tol.value,invert:invert.checked,logoScale:logoImg?logoImg.scaleX:null,logoVisible:logoImg?logoImg.visible!==false:true};
  tourRoot.hidden=false;
  renderTourStep();
  document.addEventListener('keydown',tourKey);
  goTourStep(0);
}
function closeTour(){
  if(!tourOpen)return;
  exitTourDemo(TOUR_STEPS[tourIndex],null);
  tourOpen=false;tourToken++;
  const isDemoLogo=!!(currentOriginal&&currentOriginal===demoSource);
  if(isDemoLogo){
    /* 教程用的是演示 LOGO：跳过或走完都恢复到初始状态，画布不留 LOGO */
    resetAll();
    demoSource=null;
  }else{
    setLogoVisible(tourSnapshot?tourSnapshot.logoVisible!==false:true);
  }
  demoLoaded=false;demoTried=false;
  tourRoot.hidden=true;
  tourPointer.hidden=true;
  document.removeEventListener('keydown',tourKey);
  try{localStorage.setItem(TOUR_KEY,'1');}catch(e){}
}
function tourKey(e){
  if(!tourOpen)return;
  if(e.key==='Escape'){e.preventDefault();closeTour();}
  else if(e.key==='ArrowRight'){e.preventDefault();if(tourIndex<TOUR_STEPS.length-1)goTourStep(tourIndex+1);else closeTour();}
  else if(e.key==='ArrowLeft'){e.preventDefault();if(tourIndex>0)goTourStep(tourIndex-1);}
}
function stopTourScroll(e){if(e.cancelable)e.preventDefault();}
tourRoot.addEventListener('wheel',stopTourScroll,{passive:false});
tourRoot.addEventListener('touchmove',stopTourScroll,{passive:false});

  if(logoImg){canvas.remove(logoImg);logoImg=null;}
  currentOriginal=null;fileInput.value='';
  upThumb.hidden=true;upPlus.style.display='';
  upText.innerHTML=(I18N[currentLang]||I18N.zh).uploadHint;
  rmwhite.checked=true;invert.checked=false;opa.value=100;rot.value=0;tol.value=0;
  [opa,rot,tol].forEach(setRangeFill);
  setViewZoom(DEFAULT_VIEW_ZOOM);
  canvas.renderAll();updateSizeReadout();
}
document.getElementById('reset').addEventListener('click',resetAll);
document.getElementById('model').addEventListener('change',e=>{
  const m=MODELS[e.target.value];if(!m)return;
  MODEL=m;
  if(logoImg){canvas.remove(logoImg);logoImg=null;}
  currentOriginal=null;fileInput.value='';upThumb.hidden=true;upPlus.style.display='';upText.innerHTML=I18N[currentLang].uploadHint;
  opa.value=100;rot.value=0;rmwhite.checked=true;[opa,rot].forEach(setRangeFill);
  setViewZoom(DEFAULT_VIEW_ZOOM);
  loadBag();applyView();updateSizeReadout();
});
const HUD_FONT='"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif';
function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  if(ctx.roundRect){ctx.roundRect(x,y,w,h,r);return;}
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function drawSizeHudOn(ctx,cw,ch,k){
  const s=logoMm();if(!s)return;
  const t=I18N[currentLang]||I18N.zh;
  const wmm=Math.round(s.w),hmm=Math.round(s.h);
  const over=Math.max(s.w,s.h)>120;
  const fs=Math.max(10,11*k);
  const label=(t.sizeTitle||'LOGO 参考尺寸')+' ';
  const value=wmm+' × '+hmm+' mm  ('+(wmm/10).toFixed(1)+' × '+(hmm/10).toFixed(1)+' cm)';
  ctx.font='400 '+fs+'px '+HUD_FONT;
  const lw=ctx.measureText(label).width;
  ctx.font=(over?900:400)+' '+fs+'px '+HUD_FONT;
  const vw=ctx.measureText(value).width;
  const padX=10*k,padY=4*k,gap=6*k;
  const boxW=lw+gap+vw+padX*2,boxH=fs+padY*2;
  const x=(cw-boxW)/2,y=ch-10*k-boxH;
  ctx.fillStyle='rgba(255,255,255,0.82)';
  roundRectPath(ctx,x,y,boxW,boxH,9*k);ctx.fill();
  ctx.textBaseline='top';
  ctx.fillStyle='#9a9a9a';ctx.font='400 '+fs+'px '+HUD_FONT;
  ctx.fillText(label,x+padX,y+padY);
  ctx.fillStyle=over?'#c0392b':'#8a8a8a';ctx.font=(over?900:400)+' '+fs+'px '+HUD_FONT;
  ctx.fillText(value,x+padX+lw+gap,y+padY);
}
function exportImage(){
  const active=canvas.getActiveObject();
  canvas.discardActiveObject();
  const savedZoom=viewZoom,savedBg=canvas.backgroundColor;
  viewZoom=DEFAULT_VIEW_ZOOM;applyView();
  canvas.backgroundColor='#ffffff';
  canvas.renderAll();
  let outUrl='';
  try{outUrl=canvas.toDataURL({format:'jpeg',quality:.94,multiplier:2});}
  finally{
    canvas.backgroundColor=savedBg||'';
    if(active)canvas.setActiveObject(active);
    viewZoom=savedZoom;applyView();
  }
  return outUrl;
}
function saveBlob(blob,filename){
  const a=document.createElement('a');
  if(window.navigator&&window.navigator.msSaveBlob){window.navigator.msSaveBlob(blob,filename);return;}
  const objUrl=URL.createObjectURL(blob);
  a.href=objUrl;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(objUrl),10000);
}
function exportWithHud(){
  const src=exportImage();
  if(!src)throw new Error('empty canvas');
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const oc=document.createElement('canvas');
        oc.width=img.width;oc.height=img.height;
        const ctx=oc.getContext('2d');
        ctx.drawImage(img,0,0);
        drawSizeHudOn(ctx,oc.width,oc.height,oc.width/stageDisplayWidth());
        if(oc.toBlob){oc.toBlob(b=>b?resolve(b):reject(new Error('toBlob null')),'image/jpeg',0.94);}
        else{resolve(oc.toDataURL('image/jpeg',0.94));}
      }catch(e){reject(e);}
    };
    img.onerror=()=>reject(new Error('image decode failed'));
    img.src=src;
  });
}
function showExportTip(msg){
  let el=document.getElementById('exportTip');
  if(!el){
    el=document.createElement('div');
    el.id='exportTip';el.className='export-tip';
    document.body.appendChild(el);
  }
  el.textContent=msg;el.classList.add('is-on');
  clearTimeout(showExportTip._t);
  showExportTip._t=setTimeout(()=>el.classList.remove('is-on'),4200);
}
document.getElementById('export').addEventListener('click',()=>{
  const btn=document.getElementById('export');
  if(btn&&btn.disabled)return;
  if(btn)btn.disabled=true;
  const t=I18N[currentLang]||I18N.zh;
  exportWithHud().then(out=>{
    saveBlob(out,MODEL.id+'_LOGO预览.jpg');
    showExportTip(t.exportOk||'图片已导出');
  }).catch(e=>{
    console.error('export failed',e);
    showExportTip((t.exportFail||'导出失败，请重试')+'（'+e.message+'）');
  }).then(()=>{if(btn)btn.disabled=false;});
});

    const poll=setInterval(()=>{
      if(bagImg||Date.now()-waitFrom>2500){clearInterval(poll);autoTour();}
    },120);
  }
}
