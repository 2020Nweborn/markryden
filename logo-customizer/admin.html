   ⛔ 别改成色相旋转：黑色/灰色没有 hue，旋转等于什么都不做。
   ⛔ 透明像素必须跳过，否则透明区会被刷成实心色块。 */
function tintImageEl(imgEl,color){
  var w=imgEl.naturalWidth||imgEl.width,h=imgEl.naturalHeight||imgEl.height;

function hexToRgb(s){

  if(!lpList.length){
    var n=lpNewItem();
    /* 新型号默认放正中心。颜色给浅灰（与 9031SJ 的实测色一致），
       它在深色包体上对比很低、容易被误判成「没显示」，
       所以下面面板里放一句提示，让用户知道改颜色即可。 */
    n.cxMm=mm/2;n.cyMm=mm/2;
    lpList=[n];
  }
  lpSelect(0);
  lpAdded=has.length>0;
  lpMm=mm;
  /* ⛔ 2026-10-05 用户要求：标题只留型号名（去掉「品牌LOGO定位 · 」前缀）。
     新型号这时还没有正式键名，就用输入框里填的那个。 */
  $('lpTitle').textContent=isNew?$('newModel').value:key;
  $('logoPanel').hidden=false;
  renderLpState();
  /* ⛔ 画布整体交给 fabric：底图 + 品牌LOGO 都是 fabric 对象，
     LOGO 的选框/手柄/旋转柄由 fabric 自己渲染（与前端 test.html 逐项一致）。 */
  lpFabricDispose();
  lpFabricInit();
  return srcPromise.then(function(src){
    /* 底图按解码后的真实宽高铺满画布；失败时 stageImgGuard 会给出可见说明 */
    return lpFabricLoadBag(src);
  }).then(function(){
    /* ⛔ 2026-10-08：列表里**每一项**的自定义图都要转成能真正取到图的地址 ——
       本地模式下图可能只在本机图片仓（IndexedDB），照配置里的相对路径取会 404，
       该项就静默不显示（正是用户报的「后端画布里面不显示」的另一半原因）。
       ⛔ 必须逐项转：只转 `lp` 那一项会让第 2/3 个 LOGO 依然取不到图。 */
    lpList.forEach(function(it){
      if(it&&it.customUrl)it.customUrl=customLogoDisplayUrl(it.customUrl);
    });
    /* ⛔ 未添加时不许默认摆上 LOGO（用户明确要求，见 renderLpState 注释）。
       未添加时也要走一次 renderAll —— 它会把画布清干净（防止上次残留）。 */
    if(!lpAdded){return lpFabricRenderAll().then(function(){renderLpState();});}
    return lpFabricRenderAll().then(function(){renderLpState();});
  }).catch(function(e){alert(e.message||e);$('logoPanel').hidden=true;});
}
/* 面板的「有LOGO / 没有LOGO」两态。
   ⛔ 用户明确要求：进面板不能默认就摆好一个 LOGO（会让人以为这个型号本来就有、
   或者以为已经保存过了），必须由用户点「＋ 添加品牌LOGO」显式添加；
   没有 LOGO 时右侧控件一律禁用，避免参数改了却没有对象。 */
function renderLpState(){
  renderLpUi();
  /* ⛔ 2026-10-08（第十轮）把「刷 UI」与「重同步画布」拆开：
     `lpFabricReadBack`（moving/scaling/rotating 事件里）**绝不能**调到这里，
     否则每帧都会拿 `lp.cxMm/cyMm` 的旧值去覆盖正在被拖的对象
     → 用户看到「拖动卡顿、松手弹回原位、要拖第二次才生效」。
     ⛔ 需要「只刷 UI 不动画布」的场景一律调 `renderLpUi()`。 */
  applyLp();
}
/* ⛔ 只刷右侧 UI（输入框/勾选框/列表/图形行），**不碰 fabric**。
   供「拖动过程中的切换选中」等**不能重同步画布**的路径使用。 */
function renderLpUi(){
  var on=!!lpAdded, add=$('lpAdd'), none=$('lpNone'), fields=$('lpFields');
  if(add)add.hidden=on;
  if(none)none.hidden=on;
  if(fields)fields.classList.toggle('off',!on);
  ['lpLen','lpRot','lpColor','lpColorPicked'].forEach(function(id){var el=$(id);if(el)el.disabled=!on;});
  /* ⛔ 2026-10-08：LOGO 图形来源行跟着「有没有 LOGO」一起启停，
     和上面三个参数控件保持同一口径 —— 没有 LOGO 时不许传图、也不许恢复默认。 */
  ['lpUpBtn','lpRstBtn'].forEach(function(id){var el=$(id);if(el)el.disabled=!on;});
  /* ⛔ 「再添加一个」：满 3 个就禁用（不是隐藏 —— 藏起来用户会以为功能没了）。
     ⛔ 未添加时也禁用：那一步该走「＋ 添加品牌LOGO」大按钮。 */
  var a2=$('lpAdd2');
  if(a2)a2.disabled=(!on)||lpList.length>=MAX_LP_LOGOS;
  renderLpList();
  renderLpSrc();
  var clr=$('lpClear');if(clr)clr.disabled=!on;
  /* ⛔ 当前选中项的参数要推回输入框：切换 LOGO 之后不重刷，
     输入框还显示上一个的值，用户一改就写错对象。 */
  if(on&&lp){
    $('lpLen').value=lp.lenMm;$('lpRot').value=lp.rot;$('lpColor').value=lp.color;
    /* ⛔ 2026-10-08（第八轮）：没选过色时，颜色控件要显示出「当前用的是原图颜色」，
       否则用户看到色盘是灰的会以为已经在染灰了（旧行为正是「看起来默认就染灰」）。 */
    var cp=$('lpColorPicked');
    if(cp)cp.checked=!!lp.colorPicked;
  }
  /* ⛔ LOGO 的显隐由 fabric 对象的 visible 管（旧实现是切 DOM <img> 的 display） */
  /* ⛔ 画布上不放虚线占位块和提示文字：用户明确要求去掉（视觉上像压了一层白膜）。
     未添加时只看右侧的「＋ 添加品牌LOGO」按钮即可。 */
  var emp=$('lpEmpty');if(emp)emp.hidden=true;
  lpUpdatePos();
}
/* ⛔ 2026-10-08 「LOGO 图形」动态部分的**唯一渲染入口**：
   缩略图 + 名称 + 「恢复默认」按钮的显隐，全在这里算。
   ⛔ 别在别处直接改 #lpSrcThumb / #lpSrcName 的内容 —— 会与这里打架。 */
function renderLpSrc(){
  var th=$('lpSrcThumb'), nm=$('lpSrcName'), rst=$('lpRstBtn');
  if(!th||!nm)return;
  var custom=!!lp.customUrl;
  if(custom){
    /* 自定义图：直接用当前生效的地址渲染缩略图（dataURL 或线上路径） */
    th.innerHTML='';
    var im=document.createElement('img');
    im.src=lp.customUrl;im.alt='';
    th.appendChild(im);
    nm.textContent=lp.customName||'自定义 LOGO';
    nm.title=lp.customName||'自定义 LOGO';
    if(rst)rst.hidden=false;
  }else{
    /* 默认字标：缩略图直接内联一个 1:1 的 mini SVG，
       ⛔ 不复用 brandSvgText() 的 dataURL —— 那是异步的，切图形时会出现
          「先空白一下再出图」的抖动。这里一个静态字形足够表达「默认字标」。 */
    th.innerHTML='<svg viewBox="0 0 24 24" fill="none"><path d="M3 17.5V7.2c0-.4.5-.6.8-.3l4.4 5.4c.2.2.5.2.7 0l3.9-4.1c.2-.2.5-.2.7 0l3.9 4.1c.2.2.5.2.7 0l4.4-5.4c.3-.3.8-.1.8.3v10.3" stroke="#a6a7ac" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    nm.textContent='默认字标';
    nm.title='默认字标（brand-logo.svg）';
    if(rst)rst.hidden=true;
  }
}
/* ⛔ 2026-10-08 「LOGO 列表」的**唯一渲染入口**（一个型号 1~3 个，各自独立）。
   交互与安全区面板的 .zn-list 同一套：点行 = 选中，行尾 × = 删掉这一个。
   ⛔ 列表只有 1 项时**不隐藏整个列表头** —— 头部同时是「＋ 再添加一个」的入口，
      藏了用户在单 LOGO 的型号上就找不到加第二个的地方了。
   ⛔ 每行的小缩略图刻意不复用品牌 SVG 的 dataURL（异步 → 切行会闪），
      固定画一个静态字标字形即可；用了自定义图的显示真实图片缩略。 */
function renderLpList(){
  var box=$('lpList'), cap=$('lpListCap');
  if(!box)return;
  if(cap)cap.textContent='品牌LOGO（'+lpList.length+'/'+MAX_LP_LOGOS+'）';
  /* ⛔ 列表在**未添加**时隐藏：那时数组里是「待添加的空位」，不是真的 LOGO。 */
  if(!lpAdded){box.hidden=true;box.innerHTML='';return;}
  box.hidden=false;
  box.innerHTML=lpList.map(function(it,i){
    var thumb=it.customUrl
      ?'<img src="'+esc(it.customUrl)+'" alt="">'
      :'<svg viewBox="0 0 24 24" fill="none"><path d="M3 17.5V7.2c0-.4.5-.6.8-.3l4.4 5.4c.2.2.5.2.7 0l3.9-4.1c.2-.2.5-.2.7 0l3.9 4.1c.2.2.5.2.7 0l4.4-5.4c.3-.3.8-.1.8.3v10.3" stroke="#a6a7ac" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    var nm=it.customUrl?(it.customName||'自定义 LOGO'):'默认字标';
    /* ⛔ 2026-10-08：行里带上中心坐标 —— 多 LOGO 默认都落画布正中心，
       两个完全重叠时画布上「看起来只有一个」，用户会以为第二个没加上。
       把坐标摆在行上，一眼就能看出「哦，两个都在，只是叠在一起」。
       有 XY 也能判断该往哪边拖。 */
    var cx=Math.round((Number(it.cxMm)||0)*10)/10, cy=Math.round((Number(it.cyMm)||0)*10)/10;
    return '<div class="lp-row'+(i===lpIdx?' sel':'')+'" data-lpi="'+i+'" title="中心 X '+cx+' mm，Y '+cy+' mm">'+
      '<span class="lp-row-th">'+thumb+'</span>'+
      '<i>LOGO '+(i+1)+' · '+esc(nm)+'</i>'+
      '<b>'+Math.round(it.lenMm)+'mm</b>'+
      '<button class="lp-row-del" type="button" data-lpdel="'+i+'" title="删除这个 LOGO">×</button>'+
    '</div>';
  }).join('');
}
/* 列表点击（选中 / 删除）。走事件委托 —— 行是每次渲染重建的，
   逐个 addEventListener 会随重渲染反复叠加。 */
(function(){
  var box=$('lpList');
  if(!box)return;
  box.addEventListener('click',function(e){
    var del=e.target.closest?e.target.closest('[data-lpdel]'):null;
    if(del){
      e.stopPropagation();
      lpDeleteItem(parseInt(del.getAttribute('data-lpdel'),10));
      return;
    }
    var row=e.target.closest?e.target.closest('[data-lpi]'):null;
    if(!row)return;
    var i=parseInt(row.getAttribute('data-lpi'),10);
    if(!(i>=0)||i===lpIdx)return;
    lpSelect(i);
    /* 切到的那一项要立刻画到画布上（图形可能完全不同：字标 vs 自定义图） */
    lpFabricRenderAll()
      .then(function(){renderLpState();});
  });
})();
/* 删掉列表里的第 i 个 LOGO。
   ⛔ 删到只剩 0 个 = 回到「未添加」态（画布上撤掉、右侧参数区禁用），
      但**不改配置** —— 真正落盘只在「保存定位」时按当时的列表重算。
   ⛔ 删掉当前选中项时，选中位要夹回合法范围，否则 lp 会指向已经不存在的对象。 */
function lpDeleteItem(i){
  if(!lpAdded||!(i>=0)||i>=lpList.length)return;
  var wasSel=(i===lpIdx);
  lpList.splice(i,1);
  if(!lpList.length){
    lpAdded=false;
    lpSelect(0);                       /* 空了 → 把 lp 复位成一份默认值，避免悬空引用 */
    lp=lpNewItem();
    lp.cxMm=lpMm/2;lp.cyMm=lpMm/2;
    /* ⛔ 用 lpFabricRenderAll()（它会清空 lpLogoObjs 并重画）——
       不要手写 remove(lpLogoObj)，多 LOGO 后那个变量不存在，会静默什么都不做。 */
    lpFabricRenderAll().then(function(){renderLpState();});
    toastMsg('已移除全部品牌LOGO，点「保存定位」后生效');
    return;
  }
  if(wasSel||i<lpIdx)lpSelect(wasSel?Math.min(i,lpList.length-1):lpIdx-1);
  else lpSelect(lpIdx);
  lpFabricRenderAll()
    .then(function(){renderLpState();toastMsg('已删除该 LOGO，点「保存定位」后生效');});
}
/* ⛔⛔ 2026-10-08（第八轮）用户要求：「支持单独点击LOGO然后可以选中LOGO，同时要支持 delete 键删除。」
   前端 test.html 早就有这套（`removeLogo(active)` + keydown），**后端一直没有** ——
   后端之前只有「安全区面板」的 Delete，LOGO 面板只能点列表行尾的 × 删。
   这里补上，口径与前端、与安全区面板**逐条对齐**：

     ① 只在 LOGO 面板打开时生效（`#logoPanel` 未隐藏）；
     ② 只在画布上**真有被选中的 LOGO**时生效 —— 用户要先点一下那个 LOGO
        （fabric 的 selection 才有 target），没选中就什么都不做（**不弹提示**：
        用户可能只是顺手按了一下 Delete，弹提示反而烦）；
     ③ 输入框里按 Delete/Backspace 是「删字符」，必须放过 input/textarea/select；
     ④ 删掉的是**当前选中那一个**（`lpIdx`），不是列表第一项；
     ⑤ 只改内存 + 重画，**不立刻写线上** —— 与列表 × 一致，真正落盘在「保存定位」。

   ⛔ 为什么用「画布上有没有 activeObject」而不是「lpIdx 有没有值」：
      `lpIdx` 永远有值（默认 0）——它表示"列表里高亮的是哪一行"，不等于"画布上选中了哪个"。
      用 lpIdx 判会导致「一进面板按 Delete 就把第一个删了」，那是很糟糕的意外删除。
      `lpCanvas.getActiveObject()` 才是用户"点了一下那个 LOGO"的真实证据。 */
document.addEventListener('keydown',function(e){
  if(e.key!=='Delete'&&e.key!=='Backspace')return;
  if($('logoPanel').hidden)return;
  var t=e.target||{};
  /* ⛔⛔ 2026-10-08（第八轮）守卫口径修正：
     最初写成「tagName 是 INPUT 就放过」——太宽了。
     `<input type="checkbox">`（本轮的「使用此颜色」）、`type="color"`（色盘）
     **tagName 同样是 INPUT**，但它们在按退格时**没有任何"删字符"语义** ——
     用户勾完颜色、焦点还停在勾选框上，这时按 Delete 会被误判成"在输入文字"而不删 LOGO。
     → 只放过**真的会吃退格的文本类输入**：text / number / search / password / email / tel / url，
       以及 textarea / select / contentEditable。
     ⛔ 别为了省事改回 `tn==='input'`：那正是本轮踩的坑。 */
  var tn=(t.tagName||'').toLowerCase();
  var isTextInput=(tn==='input'&&!/^(checkbox|radio|color|range|file|button|submit|reset)$/i.test(t.type||'text'));
  if(isTextInput||tn==='textarea'||tn==='select'||t.isContentEditable)return;
  if(!lpAdded||!lpCanvas){return;}
  var active=lpCanvas.getActiveObject();
  if(!active)return;                       /* 没选中任何 LOGO → 不删（见 ②） */
  /* 选中的必须是"LOGO 对象"本身（画布上还有包体底图；底图 selectable=false，
     正常点不到，但保险起见仍校验一次：它必须是 lpLogoObjs 里的一员）。 */
  var hit=-1;
  for(var i=0;i<lpLogoObjs.length;i++){if(lpLogoObjs[i]===active){hit=i;break;}}
  if(hit<0)return;
  e.preventDefault();
  lpDeleteItem(hit);
});
/* ⛔ 「＋ 再添加一个」：把一个新 LOGO 加到列表末尾并选中它。
   ⛔ 新版默认落画布正中心（与前端「LOGO 上传后固定落正中心」同一规则）；
      若要避开已有的那个，由用户自己拖开 —— 不加自动错开（用户明确否过）。
   ⛔ 2026-10-08：必须走 `lpFabricRenderAll()`（整体重建），
      原来的 `lpFabricSetLogo()` 会把已有的那个 remove 掉 ——
      那正是用户报的「上传两个 LOGO，后端画布里面不显示」的根因。 */
function lpAddAnother(){
  if(!lpAdded){toastMsg('请先点「＋ 添加品牌LOGO」');return;}
  if(lpList.length>=MAX_LP_LOGOS){toastMsg('一个型号最多 '+MAX_LP_LOGOS+' 个品牌LOGO');return;}
  var it=lpNewItem();
  it.cxMm=lpMm/2;it.cyMm=lpMm/2;
  it.color=(lp&&lp.color)||'#a6a7ac';    /* 沿用当前那个的颜色，省一步操作 */
  /* ⛔ 2026-10-08（第八轮）：**颜色沿用，但「用户选过色」这个标记也一并沿用**。
     语义：上一个 LOGO 是他主动染的色 → 新加的这个也用同色，符合"省一步操作"的初衷；
           上一个没染过（用原图色）→ 新加的也不写 color，保留它自己上传图的原色。
     ⛔ 若这里硬写成 true，会给"只想加个原色 LOGO"的用户偷偷塞一个灰。 */
  it.colorPicked=!!(lp&&lp.colorPicked);
  lpList.push(it);
  lpSelect(lpList.length-1);
  lpFabricRenderAll()
    .then(function(){
      renderLpState();
      /* ⛔ 2026-10-08：新版落在画布正中心，会和已有的那个**完全重叠**。
         用户看到的就是「明明加了第二个，画布上还是一个」，以为功能坏了
         （本轮报的「后端画布里面不显示」就是被这个放大出来的）。
         不加自动错开（用户早前明确否过算法挪位），而是**说清楚 + 让人自己拖**。 */
      if(lpList.length>1){
        toastMsg('已添加第 '+lpList.length+' 个 LOGO（默认落在正中心，和上一个重叠了 —— 拖动它移开即可）');
      }else{
        toastMsg('已添加第 '+lpList.length+' 个品牌LOGO，拖到想要的位置');
      }
    });
}

function addLp(){
  if(lpAdded)return;
  if(!lpCanvas){toastMsg('画布还没准备好，稍等一下再试');return;}
  /* ⛔ 第一次点「添加」= 把列表里那个「待添加的空位」转正。
     列表里那份就是刚才 openLogoPanel 铺好的默认值，这里只需要选中它即可 ——
     ⛔ 不要重新构造一份新对象，否则列表里那份空位永远留在数组里、变成幽灵行。 */
  if(!lpList.length)lpList=[lpNewItem()];
  lpSelect(lpList.length-1);
  lpAdded=true;
  if(!(Number(lp.cxMm)>0)&&!(Number(lp.cyMm)>0)){
    /* 空位没被铺过位置（极少数路径）→ 现补一个正中心 */
    lp.cxMm=lpMm/2;lp.cyMm=lpMm/2;lp.lenMm=DEFAULT_LOGO_LEN;lp.rot=DEFAULT_LOGO_ROT;
    lp.color=($('lpColor')&&$('lpColor').value)||'#a6a7ac';
  }
  /* ⛔ 走整体重建：用户可能先传了自定义图、再点「添加」，
     这时要摆上去的是自定义图，不是默认字标（`logoUrlOfItem` 按项的 src 取图）。 */
  lpFabricRenderAll().then(function(){renderLpState();});
  toastMsg('已添加品牌LOGO，直接在图上拖动调位置');
}
$('lpAdd').addEventListener('click',addLp);
$('lpAdd2').addEventListener('click',lpAddAnother);
/* ⛔ 2026-10-05 起 applyLp() 只是「把 lp 的 mm 状态推给 fabric」的门面 ——
   前端同一套 fabric 负责渲染选框/手柄，后台不再算任何屏幕几何。
   （旧实现是给 DOM <img> 手工算 px 宽高 + transform + 自绘控制框，已整体删除。） */
function applyLp(){
  if(!lpCanvas)return;
  lpFabricSync();
  lpUpdatePos();
}
/* 滑块/输入框改值后：既更新 fabric，也把 LOGO 的 src（颜色）刷一遍 */
function applyLpLive(){
  if(!lpAdded)return;
  applyLp();
}
/* ===== LOGO 画布 = fabric（与前端 test.html 同一套配置）=====
   ⛔ 2026-10-05 用户原话：「直接把前端的代码拿来复用不就好了么？」
   → 手柄外观、等比缩放、旋转柄与连线、命中判定，全部复用前端 fabric 配置，
     后台**不再自绘选框**（lpCtlGeom / renderLpCtl / pickCorner 已整体删除）。

   坐标口径与前端完全一致：画布 1 个 fabric 单位 = 1mm，原点在画布左上角。
   底图按 k 放大到 stage 宽度（k = stage 宽 / canvasMm），LOGO 以 mm 为单位落在图上，
   所以 ll.cxMm / cyMm / lenMm / rot 这些**存进配置的数值不受显示缩放影响**。 */
/* ⛔ 2026-10-08 用户报「上传两个LOGO 定位好之后，后端画布里面不显示」。
   根因：后台画布**从来只维护一个 `lpLogoObj`** —— `lpFabricSetLogo()` 每次都先把上一个
   `remove` 掉再画新的，所以画布上永远只有 1 个 LOGO（而且是当前选中的那个），
   多 LOGO 根本没法「同时看到」。用户配好第 1 个、再加第 2 个，
   第 1 个当场消失，看起来就是「定位好后画布里面不显示」。
   修法：改成**数组 `lpLogoObjs[]`**，与 `lpList[]` **一一对应（同下标）**，
   画布上同时渲染全部；只有**当前选中**的那一个带选框角柄（可拖），
   其余 `selectable:false` / 无控件，但仍然可见。
   ⛔ 别改回单个对象：前端 test.html 就是数组（`brandLogoObjs[]`），
      前后端口径必须一致，否则用户看到的画布和导出的图不一样。 */
var lpCanvas=null, lpLogoObjs=[], lpBagObj=null, lpK=1;
function lpFabricInit(){
  if(lpCanvas)return lpCanvas;
  var stage=$('lpStage');if(!stage)return null;
  stage.innerHTML='';
  /* ⛔ 宽度以 inline style / CSS 的 320px 为准；高度由 aspect-ratio:1/1 决定。
     这里不能读 clientHeight —— 刚清空时它还没参与布局，会拿到 0。 */
  var W=stage.clientWidth||320, H=W;
  /* ⛔ fabric 5 的 Canvas 构造函数要的是 **<canvas> 元素**（或指向 canvas 的 id），
     直接传 <div> 的 id 会得到 "this.lowerCanvasEl.getContext is not a function"
     —— 因为 div 上没有 getContext。所以必须先自己建一个 canvas 再交进去。 */
  var cv=document.createElement('canvas');
  cv.width=W;cv.height=H;
  stage.appendChild(cv);
  lpCanvas=new fabric.Canvas(cv,{
    /* ⛔ 与前端 test.html 逐项一致：
       new fabric.Canvas('c',{preserveObjectStacking:true,selection:false,
                              uniformScaling:true,uniScaleTransform:true}) */
    preserveObjectStacking:true, selection:false,
    uniformScaling:true, uniScaleTransform:true,
    backgroundColor:'#f6f7f8'});
  lpCanvas.setDimensions({width:W,height:H});
  /* ⛔⛔ 2026-10-08（第八轮）用户要求：「支持单独点击LOGO然后可以选中LOGO」。
     在画布上点某个 LOGO → 把「当前编辑项」切过去（右侧参数区、列表高亮一起跟着走），
     这样紧接着按 Delete 删的就是**用户刚点的那个**（配合下面的 Delete 键处理器）。
     ⛔ 用 `selection:created` / `selection:updated` 而不是自己算鼠标坐标：
        fabric 已经把「点到哪个对象」这件事做完了，我们只负责把结果同步回 lpIdx。
     ⛔ 必须判 `e.target` 在不在 lpLogoObjs 里 —— 点空白处 fabric 也会触发
        selection:cleared（不在这里处理），点包体底图不会触发（它 evented:false）。
     ⛔ 事件只绑一次：lpCanvas 是新建的对象，dispose() 会连同监听一起丢掉，
        所以在这个"初始化"函数里绑不会累积（别挪到外面按次绑，那才会叠加）。 */
  lpCanvas.on('selection:created',lpFabricPick);
  lpCanvas.on('selection:updated',lpFabricPick);
  /* 底图：整张铺满，与前端 bagImg 同一口径 */
  lpBagObj=null;lpLogoObjs=[];
  return lpCanvas;
}
/* 画布上点选 LOGO → 切换当前编辑项。
   ⛔ 只做"切选中"，**不重画整个画布** —— 重画会把刚点中的对象扔掉、
      用户会看到手柄闪一下再出现（还可能因为异步而丢选中）。
      正确做法：改 lpIdx 后走 renderLpState()（它内部 applyLp() 会把
      selectable/hasControls 逐项重算并重新 setActiveObject），
      再 renderAll() 一次即可 —— 不重建对象，选中状态自然保留。

   ⛔⛔⛔ 2026-10-09（第十一轮）**用户报「鼠标选中之后，调节大小的摇杆会消失」的真凶就在这里**。
   旧写法只认 `e.target`：
       var o=e&&e.target;
       for(i...)if(lpLogoObjs[i]===o){hit=i;break;}
       if(hit<0||hit===lpIdx)return;
   实测插桩（在 canvas 的 selection:* 回调上包一层打印）：
       点第 2 个 LOGO 时 → {"ev":"selection:updated","targetHit":-1,"imgsLen":2}
   **`targetHit=-1` —— 事件里的 `e.target` 根本不在 `lpLogoObjs` 里！**
   于是 `hit<0` → 直接 return → **`lpIdx` 不动** → 而 fabric 自己已经把
   activeObject 换成了被点的那个 → 两边**分家**：
     · 画布上激活的是第 1 个（用户点的那个）；
     · `hasControls` 却按 `lpIdx`(=2) 算 → **第 1 个不给手柄** → 用户看到「摇杆消失」；
     · 右侧列表高亮也还停在第 2 行（没联动）。
   ⛔ 根因：`e.target` 在 `selection:created` / `selection:updated` 里的语义**不一样**，
      多对象画布上 fabric 5 还可能给的是 ActiveSelection 而非单个图片对象。
   ⛔⛔ **正确做法：不要信 `e.target`，一律以 `canvas.getActiveObject()` 为准反查下标**
      （这正是唯一权威来源 —— fabric 已经把"点到哪个"算完了，我们只负责读结果）。
      再兜一层 `e.selected`/`e.target`，保证任何事件形态都能落到对象上。 */
function lpFabricPick(e){
  if(!lpAdded||!lpCanvas)return;
  /* ① 首选 getActiveObject()：fabric 的"当前选中"权威值，与 e.target 的语义差异无关。
     ② 兜底 e.target / e.selected[0]：少数事件形态下 getActiveObject 可能还没落地。 */
  var cands=[];
  try{var a=lpCanvas.getActiveObject();if(a)cands.push(a);}catch(err){}
  if(e&&e.target)cands.push(e.target);
  if(e&&e.selected&&e.selected.length)cands.push(e.selected[0]);
  /* ⛔ 多选时 getActiveObject 给的是 ActiveSelection 包装对象，取它里面的第一个成员 */
  var extra=[];
  for(var k=0;k<cands.length;k++){
    var c=cands[k];
    if(!c)continue;
    if(c._objects&&c._objects.length)extra.push(c._objects[0]);
  }
  cands=cands.concat(extra);
  var hit=-1,o=null;
  for(var ci=0;ci<cands.length&&hit<0;ci++){
    o=cands[ci];
    for(var i=0;i<lpLogoObjs.length;i++){if(lpLogoObjs[i]&&lpLogoObjs[i]===o){hit=i;break;}}
  }
  if(hit<0)return;                       /* 真不是我们的对象（例如底图）→ 不处理 */
  /* ⛔⛔ 关键补丁：即使 `hit===lpIdx`（下标没变），也必须走一次 renderLpUi()。
     因为"画布激活对象"与"lpIdx"可能因为别的原因分家（例如用户先点了画布、
     或上一次 render 被丢弃），此时**手柄归属已经错了**，必须重算一次。
     ⛔ 这里只能调 `renderLpUi()`（只刷 UI / 手柄归属），
        **绝不能调 `renderLpState()`** —— 它末尾 applyLp()→lpFabricSync() 会拿
        `lp.cxMm/cyMm` 的旧值覆盖对象；虽然点选（非拖拽）时旧值≈当前值、看起来没事，
        但一旦和 moving 事件撞上就会重现第十轮那个"拖动弹回"的老 bug。 */
  if(hit!==lpIdx){lpSelect(hit);}
  renderLpUi();
  /* ⛔ 手柄归属是画布层的事，renderLpUi 不碰 fabric → 这里补一次"只同步控件归属"，
     不重算几何（几何在 lpFabricSync 里，那会覆盖坐标）。
     做法：手工把 hasControls/hasBorders 按新的 lpIdx 重设 + 重新 setActiveObject。 */
  lpFabricApplyControls();
  lpCanvas.renderAll();
}
/* ⛔ 只重设「控件归属」：谁带手柄、谁是激活对象。
   ⛔ 绝不碰 left/top/scaleX/scaleY/angle —— 那是 lpFabricSync() 的职责，
      在这里重算会覆盖掉用户刚拖到的位置（第十轮「拖动弹回」的成因）。 */
function lpFabricApplyControls(){
  if(!lpCanvas)return;
  var target=(lpAdded&&lpLogoObjs[lpIdx])?lpLogoObjs[lpIdx]:null;
  lpLogoObjs.forEach(function(o,i){
    if(!o)return;
    var isCur=(i===lpIdx)&&lpAdded&&o.visible!==false;
    o.set({hasControls:isCur,hasBorders:isCur});
    o.setCoords();
  });
  if(target){
    if(lpCanvas.getActiveObject()!==target)lpCanvas.setActiveObject(target);
  }else{
    lpCanvas.discardActiveObject();
  }
}
/* 重排画布尺寸（面板打开 / 窗口变化时调用）。
   ⛔ 与前端 applyView() 同款：改完尺寸要**重新算视口 + 重设控件尺寸**，
   否则 resize 后角柄又会按旧 z 画。 */
function lpFabricFit(){
  if(!lpCanvas)return;
  var stage=$('lpStage');if(!stage)return;
  var W=stage.clientWidth||320;
  lpCanvas.setDimensions({width:W,height:W});
  lpFabricSync();
}
function lpFabricDispose(){
  if(lpCanvas){try{lpCanvas.dispose();}catch(e){}}
  lpCanvas=null;lpLogoObjs=[];lpBagObj=null;
  lpK=1;
}
/* 把当前 lp 状态同步到 fabric 对象上。
   ⛔ 与前端 test.html 逐项同一口径 —— 别改回「直接缩放对象」：
   前端 applyView() 是
     z = disp / MODEL.canvasMm * viewZoom;  t = disp/2 - z*canvasMm/2;
     canvas.setViewportTransform([z,0,0,z,t,t]);
     logoImgs.forEach(o=>o.set({cornerSize:Math.max(5,9/z),padding:2/z}));
   即**画布里 1 个 fabric 单位 = 1mm**，缩放交给视口；控件尺寸要**除以 z** 才不会
   被视口一起放大（否则角柄比前端粗一倍、旋转柄也跟着变形，就是用户看到的「样式不一样」）。
   后台没有 viewZoom 概念，取 1（画布正好铺满 canvasMm）。 */
function lpFabricSync(){
  if(!lpCanvas||!lpBagObj)return;
  var mm=lpMm>0?lpMm:1;
  var W=lpCanvas.getWidth();
  lpK=W/mm;                                  /* px per mm —— 仅供外部换算用 */
  var z=lpK;                                 /* 视口缩放因子（viewZoom 固定 1） */
  var t=W/2-z*mm/2;
  /* 底图：mm 坐标铺满（前端 bagImg 同款：中心对齐 + scale=1/pxPerMm，
     这里 pxPerMm = width/mm，所以 scale = mm/width） */
  lpBagObj.set({left:mm/2, top:mm/2, originX:'center', originY:'center',
                scaleX:mm/lpBagObj.width, scaleY:mm/lpBagObj.height,
                selectable:false, evented:false});
  lpCanvas.setViewportTransform([z,0,0,z,t,t]);
  /* ⛔ 2026-10-08：改成**遍历全部** LOGO 对象（`lpLogoObjs[i]` ↔ `lpList[i]` 同下标）。
     只有**当前选中**的那个 `hasControls:true` 且被 setActiveObject（fabric 只给激活对象画手柄），
     其余保持可见但不可交互 —— 用户能同时看到自己配的几个 LOGO，
     又不会误拖到别的那一个。 */
  lpLogoObjs.forEach(function(o,i){
    var it=lpList[i];
    if(!o)return;
    if(!it){o.visible=false;return;}
    /* LOGO 用**真实 mm**落点与尺寸，不再乘 lpK —— 视口负责放大 */
    o.set({
      left:it.cxMm, top:it.cyMm,
      originX:'center', originY:'center',
      scaleX:it.lenMm/o.width, scaleY:it.lenMm/o.width,
      angle:it.rot,
      visible:!!lpAdded,
    });
    var isCur=(i===lpIdx)&&lpAdded;
    /* ⛔⛔ 2026-10-08（第八轮）用户要求：「支持单独点击LOGO然后可以选中LOGO」。
       旧口径：**只有当前那一项 selectable/evented**，其余项完全点不到 ——
       想切到另一个 LOGO 只能去点右侧列表行。用户要的是**直接在画布上点**。
       新口径（与前端 test.html 装 LOGO 时的 `hasControls:true` 一致）：
         · **所有可见 LOGO 都可点**（selectable/evented=true）→ 点哪个就选中哪个；
         · **只有当前选中那一个画手柄**（hasControls/hasBorders=isCur）——
           否则 3 个 LOGO 都带角柄，画布上一片框，用户根本看不清在调哪个。
         · hoverCursor 统一 'move'：让用户一眼看出"这个能点/能拖"。
       ⛔ 别把 hasControls 也放开给全部 —— 多 LOGO 时手柄会互相叠；
          手柄是"当前编辑对象"的标识，必须唯一。 */
    o.set({selectable:!!lpAdded, evented:!!lpAdded,
           hasControls:isCur, hasBorders:isCur,
           hoverCursor:lpAdded?'move':'default'});
    /* ⛔ 控件尺寸必须除以 z：这是前后端「选框样式一致」的唯一关键一行。
       ⛔ 2026-10-05 用户报「画布里放大缩小的白色方块太大了，会遮挡住 LOGO」：
          纯 `Math.max(5,9/z)` 在**大件**上会失控 —— 后台画布固定 318px 宽，
          视口缩放 z = 318/mm，包体越大 z 越小、9/z 越大：
            MR_21     113.6mm → z=2.80 → 9/z=3.2  → 取地板 5px（正常）
            MR_35     307mm   → z=1.04 → 9/z=8.7  → 8.7px（偏大）
            MR_9031SJ 589mm   → z=0.54 → 9/z=16.7 → **16.7px 白色实心块，把 LOGO 整段盖住**
          前端 test.html 没有这个问题：它的画布随型号自适应、canvasMm 又小，
          z 一直偏大，9/z 天然落在 5 左右。
          → 修法：给 9/z 加**上限 9px**（同时也保留 5px 地板）。
             角柄是「控件」不是「画面内容」，它的可读尺寸只取决于屏幕像素，
             不该随包体实际毫米数线性放大。9px 与前端常见取值一致，
             在 318px 画布上仍然好点中（约 2.5% 边长），又不至于挡住 LOGO。 */
    o.set({cornerSize:Math.min(9,Math.max(5,9/z)), padding:2/z});
    o.setCoords();
  });
  /* ⛔ 改值（右侧输入框 / 换色重建）之后必须**重新选中**：
     否则选框与手柄当场消失，用户会以为「LOGO 又没了」——
     fabric 只在 setActiveObject 后才画控件。
     ⛔ 只能激活**当前项**那一个对象；激活别的会让手柄长在错的 LOGO 上。 */
  if(lpAdded&&lpLogoObjs[lpIdx]){
    if(lpCanvas.getActiveObject()!==lpLogoObjs[lpIdx])lpCanvas.setActiveObject(lpLogoObjs[lpIdx]);
  }else{
    lpCanvas.discardActiveObject();
  }
  lpCanvas.renderAll();
}
/* 首次挂底图（异步解码，尺寸由图片本身决定） */
function lpFabricLoadBag(src){
  return new Promise(function(res){
    if(!lpCanvas)return res(false);
    var img=new Image();
    img.onload=function(){
      /* ⛔ 底图用 mm 坐标（与前端 bagImg 一致），不按像素铺满 */
      lpBagObj=new fabric.Image(img,{left:0,top:0,originX:'left',originY:'top',
                                     selectable:false,evented:false});
      lpCanvas.add(lpBagObj);
      lpCanvas.sendToBack(lpBagObj);
      lpFabricSync();
      res(true);
    };
    img.onerror=function(){
      var stage=$('lpStage');
      if(stage){stage.classList.add('bad');}
      res(false);
    };
    img.src=src;
  });
}
/* ⛔ 2026-10-08 重写：从「换掉唯一那个 LOGO」改成**按 lpList 整体重建**。
   原实现每次先把旧的 remove 掉再画新的 ⇒ 画布上永远只有 1 个，
   用户配第二个时第一个当场消失（本轮报的「后端画布里面不显示」）。
   现在：清空全部 → 逐个取图 → 按**同下标**填进 `lpLogoObjs[]`。
   ⛔ `lpLogoObjs[i]` 必须与 `lpList[i]` 严格对齐（中间不能有空洞），
      所以取图失败也要占位（填 null），否则后面所有项都会错位到别的 LOGO 上。
   ⛔ token 判据：快速切型号/连点「再添加一个」时，旧的一批会陆续回来，
      只判一次会让新旧混在画布上。 */
var lpRenderTok=0;
function lpFabricRenderAll(){
  if(!lpCanvas)return Promise.resolve(false);
  lpLogoObjs.forEach(function(o){if(o)lpCanvas.remove(o);});
  lpLogoObjs=[];
  lpCanvas.discardActiveObject();
  if(!lpAdded||!lpList.length){lpCanvas.renderAll();return Promise.resolve(true);}
  var token=++lpRenderTok;
  /* 先占好位（全 null），保证下标对齐 */
  var n=lpList.length;
  for(var i=0;i<n;i++)lpLogoObjs.push(null);
  var jobs=lpList.map(function(it,idx){
    return logoUrlOfItem(it).then(function(url){
      return new Promise(function(res){
        if(token!==lpRenderTok)return res(false);
        if(!url)return res(false);
        fabric.Image.fromURL(url,function(img,isError){
          if(token!==lpRenderTok)return res(false);
          if(isError||!img||!img._element||!img._element.naturalWidth){
            console.warn('后台：第 '+(idx+1)+' 个品牌LOGO 加载失败：'+url);
            return res(false);              /* ⛔ 占位留 null，不许 splice，否则后面全部错位 */
          }
          img.set({
            left:0, top:0, originX:'center', originY:'center',
            lockUniScaling:true, lockScalingFlip:true,
            transparentCorners:false, cornerColor:'#fff', cornerStrokeColor:'#222',
            borderColor:'#222', cornerSize:9, padding:2,
            hasControls:true, hasBorders:true,
          });
          img.setControlsVisibility({mt:false,mb:false,ml:false,mr:false});
          img.on('moving',lpFabricReadBack);
          img.on('scaling',lpFabricReadBack);
          img.on('rotating',lpFabricReadBack);
          img.on('modified',lpFabricReadBack);
          lpLogoObjs[idx]=img;
          lpCanvas.add(img);
          res(true);
        });
      });
    }).catch(function(){return false;});
  });
  return Promise.all(jobs).then(function(){
    if(token!==lpRenderTok)return false;
    lpFabricSync();
    return true;
  });
}
/* ⛔ 「这一项该画什么图」—— 支持传入列表里的**任意一项**（不再只认当前的 lp）。
   这是多 LOGO 的关键：不能再用 `currentLogoUrl()`（它只认 `lp`）。 */
function logoUrlOfItem(it){
  if(!it)return Promise.resolve('');
  /* ⛔ 2026-10-08（第八轮）：默认字标必须用颜色 —— 它就是靠 SVG 的 color 出字形。
     所以这条分支不变（`it.color` 一定有值，见 lpNewItem）。 */
  if(!it.customUrl)return brandLogoUrl(it.color);
  var u=it.customUrl;
  /* ⛔⛔ 2026-10-08（第八轮）**这是「上传后自动改颜色」的第二个真凶（画布侧）**。
     旧写法判 `if(!it.color)` —— 但 lpNewItem() 给每项都填了 color:'#a6a7ac'，
     **它永远有值** → 自定义图上传后立刻被刷成灰。
     （第一层在 lpSave 的写配置处，已改；但只改那里画布当时仍然染灰，
       因为面板里的渲染走的是这里。）
     → 正确判据是 **colorPicked**：用户主动选过色才染色，否则用原图。
     ⛔ 别改回 `it.color`：那就是用户报的「自动改颜色」。
     ⛔ 老配置回读时 colorPicked 由 lpSave 的口径反推（有 color 字段 = 选过），
        所以历史数据仍按老表现渲染，不会被这次改动悄悄改观感。 */
  if(!it.colorPicked)return Promise.resolve(u);
  var tintColor=it.color||'#a6a7ac';
  return loadImgEl(u).then(function(el){
    var c=tintImageEl(el,tintColor);
    return c?c.toDataURL('image/png'):u;
  }).catch(function(){return u;});
}
/* 兼容旧调用点：换「当前这一个」的图 = 重建全部（成本可忽略，一套列表最多 3 个） */
function lpFabricSetLogo(url){
  return lpFabricRenderAll();
}
/* 用户拖完 → 把 fabric 的真实几何换算回 mm 写回**被拖的那一项**（并实时回写右侧输入框）。
   ⛔ 画布里 1 单位 = 1mm（缩放走视口），所以读出来的值**本身就是 mm**，
   不要再除 lpK —— 除了会让拖 1mm 记成 0.5mm，位置越拖越飘。
   ⛔⛔ 2026-10-08（第九轮）真根因：**旧实现写死 `lpLogoObjs[lpIdx]`，并用
      `if(e.target!==o)return` 把"拖的不是当前项"直接丢掉**。
      第八轮已把**所有 LOGO 都放开成可拖**（用户要求"点哪个选哪个"），
      于是「拖一个没被选中的 LOGO」完全合法 —— 但它的移动事件全被那个 return 吃掉，
      右侧读数一动不动。用户看到的就是「**改了位置，保存不更新位置**」。
      （实测 MR_9031SJ：拖非当前项 → pos 恒为 292/430.5，零变化；
        拖当前项 → 292 → 384.6 正常。）
   → 新口径：**按 `e.target` 反查它在 `lpLogoObjs[]` 里的下标**，写回那一项，
      并顺手把 `lpIdx/lp` 切过去（与画布点选同一语义：谁被动就编辑谁）。 */
var lpReadPending=false;
function lpFabricReadBack(e){
  if(!lpCanvas||!lpAdded)return;
  if(!e||!e.target)return;
  /* ⛔ 反查被操作的是哪一项 —— 这是本函数唯一正确的定位方式。
     用下标而不是对象引用去比对，是因为 lpLogoObjs 可能正在被 lpFabricRenderAll 重建。 */
  var hit=-1;
  for(var i=0;i<lpLogoObjs.length;i++){if(lpLogoObjs[i]===e.target){hit=i;break;}}
  if(hit<0)return;                 /* 不是我们管的 LOGO（例如底图）→ 不处理 */
  /* ⛔ 被拖的不是当前编辑项 → 先把编辑目标切过去，再回写。
     不切的话「右侧输入框显示 A、实际改了 B」，用户一调滑杆就改错对象。
     ⛔⛔ 2026-10-08（第十轮）**这里必须是 `renderLpUi()`，绝不能是 `renderLpState()`**。
         `renderLpState()` 末尾会 `applyLp()` → `lpFabricSync()` → **拿 `lp.cxMm/cyMm`
         的旧值重新 set 到对象上**。而本函数是绑在 `moving/scaling/rotating` 上的，
         等于在拖动过程中每帧把对象"拉回原位" ——
         用户看到的就是「**挪动时卡顿、松手又弹回没挪动的位置、要拖第二次才行**」。
         `renderLpUi()` 只刷右侧 UI（列表高亮/输入框/图形行），一个字节都不碰 fabric。 */
  if(hit!==lpIdx){lpSelect(hit);renderLpUi();}
  var o=lpLogoObjs[lpIdx];
  if(!o||!lp)return;
  /* ⛔ 必须用 getCenterPoint：带 origin 的 left/top 在旋转后不是「几何中心」，
     直接用 o.left/o.top 会在旋转后把 LOGO 越拖越偏。 */
  var c=o.getCenterPoint();
  lp.cxMm=c.x;
  lp.cyMm=c.y;
  lp.lenMm=Math.max(5,Math.min(300,Math.round(o.width*o.scaleX*10)/10));
  lp.rot=Math.round(((o.angle%360)+360)%360);
  if($('lpLen'))$('lpLen').value=lp.lenMm;
  if($('lpRot'))$('lpRot').value=lp.rot;
  lpUpdatePos();
}
function lpUpdatePos(){
  if(!$('lpPos'))return;

  $('lpPos').textContent='中心位置：X '+Math.round(lp.cxMm*10)/10+' mm，Y '+Math.round(lp.cyMm*10)/10+' mm（画布 '+Math.round(lpMm*10)/10+'mm）';
}

  if(!lpKey){alert('请先从型号卡上的「品牌LOGO定位」进入，再清除。');return;}

/* ⛔ 2026-10-08 保存：把面板里的整个 lpList 折算成配置。
   ⛔ 写入口径（红线：models.json 是活数据、只能加字段不许改语义）：
      · 写新的 `brandLogos` 数组（最多 3 项），每项 {cxMm,cyMm,lenMm,rot,color[,src,srcNm]}。
      · **同时写老字段 `brandLogo` = 第 1 项**（不删、不改名）——
        线上正式版 index.html 还是老代码、只认 brandLogo；不回填一份它整个型号的
        品牌 LOGO 就没了（2026-10-06 的历史事故就是这个形状）。
        → 「双写」是这次唯一的兼容手段，别省。
      · 绝不整表覆盖：只给这一个型号改字段，别的型号一个字不动。 */
$('lpSave').addEventListener('click',function(){
  if(!lpAdded){toastMsg('请先点「＋ 添加品牌LOGO」再保存');return;}
  if(lpKey&&!state.models[lpKey]){alert('型号不存在');return;}
  /* 新型号此时 lpKey 还是空串，拿不到型号名 —— 但素材路径必须按型号命名，
     所以用输入框里的型号名现算（与 packUpload 里 normModel 的口径一致）。
     算不出来就只存图不存 src：宁可这次不带自定义图，也不能写一个错路径进配置。 */
  var modelKey=lpKey||(function(){
    var nm=normModel($('newModel').value||draft.model);
    return nm?'MR_'+nm:'';
  })();
  var missingName=0;
  var list=lpList.slice(0,MAX_LP_LOGOS).map(function(it,i){
    var pos={cxMm:Math.round(it.cxMm*10)/10,cyMm:Math.round(it.cyMm*10)/10,
             lenMm:Math.round(it.lenMm*10)/10,rot:Math.round(it.rot)};
    /* ⛔⛔ 2026-10-08（第十轮）：**只有用户主动选过颜色，才写 color + colorPicked**。
       用户原话：「默认是可以用原本的LOGO颜色，是改了颜色之后才会覆盖之前LOGO的颜色。」
       旧写法无条件 `color:it.color` → 每项都带 color:'#a6a7ac'
       → 前端 `custom && cfg.color` 一见有 color 就染色 → **上传自定义图后立刻被刷成灰色**。
       新口径：
         · colorPicked=true  → 写 `color` **和** `colorPicked:true`（覆盖原图色）；
         · colorPicked=false → **两个都不写** → 前端 cfg.color 为空 → 保留原图色。
       ⛔⛔ 为什么必须**两个一起写**（第十轮新增 colorPicked）：
           `color` 只表达"用什么色"，无法表达"用户到底选没选过" ——
           老配置里那个 `#a6a7ac` 是当年自动刷进去的，与用户手选同色**完全无法区分**。
           `colorPicked` 才是"用户做过这个决定"的记录。**只写 color 不写它 = 下次打开又丢**。
       ⛔ 别改回无条件写：那就是用户报的「自动改颜色」。
       ⛔ 也别写 `color:''` 之类的空串占位 —— 前端多处用 `cfg.color||'…'` 兜底，
          空串会退回默认灰字标色，等于白改；**不写字段**才是唯一正确表达。 */
    if(it.colorPicked){pos.color=it.color;pos.colorPicked=true;}
    /* ⛔ 自定义 LOGO 的落点 = 配置里多一个 src 字段。
       `srcNm` 只用于后台回显文件名，前端不读它。 */
    if(it.customUrl&&modelKey){
      pos.src=customLogoPath(modelKey,i);
      if(it.customName)pos.srcNm=it.customName;
    }else if(it.customUrl){
      missingName++;
    }
    return pos;
  });
  if(missingName){
    toastMsg('有 '+missingName+' 个自定义LOGO 因为没有型号名，本次只记录了位置（图未写进配置）');
  }
  var m=lpKey?state.models[lpKey]:null;
  if(!m){
    /* 新型号：暂存到草稿，跟型号图片一起提交。
       ⛔ 数组与老字段一起暂存，两条路都留着。 */
    draft.brandLogos=list;
    draft.brandLogo=list[0];
    $('logoPanel').hidden=true;
    toastMsg('LOGO 定位已暂存，点「确认提交上传」后生效');
    return;
  }
  /* 已有型号：只改 LOGO 落点。这里必须单独把 models.json 写回去 ——
     否则「改了定位但不重传图片」时找不到提交入口，等于白改。 */
  m.brandLogos=list;
  m.brandLogo=list[0];                 /* ⛔ 双写：老代码只认这个（见上方注释） */
  state.dirty=true;renderList();refreshPending();
  $('logoPanel').hidden=true;
  /* ⛔ 开发环境无条件落本机草稿（红线：本地保存一律不进线上）。
     这是第 4 个写回入口，2026-09-18 之前没有这段 —— 本机存过 token 的用户
     点「保存定位」会直接打 GitHub contents，token 失效/过期就是
     「保存失败：Bad credentials」，看着像定位功能坏了，其实是发错了地方。
     ⛔ 不许写成 `IS_LOCAL&&!token()`：那等于「碰巧存过 token 就绕过第①级」。 */
  if(IS_LOCAL){
    /* ⛔ 本地若刚传了自定义图，也要把它落进本机图片仓，否则刷新后图就没了。
       走与产品图同一条 localPublishUpload 思路：先存图，再存草稿。
       ⛔ 每个 LOGO 各存各的（路径带序号），不能只存最后一张。 */
    var pairs=[],pending=lpList.slice(0,MAX_LP_LOGOS);
    pending.forEach(function(it,i){
      if(it.customBlob&&modelKey)pairs.push({path:customLogoPath(modelKey,i),blob:it.customBlob});
    });
    /* ⛔⛔ 2026-10-08（第七轮）：本机这条分支**同样要清图缓存**。
       本机 idbPutFiles 写的路径也是 customLogoPath()（型号+序号，内容换、路径不变），
       不清的话刷新前任何一次重新渲染还是会拿回上一张图。 */
    if(pairs.length){
      return idbPutFiles(pairs).then(function(){
        lpList.forEach(function(it){it.customBlob=null;});
        /* ⛔ 刚往本机图片仓写了新文件 → objectURL 表必须重扫，
           否则重开面板时 adminAssetUrl() 查不到这条路径 → 404 → 图「消失」。
           顺序要紧：**先重扫再清缓存**，让下一次渲染能真的取到新图。 */
        return adminAssetsRescan();
      }).then(function(){
        lpImgCacheDrop();
        return saveLocalDraft('品牌LOGO定位（'+lpKey+'）');
      }).catch(function(e){alert('自定义LOGO存本机失败：'+(e.message||e));});
    }
    lpList.forEach(function(it){it.customBlob=null;});
    lpImgCacheDrop();
    return saveLocalDraft('品牌LOGO定位（'+lpKey+'）');
  }
  if(!token()){toastMsg('LOGO 定位已记录，连接 GitHub 后再点「确认提交上传」');return;}
  /* ⛔ 有刚上传的自定义图 → 先把它作为素材文件推上去，再写配置。
     没传图（只是挪了位置/改了尺寸）→ 一个文件都不用传，直接走 json。 */
  var files=[];
  lpList.slice(0,MAX_LP_LOGOS).forEach(function(it,i){
    if(it.customBlob&&modelKey)files.push({path:customLogoPath(modelKey,i),blob:it.customBlob});
  });
  var up={key:lpKey,model:m,files:files,keepColors:[]};
  state.busy=true;
  var title=files.length?'正在上传自定义LOGO并写回配置':'正在保存 LOGO 定位到 GitHub';
  /* ⛔⛔ 2026-10-08（第二轮）：这里以前是 `runJobs([{kind:'json',model:up}],…)` —— **手搓了一个
     只有 json 的任务清单**，`up.files`（刚上传的自定义LOGO）被整包丢掉：
       · 配置照写，src 指向 `logo-custom/xxx_logo.png`；
       · 但那个文件**从来没上传过** → GitHub 上不存在 → 前端取图 404 → **LOGO 消失**。
     这正是用户报的「上传了自定义LOGO 会消失，前端页面也不显示」的**第二个真凶**
     （第一个是写入被静默跳过、图压根没上传，已在本文件上方 ghPut 处修掉）。
     修法：改用 `buildJobs(up)` —— 与「新增型号」「修改图片」**同一条装配线**。
     它会把 up.files 展开成 {kind:'put'} 任务，且**排在 json 之前**，
     所以「上传失败 → 配置不写」，不会再出现「配置指向不存在的文件」。
     ⛔ 别改回手搓数组：那样等于绕过 put 任务，这个 bug 会原样复发。 */
  runJobs(buildJobs(up),{title:title}).then(function(){
    state.busy=false;state.dirty=false;refreshPending();
    lpList.forEach(function(it){it.customBlob=null;});
    /* ⛔⛔ 2026-10-08（第七轮）：**保存成功后必须清图缓存**。
       这是「替换自定义LOGO 提示成功、但显示的还是第一次那张」的最后一环：
       ① 第一次传 A → loadImgEl 把 A 的 <img> 记进 lpImgCache['logo-custom/xx_logo2.png']；
       ② 替换成 B → 本次上传把 GitHub 上的同名文件覆盖成 B（**写入链路本身是对的**），
          但那个缓存键**没变**，所以还是指着 A；
       ③ 关掉面板、重开、切色、拖动……任何一次重新渲染 → 命中缓存 → **画布又变回 A**。
       → 全清（不传参）最稳：此时 up.files 里的每张图都已在各自路径上就位，
         清掉后下一次渲染会真的按新路径重新拉一次，拿到的一定是新图。
       ⛔ 别改成只清 files 里的路径 —— 有些项 customBlob 为空（没换图），
          它们走的是同一份缓存，全清代价只是一次重新请求。 */
    lpImgCacheDrop();
    alert(files.length?'自定义LOGO已保存到线上。':'品牌LOGO定位已保存到线上。');
    return afterWrite();
  }).catch(function(e){
    state.busy=false;
    /* ⛔⛔ 2026-10-08：受保护路径被拦时**必须说清「配置也没写」**。
       旧行为是静默跳过上传 + 照写配置 → 配置里躺着一个指向不存在文件的 src
       （用户报的「自定义LOGO 上传后消失、前端也不显示」）。
       现在 ghPut 会 reject、json 在它后面不会执行，所以配置是干净的 ——
       但用户必须被告知「这次没成功」，否则他会以为已保存然后关掉页面。 */
    var tip=(e&&e.mrProtected)
      ? ('这次的自定义LOGO 没能上传（路径受保护）：'+(e.mrPath||'')+
         '\n\n配置也没有改动，页面上的改动都还在，可以重试。')
      : ('保存失败：'+(e.message||e)+'\n改动还留在页面上，再点一次可重试。');
    alert(tip);
  });
});

/* 清除本机草稿：草稿只在本机浏览器里，删了不可恢复，所以要确认一次。
   清完重新读配置 —— 这时才会去读线上那份（api → 同源 → raw）。 */
$('btnDraft').addEventListener('click',function(){
  if(!confirm('清除本机草稿？\n\n清掉后本页与前端都会回到线上配置（'+CFG+'）。\n草稿只存在本机浏览器里，且没有别的备份，删了不可恢复。'))return;
  dkDrop();
  syncDraftChip();          /* ⛔ 必须先撤角标：loadModels 成功时不一定会再走到这里 */
  lastWrite='（已清除草稿）';
  syncEnvChip();
  toastMsg('本机草稿已清除，正在读回线上配置…');
  loadModels().catch(function(e){toastMsg('读回线上配置失败：'+((e&&e.message)||e));});
});
$('tpCancel').addEventListener('click',function(){$('tokenPanel').hidden=true;});
$('tpSave').addEventListener('click',function(){
  var v=($('token').value||'').trim();
  if(!v){alert('请粘贴密钥');return;}
  localStorage.setItem(TK,v);
  setGhChip();
  $('tokenPanel').hidden=true;
});

/* ========== 登录 ========== */
$('eye').addEventListener('click',function(){
  var p=$('pwd');
  p.type=p.type==='password'?'text':'password';
});
function doLogin(){
  var acc=$('acc').value.trim(),pwd=$('pwd').value;
  sha256hex(acc).then(function(ah){
    if(ah!==ACC_HASH){$('gateErr').textContent='账号或密码不对';return;}
    return sha256hex(pwd).then(function(ph){
      if(ph!==PWD_HASH){$('gateErr').textContent='账号或密码不对';return;}
      sessionStorage.setItem('mr_admin_ok','1');
      enter();
    });
  });
}
$('btnLogin').addEventListener('click',doLogin);
/* 退出登录：只清会话标记，不动 GitHub 密钥（那是本机凭据，重登后还要用）。
   有未提交改动时先问一句，避免误点丢掉刚传的图。 */
$('btnLogout').addEventListener('click',function(){
  var n=pendingCount();
  if(n&&!confirm('还有 '+n+' 项改动没有提交，退出会丢失。确定退出？'))return;
  sessionStorage.removeItem('mr_admin_ok');
  $('main').hidden=true;
  $('gate').style.display='flex';
  $('acc').value='';$('pwd').value='';
  $('gateErr').textContent='';
  $('pwd').type='password';
});
$('pwd').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
$('acc').addEventListener('keydown',function(e){if(e.key==='Enter')$('pwd').focus();});

function enter(){
  $('gate').style.display='none';
  $('main').hidden=false;
  setGhChip();
  syncDraftChip();
  syncEnvChip();
  loadModels().then(function(){
    /* ⛔ 读取降级时不能拿「已读取线上配置」把警告盖掉：loadModels() 已经说清读到的是哪一版，
       这里再补一句成功提示等于把警告抹掉，用户就永远看不到「读到的是缓存旧版」。 */
    if(lastSrc!=='api')return;
    /* ⛔ 开发环境不许提示「去连 GitHub」：本地改动的落点就是本机草稿+本机图片仓，
       连 GitHub 是「发到线上测试版」的动作 —— 按提示连上去，等于把本地验证绕过去了。 */
    if(IS_LOCAL){toastMsg('已读取线上配置（只读）。本地改动只落本机，不用连 GitHub。');return;}
    toastMsg('已读取线上配置'+(token()?'':'，发布前请先点右上角连接 GitHub'));
  }).catch(function(e){
    $('list').innerHTML='<p class="empty-tip">读取失败：'+esc(e.message)+'</p>';
  });
}

/* ========== 上传交互 ========== */
$('file').addEventListener('change',function(e){addFiles(e.target.files);$('file').value='';});
['dragenter','dragover'].forEach(function(ev){
  document.querySelector('.cols').addEventListener(ev,function(e){e.preventDefault();document.querySelector('.dropzone').classList.add('over');});
});
['dragleave','drop'].forEach(function(ev){
  document.querySelector('.cols').addEventListener(ev,function(e){e.preventDefault();document.querySelector('.dropzone').classList.remove('over');});
});
document.querySelector('.cols').addEventListener('drop',function(e){
  if(e.dataTransfer&&e.dataTransfer.files)addFiles(e.dataTransfer.files);
});
$('newModel').addEventListener('input',function(){
  /* 「型号名称：」是固定标签，这里只收后面输入的数字/字母。
     顺手把用户可能连带的 MR_ 前缀或空格清掉，避免生成 MR_MR_9100 这类名字。 */
  var v=$('newModel').value;
  var clean=v.replace(/^\s*(mr|MR)[_\- ]*/,'');
  if(clean!==v){
    var at=$('newModel').selectionStart-(v.length-clean.length);
    $('newModel').value=clean;
    try{$('newModel').setSelectionRange(Math.max(0,at),Math.max(0,at));}catch(e){}
  }
  draft.model=clean;
});
$('btnPublish').addEventListener('click',publish);
$('btnDiscard').addEventListener('click',function(){
  if(!pendingCount())return;
  if(!confirm('放弃所有未发布的改动？'))return;
  loadModels().then(function(){toastMsg('已放弃改动');});
});
function toastMsg(s){
  $('pendingTip').textContent=s;
  /* 这行提示的长短会改变 .hint 的行数、从而改变右栏的内容高度；
     卡片高度是按内容算死的，不重算就会把上传格压扁（守卫写在 syncCardHeight 内部）。 */
  syncCardHeight();
}

/* ========== 修改图片弹窗 ========== */
$('ipFile').addEventListener('change',function(e){ipAddFiles(e.target.files);$('ipFile').value='';});
$('ipCancel').addEventListener('click',function(){
  if(ip.items.some(function(it){return !it.old;})&&!confirm('放弃这次修改？'))return;
  $('imgPanel').hidden=true;ip.items=[];
});
$('ipSave').addEventListener('click',function(){
  if(ip.loading){alert('还在读取线上配色，稍等一下');return;}
  /* ⛔ 开发环境不需要 token（下面落本机图片仓 + 本机草稿），线上才要求先连 GitHub。
     以前这里无条件要 token —— 本地点「确认提交上传」先弹连接层。 */
  if(!IS_LOCAL&&!token()){openTokenPanel();alert('还没有连接 GitHub，请先连接');return;}
  var key=ip.key,m=state.models[key];
  if(!m)return;
  /* 三类改动都要提交：
       · 新增   —— `!it.old`（新传进来的配色）
       · 改名   —— 色名变了（同名会重裁，所以要重传）
       · 删除   —— `ip.removed`（点 × 移出列表的那些）
     ⛔ 2026-10-05 修 bug：原来只判前两类，**删图后 `changed` 恒为空**，
        点「确认」直接弹「没有检测到改动」，删除永远提交不了（用户报的正是这个）。
        删除是「从 items 里消失」，光看 items 推断不出来，必须靠 ip.removed 记录。 */
  var changed=ip.items.filter(function(it){
    if(!it.old)return true;                       /* 新加的颜色 */
    return it.label!==(it.old.label||it.old.key); /* 改了色名 */
  });
  var removed=(ip.removed||[]).filter(function(c){
    return (m.colors||[]).indexOf(c)>=0;          /* 只提交确实还在配置里的（幂等） */
  });
  if(!changed.length&&!removed.length){alert('没有检测到改动');return;}
  /* ⛔ 一个型号至少要留一个配色：删到一个不剩会让前端没有产品图可显示。
     在提交之前拦住，别等写进配置后前端白屏才发现。 */
  var remain=(m.colors||[]).filter(function(c){return removed.indexOf(c)<0;}).length+changed.length;
  if(remain<1){alert('至少要保留一个配色，最后一个颜色不能删。');return;}
  var model=normModel(key.replace(/^MR_/,''));
  /* ⛔ keep = 本次「没被改动」的旧配色，要原样带过去（否则覆盖时会丢图）。
     删掉的也要从 keep 里剔除 —— 否则它会被当成「没动」又被补回配置里，删除白做。
     剔除口径与上面 removed 一致，都用「是否还在 m.colors 里」判，保持幂等。 */
  var keep=(m.colors||[]).filter(function(c){
    if(removed.indexOf(c)>=0)return false;                                  /* 本次删掉的 */
    return !changed.some(function(it){return it.old===c;});                 /* 本次改动的 */
  });
  var restore=function(){$('ipSave').disabled=false;$('ipSave').textContent='确认';};
  $('ipSave').disabled=true;$('ipSave').textContent='提交中…';
  /* 删掉的文件要落盘删掉：线上走 del 任务，本地走本机图片仓 + 本机草稿。
     ⛔ 与「点 ×」不同 —— 那一步只改弹窗列表，**这里才是真正生效的那一刻**。 */
  var dropFiles=function(up){
    var gone=[];
    removed.forEach(function(c){
      if(c.image){stageDel(c.image);gone.push(c.image);}
      if(c.webp){stageDel(c.webp);gone.push(c.webp);}
      if(up&&up.model&&up.model.colors){
        up.model.colors=up.model.colors.filter(function(x){return x.key!==c.key;});
      }
    });
    /* 本机图片仓里的那两张也删掉，否则图片仓越攒越多孤儿文件。
       ⛔ 线上不走这里（线上由 buildJobs 的 del 任务删 GitHub 上的文件）。 */
    if(IS_LOCAL&&gone.length)idbDelFiles(gone);
    return gone;
  };
  /* ⛔ 开发环境落本机，与「新增型号」共用 localCommitUpload（裁切管线同源）。
     这段 2026-09-18 之前不存在：本地点「确认提交上传」会直接打 GitHub contents，
     token 一失效就是「提交中断：Bad credentials」。 */
  if(IS_LOCAL){
    /* ⛔ 纯删除时 `changed` 是空的：packUpload([]) 会以「图片宽度不一致」软失败
       （calcGeo([]) 拿不到几何），所以这条路径必须能处理「没有新图要传」。
       做法：没有新图就走「只改配置」—— keep 原样带过去，删掉的文件另行 stageDel。 */
    var upP=changed.length
      ? packUpload(changed,model,keep,{brandLogo:m.brandLogo,brandLogos:m.brandLogos})
      : Promise.resolve({key:'MR_'+model,model:{id:'MR_'+model,colors:keep.slice()},files:[],keepColors:[]});
    return upP.then(function(up){
      dropFiles(up);
      return localCommitUpload(up);
    }).then(function(r){
      restore();
      if(!r.ok)return r;
      $('imgPanel').hidden=true;ip.items=[];ip.removed=[];
      toastMsg('已存到本机（'+draftStamp()+'）：'+r.key+' 的 '+r.files+
        ' 个图片文件进了本机图片仓，配置进了本机草稿。刷新前端页面即可看到。');
      return r;
    }).catch(function(e){
      restore();refreshPending();
      alert('本机保存中断：'+((e&&e.message)||e));
      return 'error';
    });
  }
  var upQ=changed.length
    ? packUpload(changed,model,keep,{brandLogo:m.brandLogo,brandLogos:m.brandLogos})
    : Promise.resolve({key:'MR_'+model,model:{id:'MR_'+model,colors:keep.slice()},files:[],keepColors:[]});
  upQ.then(function(up){
    dropFiles(up);
    return runJobs(buildJobs(up,{skipGlobalEdits:true}),
      {title:'正在提交到 GitHub'});
  }).then(function(){
    restore();
    $('imgPanel').hidden=true;ip.items=[];ip.removed=[];
    alert('已提交！前端页面约 30–60 秒后会自动显示新内容。');
    return afterWrite();
  }).catch(function(e){
    restore();
    alert('提交中断：'+((e&&e.message)||e));
  });
});

if(sessionStorage.getItem('mr_admin_ok')==='1')enter();
})();
</script>
