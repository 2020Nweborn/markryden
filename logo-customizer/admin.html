<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MARK RYDEN · 定制页后台</title>
<style>
  :root{--bd:#e6e8eb;--tx:#141519;--tx2:#7a7f87;--gray:#f2f3f5;--ok:#1fa971;}
  *{box-sizing:border-box}
  body{margin:0;background:#f4f5f7;color:var(--tx);font:14px/1.6 "Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif}
  /* 页头 LOGO 一律用官方矢量图（logo.svg），不再用 Arial Black 文字冒充。
     两处宽度不同：登录卡内 168px，顶栏 128px。 */
  .brand{display:block;height:auto;width:168px}
  img.brand{max-width:100%}
  /* ---------- 登录 ---------- */
  #gate{position:fixed;inset:0;background:#eef0f2;display:flex;align-items:center;justify-content:center;z-index:50}
  .login-card{background:#fff;border-radius:28px;padding:56px 64px;width:420px;max-width:92vw;box-shadow:0 8px 40px rgba(0,0,0,.06)}
  .login-card .brand{width:196px;margin:0 auto 36px}
  .field{display:flex;align-items:center;background:var(--gray);border-radius:999px;padding:0 18px;height:52px;margin-bottom:16px}
  .field span{color:var(--tx);white-space:nowrap}
  .field input{flex:1;border:0;background:transparent;outline:none;font:inherit;color:var(--tx);padding-left:4px}
  .eye{border:0;background:transparent;cursor:pointer;padding:4px;display:flex;color:#333}
  /* ⛔ 浏览器会给 type=password 输入框挂一个原生的「显示密码」眼睛（Edge/Chromium 的
     ::-ms-reveal、凭证自动填充按钮等），叠上我们自绘的 .eye 就变成「两个眼睛」。
     原生的一律禁掉，只留自绘那个。 */
  #pwd::-ms-reveal,#pwd::-ms-clear{display:none!important}
  #pwd::-webkit-textfield-decoration-container{display:none!important}
  #pwd::-webkit-credentials-auto-fill-button,
  #pwd::-webkit-strong-password-auto-fill-button{
    display:none!important;visibility:hidden;pointer-events:none;width:0;height:0}
  .login-btn{width:100%;height:56px;border:0;border-radius:999px;background:#141519;color:#fff;font:600 16px/1 inherit;font-family:inherit;cursor:pointer;letter-spacing:.1em}
  .login-btn:hover{background:#2a2c31}
  #gateErr{color:#c0392b;font-size:13px;text-align:center;min-height:20px;margin:12px 0 0}
  #main[hidden]{display:none}
  /* ---------- 顶栏 ---------- */
  .topbar{background:#fff;border-bottom:1px solid #ececee;padding:0 32px;height:76px;display:flex;align-items:center;gap:16px}
  .topbar .brand{width:128px}
  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px}
  .gh-btn{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--bd);border-radius:999px;padding:9px 18px;font:inherit;font-size:13px;cursor:pointer;color:var(--tx)}
  .gh-btn:hover{border-color:#b9bec6}
  .logout-btn{background:#fff;border:1px solid var(--bd);border-radius:999px;padding:9px 18px;
    font:inherit;font-size:13px;cursor:pointer;color:var(--tx);white-space:nowrap}
  .logout-btn:hover{border-color:#141519;color:#141519}
  .dot{width:8px;height:8px;border-radius:50%;background:#d6d9dd}
  .gh-btn.on .dot{background:var(--ok)}
  /* ---------- 主体：两栏等高 ---------- */
  /* align-items:stretch 让左右卡片自动等高；高度由较高的那栏决定，
     左栏型号多时靠内部滚动消化，不撑高整页。 */
  .cols{display:grid;grid-template-columns:1.06fr .94fr;gap:22px;max-width:1320px;
    margin:28px auto;padding:0 28px 60px;align-items:stretch}
  /* ⛔ grid 子项默认 min-width:auto，会被内容（那排 190px 的上传格）顶宽，
     导致整栏撑破容器、横向滚动条永远不出现。必须显式压成 0。 */
  .cols>.card{min-width:0}
  @media(max-width:900px){.cols{grid-template-columns:1fr}}
  /* --card-h 由 JS 实测两栏内容后统一写入，保证严格等高 */
  .card{background:#fff;border-radius:24px;padding:26px;display:flex;flex-direction:column;
    min-height:420px;height:var(--card-h,auto)}
  .card h2{font-size:16px;font-weight:600;margin:0 0 16px}
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px}
  .card-head h2{margin:0;flex-shrink:0}
  /* ---------- 搜索框（与看板文案子页一致：折叠胶囊，点开才展开） ---------- */
  .search-box{position:relative;display:flex;align-items:center;height:36px;border-radius:999px;
    background:#f0f0f0;overflow:hidden;width:96px;transition:width .3s cubic-bezier(.4,0,.2,1);flex-shrink:0}
  .search-box.open{width:176px}
  .search-box .s-label{position:absolute;left:0;top:0;bottom:0;width:58px;display:flex;align-items:center;
    justify-content:flex-start;padding-left:16px;font-size:14px;color:#999;pointer-events:none;
    transition:opacity .2s;z-index:2}
  .search-box.open .s-label{opacity:0}
  .search-box .s-input{position:absolute;left:0;right:44px;top:0;bottom:0;border:0;background:transparent;
    outline:0;padding:0 0 0 16px;font:inherit;font-size:14px;color:#000;opacity:0;z-index:1;
    transition:opacity .15s .15s;pointer-events:none}
  .search-box.open .s-input{opacity:1;pointer-events:auto}
  .search-box .s-input::placeholder{color:#bbb}
  .search-box .s-btn{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:28px;height:28px;
    border-radius:50%;background:#fff;display:grid;place-items:center;cursor:pointer;flex-shrink:0;
    transition:transform .2s;z-index:2;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .search-box .s-btn svg{width:14px;height:14px}
  .search-box .s-btn:hover{transform:translateY(-50%) scale(1.08)}
  /* ---------- 型号列表（内部滚动，最多露 3 张卡） ---------- */
  .m-list{flex:1;min-height:0;overflow-y:auto;padding-right:4px;margin-right:-4px;
    max-height:var(--list-h,520px)}
  .m-list::-webkit-scrollbar{width:6px}
  .m-list::-webkit-scrollbar-thumb{background:#dcdfe3;border-radius:99px}
  .m-list::-webkit-scrollbar-thumb:hover{background:#c3c7cc}
  .m-list::-webkit-scrollbar-track{background:transparent}
  @supports not selector(::-webkit-scrollbar){.m-list{scrollbar-width:thin}}
  /* 型号卡 */
  /* 型号卡：按设计稿分「型号行 / 颜色行」两区，中间一条分隔线。
     卡内不留左右 padding，改由 .m-head / .m-colors 各自撑满，分隔线才能通到两边。 */
  .model-card{border:1px solid #e3e5e8;border-radius:16px;margin-bottom:14px;overflow:hidden;background:#fff}
  .model-card:last-child{margin-bottom:0}
  /* ⛔ flex-wrap + row-gap：型号卡现在有 4 个 mini-dark 按钮（修改/品牌LOGO定位/安全区/置顶），
     窄屏真放不下时**换行**而不是把按钮压扁、压到上传格上。卡片高度由 syncCardHeight() 动态量，换行会被计入。 */
  .m-head{display:flex;align-items:center;gap:10px;padding:18px 20px;flex-wrap:wrap;row-gap:10px}
  .m-name{font-weight:500;font-size:17px;margin-right:auto;display:inline-flex;align-items:center;gap:4px;
    color:#141519;letter-spacing:.01em}
  .mini-dark{background:#141519;color:#fff;border:0;border-radius:9px;padding:9px 14px;font-size:13px;
    cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
    font-weight:400}
  .mini-dark:hover{background:#2a2c31}
  /* 按钮永不被压扁：挤不下就靠 .m-head 换行（上面 row-gap 那条） */
  .mini-dark{flex-shrink:0}
  .mini-dark[disabled]{opacity:.4;cursor:default}
  .mini-dark[disabled]:hover{background:#141519}
  .mini-dark svg{width:14px;height:14px;flex-shrink:0}
  /* 外部 SVG 图标：原图 viewBox 很小（修改 6×6 / 删除 8×8），必须显式给尺寸，
     否则会按固有尺寸渲染成针尖大小。 */
  .mini-dark img.ico{width:14px;height:14px;flex-shrink:0;display:block}
  .icon-btn{border:0;background:transparent;cursor:pointer;padding:2px 3px;line-height:0;
    display:inline-flex;align-items:center;justify-content:center;opacity:.65}
  .icon-btn img.ico{width:15px;height:15px;display:block}
  .icon-btn:hover{opacity:1}
  /* ⛔ 拖拽排序（2026-09-30）：置顶/拖拽只重排 models.json 的 key 顺序，不加新字段。
     把手用纯 CSS 点阵画（2 列 × 3 行），不新增 SVG 资产、不手写 path ——
     项目红线「图标一律走外部 SVG」针对的是设计稿图标，这里只是个交互提示。 */
  /* 2026-09-30 用户要求去掉左侧把手：按住卡片任意位置即可上下拖拽。
     抓手提示改挂到整张卡上；⛔ 卡内的交互元素要自己压回 pointer，否则点按钮会被当成拖拽起手。 */
  .model-card{cursor:grab}
  .model-card:active{cursor:grabbing}
  .model-card button,.model-card input,.model-card select,.model-card a{cursor:pointer}
  /* ⛔ 搜索状态下禁止拖拽：可见顺序 ≠ 完整顺序，拖了必然错位 */
  .model-card.no-drag{cursor:not-allowed}
  .model-card.no-drag .m-head,.model-card.no-drag .m-colors{opacity:.62}
  .model-card.is-dragging{opacity:.4}
  .model-card.drag-before{box-shadow:inset 0 3px 0 0 #1938D7}
  .model-card.drag-after{box-shadow:inset 0 -3px 0 0 #1938D7}
  /* ⛔ 「置顶」不能放在 .m-name 里（2026-09-30 改）：
     ① 违反既有红线「型号名后面只留删除」；
     ② 会把 .m-name 的 textContent 污染成 `MR_9031SJ置顶`（读屏、按文本取型号名的地方全中招）。
     所以它是一个普通的 mini-dark 按钮，与「修改 / 品牌LOGO定位 / 安全区」并列。 */
  /* 颜色行：默认不出现滚动条，真的溢出才显示（JS 加 .is-overflow） */
  .m-colors{display:flex;gap:10px;align-items:center;border-top:1px solid #eceef1;
    padding:16px 20px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none}
  .m-colors::-webkit-scrollbar{display:none}
  .m-colors.is-overflow{padding-bottom:22px}
  .m-colors.is-overflow::-webkit-scrollbar{display:block;height:5px}
  .m-colors.is-overflow::-webkit-scrollbar-thumb{background:#dcdfe3;border-radius:99px}
  .m-colors.is-overflow::-webkit-scrollbar-track{background:transparent}
  .cchip{display:inline-flex;align-items:center;gap:6px;border:1px solid #dcdfe3;border-radius:999px;
    padding:8px 12px 8px 16px;font-size:14px;background:#fff;flex-shrink:0;color:#141519}
  .cchip .cname{cursor:pointer;white-space:nowrap}
  .cchip .cname:hover{text-decoration:underline}
  .cchip .x{border:0;background:transparent;color:#9aa0a8;cursor:pointer;font-size:15px;padding:0 2px;line-height:1}
  .cchip .x:hover{color:#c0392b}
  .add-c{width:36px;height:36px;border-radius:999px;border:1px solid #e3e5e8;background:#fff;color:#b9bec6;
    font-size:18px;cursor:pointer;line-height:1;flex-shrink:0}
  .add-c:hover{border-color:#141519;color:#141519}
  .empty-tip{color:var(--tx2);font-size:13px}
  /* 上传区：单行不换行，多了横向滚（设计稿要求左右滑动）。
     ⛔ 两个坑必须同时避开，否则永远滚不动：
     ① 父级 .card 是 flex column，子项默认 min-width:auto 会被内容撑大 →
        必须给 .uprow 加 min-width:0，它才肯被限制在卡片宽度内。
     ② 子项 .upbox 要 flex:0 0 auto，否则会被压缩到容器宽度、永远不溢出。
     ⛔ 滚动条外观：设计稿原型用的是「系统原生」滚动条（两端带箭头那种），
        所以这里**不要**写 ::-webkit-scrollbar —— 一旦写了就会被切成自定义细条，
        和设计稿对不上。图片少时由 overflow-x:auto 保证完全不出现滚动条。 */
  .uprow{display:flex;gap:14px;flex-wrap:nowrap;margin:16px 0 4px;
    min-width:0;width:100%;max-width:100%;flex-shrink:0;
    overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;
    padding-bottom:2px;scrollbar-width:auto;-ms-overflow-style:auto}
  .uprow>.upbox{flex:0 0 auto}
  .uprow.is-overflow{padding-bottom:6px}
  /* 上传格：按设计稿——上半是图（白底），下半是色名条（与图之间有分隔线）。 */
  .upbox{width:190px;height:266px;border-radius:16px;border:1px solid #e3e5e8;background:#fff;
    display:flex;flex-direction:column;position:relative;overflow:hidden}
  .upbox .thumb{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:16px}
  .upbox img{max-width:100%;max-height:100%;object-fit:contain}
  .upbox .cname{border:0;border-top:1px solid #eceef1;padding:14px 10px;text-align:center;font-size:14px;
    color:#141519;flex-shrink:0;background:transparent;outline:none;font-family:inherit;width:100%}
  .upbox .cname::placeholder{color:#c2c6cc}
  .upbox .rm{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;border:0;
    background:rgba(0,0,0,.55);color:#fff;cursor:pointer;font-size:12px;line-height:1;z-index:2}
  .upbox.add{border:1px dashed #d4d8dd;background:#fff;cursor:pointer;color:var(--tx2);
    align-items:center;justify-content:center;text-align:center}
  .upbox.add:hover{border-color:#141519;color:#141519}
  .upbox.add .plus{font-size:30px;line-height:1;margin-bottom:14px;color:#b9bec6;font-weight:300}
  .upbox.add .tip{font-size:13px;text-align:center;padding:0 22px;line-height:1.7;color:#8b9098}
  .upbox.add:hover .plus,.upbox.add:hover .tip{color:#141519}
  .dropzone.over .upbox.add{border-color:#141519;background:#f6f7f8}
  /* ⛔ 右栏的这些块都是固定内容，一律 flex-shrink:0。
     .card 是 flex column 且高度由 JS 写死，只要高度算少一点，flex 就会按比例压扁它们；
     以前没有这道约束时，上传格被裁、56px 的胶囊按钮被压成 31px，页面既不报错也不提示。 */
  .row{display:flex;gap:14px;align-items:stretch;flex-wrap:wrap;flex-shrink:0}
  /* 型号名称：前缀固定、只改后面数字 */
  .name-field{flex:1;min-width:180px;display:flex;align-items:center;background:#f4f5f6;
    border-radius:16px;height:64px;padding:0 24px;gap:2px}
  .name-field .nf-label{color:var(--tx);white-space:nowrap;flex-shrink:0;font-size:15px}
  .name-field input{flex:1;min-width:0;border:0;background:transparent;outline:none;font:inherit;
    font-size:15px;color:var(--tx);padding:0}
  /* 型号名称为空时点提交 → 高亮提示（必填项） */
  .name-field.need{box-shadow:inset 0 0 0 2px #e8a3a3;background:#fdf3f3}
  .name-field.need .nf-label{color:#c0392b}
  .dark-btn{background:#141519;color:#fff;border:0;border-radius:16px;height:64px;padding:0 26px;
    font:inherit;font-size:15px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .dark-btn:hover{background:#2a2c31}
  /* 进度条默认隐藏：它 8px 高、浅灰、又紧贴上传区下方，很容易被当成「第二条滚动条」，
     拖动它当然没反应。只有真正开始上传时才由 JS 加 .on 显示。 */
  /* 进度条只出现在「提交中」弹窗里，所以默认不显示，由 .job-card 放开。 */
  .progress{display:none;height:8px;border-radius:999px;background:#ececee;margin:20px 0 18px;overflow:hidden}
  .progress i{display:block;height:100%;background:#141519;border-radius:999px;width:0;transition:width .3s}
  .big-btn{width:100%;height:56px;flex-shrink:0;border:0;border-radius:999px;background:#141519;color:#fff;
    font:600 15px/1 inherit;font-family:inherit;cursor:pointer;letter-spacing:.08em;margin-top:auto}
  .big-btn:hover{background:#2a2c31}
  .big-btn:disabled{opacity:.45;cursor:not-allowed}
  /* 有未提交改动时高亮 —— 删除类操作已改为自动提交，但改色名/改型号名
     等仍需要手动点提交，这里必须让「还没落盘」一眼可见。 */
  .big-btn.has-pending{background:#c8442a}
  .big-btn.has-pending:hover{background:#ad3a23}
  #pendingTip.warn{color:#c8442a;font-weight:600}
  .hint{color:var(--tx2);font-size:12px;line-height:1.7;flex-shrink:0}
  .link{color:var(--tx2);text-decoration:underline;cursor:pointer;background:none;border:0;font-size:12px;
    padding:0;font-family:inherit}
  /* 通用弹层 */
  .overlay{position:fixed;inset:0;background:rgba(20,21,25,.45);display:flex;align-items:center;
    justify-content:center;z-index:60;padding:20px}
  .overlay[hidden]{display:none}
  .ov-card{background:#fff;border-radius:20px;padding:24px;max-height:92vh;overflow:auto;width:640px;max-width:100%}
  .ov-card h3{margin:0 0 4px;font-size:16px}
  .ov-sub{color:var(--tx2);font-size:12px;margin:0 0 16px}
  /* 弹窗底部按钮：高度/宽度/圆角/字号必须完全一致，否则「取消」又矮又小、
     「确认提交上传」又高又大，并排放一起很别扭。min-width 取「确认提交上传」的自然宽度，
     两颗按钮就一样大了。样式对齐主界面底部那颗胶囊按钮。 */
  .ov-btns{display:flex;justify-content:flex-end;gap:12px;margin-top:18px}
  .ov-btns .ghost-btn,.ov-btns .dark-btn{
    height:48px;min-width:148px;padding:0 28px;border-radius:999px;
    font:inherit;font-size:14px;font-family:inherit;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center}
  .ov-btns .ghost-btn{background:#fff;color:var(--tx);border:1px solid var(--bd)}
  .ov-btns .ghost-btn:hover{border-color:#141519}
  .ov-btns .dark-btn{background:#141519;color:#fff;border:0}
  .ov-btns .dark-btn:hover{background:#2a2c31}
  .ov-btns button:disabled{opacity:.5;cursor:not-allowed}
  /* LOGO 定位面板 */
  .lp-card{background:#fff;border-radius:20px;padding:22px;width:680px;max-width:100%}
  .lp-stage-wrap{display:flex;gap:18px;flex-wrap:wrap}
  .lp-stage{position:relative;user-select:none;touch-action:none;flex:0 0 auto;background:
    repeating-conic-gradient(#eef0f2 0% 25%,#fff 0% 50%) 50% / 16px 16px;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
  /* 底图撑满 stage；LOGO 必须排除在外，否则会被 width:100% 覆盖掉 inline 尺寸 */
  .lp-stage>img:not(.lp-logo),.lp-stage>canvas{display:block;width:100%;height:auto}
  .lp-logo{position:absolute;cursor:grab;pointer-events:auto;width:auto;max-width:none}
  .lp-logo:active{cursor:grabbing}
  /* 底图 404 时不许塌成一条灰线：给最小高度 + 居中说明（.stage-err 由 stageImgGuard 插入） */
  .lp-stage.bad{min-height:150px}
  .lp-stage .stage-err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:12px;font-size:12px;line-height:1.6;color:#c8442a;background:#fff;z-index:9;word-break:break-all}
  .lp-ctrl{flex:1;min-width:180px}
  .lp-ctrl label{display:block;font-size:12px;color:var(--tx2);margin:10px 0 4px}
  .lp-ctrl input[type=number]{width:100%;height:36px;border:1px solid var(--bd);border-radius:8px;padding:0 10px;font:inherit}
  .lp-ctrl input[type=color]{width:100%;height:36px;border:1px solid var(--bd);border-radius:8px;padding:2px;background:#fff}
  .lp-pos{font-size:12px;color:var(--tx2);margin-top:10px}
  .lp-btns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .lp-btns .ghost-btn,.lp-btns .dark-btn{height:42px;border-radius:10px;font:inherit;cursor:pointer;white-space:nowrap}
  .lp-add{width:100%;height:46px;margin-bottom:10px;border-radius:10px}
  .lp-add[hidden]{display:none}
  .lp-none{font-size:12.5px;color:var(--tx2);line-height:1.65;margin:0 0 6px}
  .lp-none[hidden]{display:none}
  /* LOGO 画布 = 前端同一套 fabric（2026-10-05 用户：「直接把前端的代码拿来复用」）。
     ⛔ 后台不再自绘选框：手柄样式 / 命中判定 / 旋转柄与连线 / 等比缩放
        全部由 fabric 自己渲染，所以 .lp-ctl 那一整套手写几何已删除。
     ⛔ 必须有**显式高度**：旧实现靠内部 <img> 撑开高度，换成 fabric 后
        canvas 是绝对定位，容器会塌成一条线（实测 320×10）。 */
  .lp-stage{aspect-ratio:1/1}
  .lp-stage canvas{display:block}
  .lp-stage .canvas-container{width:100%!important;height:100%!important;border-radius:9px}
  .lp-fields.off{opacity:.45;pointer-events:none}
  /* LOGO 图形来源行（2026-10-08 新增「上传自定义 LOGO」）：
     默认字标 / 用户上传的图 二选一，同一行里给缩略图 + 名称 + 两个操作按钮。
     ⛔ .lp-src 只描述外观，不参与布局计算；宽度由 .lp-ctrl 决定。 */
  .lp-src{display:flex;align-items:center;gap:8px;margin:0 0 12px;
          padding:8px 10px;border:1px solid var(--bd);border-radius:9px;background:var(--gray)}
  .lp-src-thumb{flex:0 0 30px;height:30px;border-radius:6px;display:flex;
                align-items:center;justify-content:center;overflow:hidden;
                background:#fff;border:1px solid var(--bd)}
  .lp-src-thumb img{max-width:26px;max-height:26px;object-fit:contain;display:block}
  .lp-src-thumb svg{max-width:26px;max-height:26px;display:block}
  .lp-src-name{flex:1;min-width:0;font-size:12.5px;color:var(--tx2);
               white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lp-src .mini-dark{flex:0 0 auto;height:30px;padding:0 11px;border-radius:7px;
                     font-size:12px;white-space:nowrap;cursor:pointer}
  .lp-src .mini-dark[hidden]{display:none}
  /* ⛔ 2026-10-08（第八轮）：颜色行 = 色盘 + 「使用此颜色」勾选。
     不勾 = 保留上传图的原本颜色（用户明确要求的新默认）；
     勾上 = 用左边这个颜色去刷整张图（覆盖原色）。 */
  .lp-color-row{display:flex;align-items:center;gap:10px;margin:0 0 12px}
  .lp-color-row #lpColor{flex:0 0 auto;width:52px;height:34px;padding:2px;border:1px solid var(--bd,#dcdfe4);
                         border-radius:8px;background:#fff;cursor:pointer}
  .lp-color-row #lpColor:disabled{opacity:.45;cursor:default}
  .lp-color-use{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--tx2);
                cursor:pointer;user-select:none;white-space:nowrap}
  .lp-color-use input{width:14px;height:14px;accent-color:#1938D7;cursor:pointer;margin:0}
  .lp-color-use input:disabled{cursor:default}
  /* LOGO 列表（2026-10-08 起一个型号可放 1~3 个品牌 LOGO，各自独立的位置/尺寸/角度/颜色/图形）。
     交互与「安全区」面板的 .zn-list 同一套：点一行 = 选中那一个，右侧参数区跟着切过去。
     ⛔ .lp-list 自己**不是**滚动容器以外的东西：行高固定、超出滚，避免长列表把
        弹窗撑高（.lp-card 有 max-height）。 */
  .lp-list-head{display:flex;align-items:center;gap:8px;margin:0 0 6px}
  .lp-list-head b{flex:1;font-size:12px;font-weight:500;color:var(--tx2)}
  .lp-list-head button{flex:0 0 auto;height:28px;padding:0 10px;border-radius:7px;
                       font-size:12px;white-space:nowrap;cursor:pointer}
  .lp-list-head button[hidden]{display:none}
  .lp-list-head button:disabled{opacity:.45;cursor:not-allowed}
  .lp-list{border:1px solid var(--bd);border-radius:8px;max-height:132px;overflow:auto;margin:0 0 4px}
  .lp-list[hidden]{display:none}
  .lp-row{display:flex;align-items:center;gap:8px;padding:6px 8px;font-size:12.5px;
          cursor:pointer;border-bottom:1px solid #f0f1f3}
  .lp-row:last-child{border-bottom:0}
  .lp-row.sel{background:#f1f2f4}
  .lp-row .lp-row-th{flex:0 0 24px;height:24px;border-radius:5px;display:flex;
                     align-items:center;justify-content:center;overflow:hidden;
                     background:#fff;border:1px solid var(--bd)}
  .lp-row .lp-row-th img{max-width:20px;max-height:20px;object-fit:contain;display:block}
  .lp-row .lp-row-th svg{max-width:20px;max-height:20px;display:block}
  .lp-row i{flex:1;font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lp-row b{font-weight:500;font-size:11.5px;color:var(--tx2);white-space:nowrap}
  .lp-row .lp-row-del{flex:0 0 auto;width:22px;height:22px;padding:0;border-radius:6px;
                      border:1px solid var(--bd);background:#fff;color:#c0392b;
                      font-size:13px;line-height:1;cursor:pointer}
  .lp-row .lp-row-del:hover{border-color:#f0c8c8;background:#fdf4f3}
  /* 安全区（可定制范围）编辑面板 */
  .zn-dim{position:absolute;background:rgba(20,21,25,.26);pointer-events:none;z-index:1}
  .zn-zone{position:absolute;box-sizing:border-box;border:1.5px dashed #c0392b;background:rgba(192,57,43,.10);cursor:move;z-index:3}
  .zn-zone.sel{border-style:solid;border-color:#141519;background:rgba(20,21,25,.12);z-index:5;box-shadow:0 0 0 2px rgba(255,255,255,.65)}
  .zn-zone>span{position:absolute;left:3px;top:3px;font-size:10px;line-height:1.3;color:#fff;background:rgba(20,21,25,.62);padding:1px 4px;border-radius:3px;pointer-events:none;white-space:nowrap}
  .zn-grip{position:absolute;right:-7px;bottom:-7px;width:14px;height:14px;background:#141519;border:2px solid #fff;border-radius:3px;cursor:nwse-resize;z-index:6;display:none}
  .zn-zone.sel .zn-grip{display:block}
  /* ⛔ 2026-10-05 用户要求：画布上的品牌LOGO**去掉虚线框，直接显示 LOGO 本体**
     （原来是一圈 `1px dashed #7a7d85` 的占位轮廓）。
     现在的做法：位置标记保留（仍然只读、不吃鼠标事件），但边框透明 ——
     真正的 LOGO 图由下面的 <img class="zn-logo"> 叠在同位置画出来。 */
  .zn-brand{position:absolute;border:0;pointer-events:none;z-index:2}
  /* 画布上的品牌LOGO 本体：与 .zn-brand 同位置同尺寸，只读参考。
     z-index 夹在「区外淡化(1)」与「安全区框(4)」之间 ——
     这样它盖得住淡化遮罩、又盖不住安全区的选中框和把手。 */
  .zn-logo{position:absolute;pointer-events:none;z-index:2;object-fit:contain}
  .zn-list{border:1px solid var(--bd);border-radius:8px;max-height:132px;overflow:auto;margin-bottom:4px}
  .zn-row{display:flex;align-items:center;gap:8px;padding:6px 8px;font-size:12.5px;cursor:pointer;border-bottom:1px solid #f0f1f3}
  .zn-row:last-child{border-bottom:0}
  .zn-row.sel{background:#f1f2f4}
  .zn-row i{flex:1;font-style:normal}
  .zn-row b{font-weight:500;font-size:11.5px;color:var(--tx2)}
  .zn-flag{font-size:11.5px;line-height:1.6;margin:8px 0 0}
  .zn-flag.bad{color:#c0392b}
  .zn-flag[hidden]{display:none}
  /* 型号卡上的「安全区」按钮：已经配过安全区的型号用红底标出来，一眼能看出哪些还没画。
     ⛔ 文案不再带数量后缀（2026-10-05 用户：「安全区 后面都不要带数字」）。 */
  .mini-dark.zn-on{background:#c0392b}
  .mini-dark.zn-on:hover{background:#a93226}
  /* 型号卡上的「品牌LOGO定位」按钮（2026-10-05 用户要求）：
     未定位 = 墨色（沿用 .mini-dark 底色 #141519）；已定位 = 红底。
     ⛔ 与「安全区」按钮同一套语义：红 = 这个型号已经配好了。 */
  .mini-dark.lp-on{background:#c0392b}
  .mini-dark.lp-on:hover{background:#a93226}
  /* 置顶按钮（2026-10-05 用户给出设计稿 + 置顶.svg，重做两态）。
     ⛔ 未置顶 = 白底 + 1px 浅灰描边圆角方按钮 + **灰色**图标；
        已置顶 = 红底 + **白色**图标。两态只切换 color / background / border-color。
     ⛔⛔ 图标必须是**内联 `<svg>`**，不能用 `<img src="icon-pin.svg">`：
        `<img>` 是替换元素，SVG 里的 `fill="currentColor"` **取不到外层文字色**，
        `color:#C1C1C1` 对它完全无效 → 图标恒为默认黑（2026-10-05 用户报的就是这个）。
        只有内联 SVG 的 `currentColor` 才会继承 `color`。 */
  .mini-dark.m-pin{padding:0;width:34px;height:34px;flex:0 0 34px;
    display:inline-flex;align-items:center;justify-content:center;
    background:#fff;border:1px solid #e3e5e8;border-radius:9px;
    transition:background .15s,border-color .15s,box-shadow .15s}
  .mini-dark.m-pin .ico-pin{display:block;width:13px;height:14px;flex:0 0 auto;
    color:#C1C1C1;transition:color .15s}
  .mini-dark.m-pin:hover{background:#fafbfc;border-color:#d5d9dd}
  .mini-dark.m-pin:hover .ico-pin{color:#a8adb3}
  .mini-dark.m-pin.pin-on{background:#C0392B;border-color:#C0392B}
  .mini-dark.m-pin.pin-on .ico-pin{color:#fff}
  .mini-dark.m-pin.pin-on:hover{background:#a93226;border-color:#a93226}
  .ghost-btn:disabled{opacity:.45;cursor:not-allowed}
  .ghost-btn{background:#fff;color:var(--tx);border:1px solid var(--bd);border-radius:10px;height:40px;padding:0 16px;font:inherit;cursor:pointer}
  .ghost-btn:hover{border-color:#141519}
  .ghost-btn.warn{color:#c0392b;border-color:#f0c8c8}
  /* token 弹层 */
  .tp-card{background:#fff;border-radius:20px;padding:24px;width:520px;max-width:100%}
  .tp-card h3{margin:0 0 12px;font-size:15px}
  .tp-card input{width:100%;height:44px;border:1px solid var(--bd);border-radius:10px;padding:0 14px;font:inherit;margin-bottom:12px}
  .log{white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:#f6f7f8;border-radius:8px;padding:10px;max-height:180px;overflow:auto;color:#333;display:none}
  /* 提交中弹窗。里面的进度条与明细日志常显 —— 默认都带 display:none，靠这里放开。 */
  .job-card{background:#fff;border-radius:20px;padding:24px;width:520px;max-width:100%}
  .job-card h3{margin:0 0 16px;font-size:15px}
  .job-card .progress{display:block;margin:0 0 14px}
  .job-card .log{display:block;max-height:200px}
  .job-card .hint{margin:14px 0 0}
  /* 常驻环境条：顶栏里的一行小字，只做说明与排障，不参与任何交互 */
  .env-chip{margin-left:14px;max-width:calc(100% - 260px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;font-size:12px;line-height:1.5;letter-spacing:.02em;padding:5px 12px;border-radius:8px;
    background:#f2f3f5;color:#4a4d55;border:1px solid #e3e4e8}
  .env-chip.dev{background:#fff6e6;color:#8a5a12;border-color:#f0dcb4}
  .env-chip.prod{background:#eaf5ee;color:#1e6b41;border-color:#c9e6d6}
  .env-chip[hidden]{display:none}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
</head>
<body>

<!-- 登录 -->
<div id="gate">
  <div class="login-card">
    <img class="brand" src="logo.svg" alt="MARK RYDEN">
    <div class="field"><span>账号：</span><input id="acc" autocomplete="username"></div>
    <div class="field"><span>密码：</span><input id="pwd" type="password" autocomplete="current-password">
      <button class="eye" id="eye" title="显示/隐藏密码">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.8"/></svg>
      </button>
    </div>
    <button class="login-btn" id="btnLogin">进入定制页后台</button>
    <p id="gateErr"></p>
  </div>
</div>

<!-- 主界面 -->
<div id="main" hidden>
  <header class="topbar">
    <img class="brand" src="logo.svg" alt="MARK RYDEN">
    <span class="env-chip" id="envChip" hidden></span>
    <div class="topbar-right">
      <button class="gh-btn" id="btnToken"><span class="dot"></span><span id="ghText">连接GitHub</span></button>
      <button class="logout-btn" id="btnLogout">退出登录</button>
    </div>
  </header>
  <div class="cols">
    <section class="card">
      <div class="card-head">
        <h2>现有型号</h2>
        <div class="search-box" id="searchBox">
          <span class="s-label">搜索</span>
          <input class="s-input" type="text" id="search" placeholder="型号">
          <div class="s-btn" id="searchBtn" title="搜索">
            <svg viewBox="0 0 24 24" fill="none" stroke="#141519" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
          </div>
        </div>
      </div>
      <div class="m-list" id="list"></div>
    </section>
    <section class="card dropzone">
      <h2 id="upTitle">新增型号与图片</h2>
      <div class="row">
        <div class="name-field">
          <span class="nf-label">型号名称：</span><input id="newModel" placeholder="9031" spellcheck="false">
        </div>
        <button class="dark-btn" id="btnLogoPos">品牌LOGO定位</button>
      </div>
      <div class="uprow" id="previews"></div>
      <input type="file" id="file" accept="image/png,image/jpeg,image/webp" multiple hidden>
      <button class="big-btn" id="btnPublish">确认提交上传</button>
      <p class="hint" style="margin-top:12px">
        图片要求 PNG、宽 1000 或 1000 的倍数（1000px = 100cm）。<span id="pendingTip"></span>
        <button class="link" id="btnDiscard">放弃改动</button>
      </p>
    </section>
  </div>
</div>

<!-- 本机草稿角标（仅本地出现；线上永远 hidden）
     固定定位、不进文档流，所以不会动到任何既有布局与断言。
     在 #main 之外：登录页也看得到，方便确认「上次本地改的那版还在不在」。 -->
<style id="mr-draft-badge-css">
.draft-badge{position:fixed;left:12px;bottom:46px;z-index:2147483000;display:flex;align-items:center;gap:7px;
  padding:6px 13px;border:0;border-radius:999px;background:rgba(198,132,26,.95);color:#fff;cursor:pointer;
  font:12px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;
  letter-spacing:.02em;box-shadow:0 2px 10px rgba(0,0,0,.22)}
.draft-badge[hidden]{display:none}
.draft-badge i{width:7px;height:7px;border-radius:50%;background:#fff;flex:0 0 auto}
.draft-badge u{text-decoration:underline;text-underline-offset:2px}
</style>
<button class="draft-badge" id="btnDraft" type="button" hidden><i></i><span id="draftText"></span></button>

<!-- 修改图片弹窗 -->
<div class="overlay" id="imgPanel" hidden>
  <div class="ov-card" style="width:720px">
    <h3 id="ipTitle">修改图片</h3>
    <!-- ⛔ 2026-10-05 用户要求删掉这段说明（「共 2 个配色。新传的同名颜色会替换原图，
         新颜色会追加；方框按全部配色统一重算。」）。元素保留 —— 它同时充当
         「正在读取现有配色…」「正在解码 N 张图…」的进度播报位，只是不再写说明性长文案。 -->
    <p class="ov-sub" id="ipSub"></p>
    <div class="uprow" id="ipPreviews"></div>
    <input type="file" id="ipFile" accept="image/png,image/jpeg,image/webp" multiple hidden>
    <div class="ov-btns">
      <button class="ghost-btn" id="ipCancel">取消</button>
      <!-- ⛔ 2026-10-05 用户要求：弹窗右下角按钮文案从「确认提交上传」改为「确认」。
           ⛔ 只改这个弹窗；主界面底部那颗 #btnPublish 仍是「确认提交上传」，别一起改。 -->
      <button class="dark-btn" id="ipSave">确认</button>
    </div>
  </div>
</div>

<!-- LOGO 定位面板 -->
<div class="overlay" id="logoPanel" hidden>
  <div class="lp-card">
    <h3 id="lpTitle">品牌LOGO定位</h3>
    <div class="lp-stage-wrap">
      <div style="flex:0 0 320px">
        <div class="lp-stage" id="lpStage" style="width:320px"></div>
        <p class="lp-pos" id="lpPos"></p>
      </div>
      <div class="lp-ctrl">
        <!-- ⛔ 品牌LOGO 一律由用户显式添加：进面板时不会「默认已经放好一个 LOGO」，
             否则用户会以为这个型号本来就有、或者已经保存过了。
             没有 LOGO 时右侧控件全部禁用，只留这一个添加按钮可点。 -->
        <button class="dark-btn lp-add" id="lpAdd">＋ 添加品牌LOGO</button>
        <p class="lp-none" id="lpNone">这个型号还没有品牌LOGO，点上面的按钮添加（默认落在画布正中心）。</p>
        <div class="lp-fields" id="lpFields">
        <!-- ⛔ 2026-10-08 起一个型号可放 1~3 个品牌 LOGO（各自的位置/尺寸/角度/颜色/图形独立）。
             下面是列表头 + 列表本体：只有 1 个时列表默认收起但**不隐藏头部**，
             否则用户在单个 LOGO 的型号上看不到「再加一个」的入口。
             ⛔ 别把列表做成唯一入口 —— 「＋ 添加品牌LOGO」在 0 个时仍要独立可用。 -->
        <div class="lp-list-head">
          <b id="lpListCap">品牌LOGO（1/3）</b>
          <button class="mini-dark" id="lpAdd2" type="button">＋ 再添加一个</button>
        </div>
        <div class="lp-list" id="lpList" hidden></div>
        <label>LOGO 图形</label>
        <div class="lp-src" id="lpSrcRow">
          <span class="lp-src-thumb" id="lpSrcThumb"></span>
          <span class="lp-src-name" id="lpSrcName">默认字标</span>
          <button class="mini-dark" id="lpUpBtn" type="button">上传自定义</button>
          <button class="mini-dark" id="lpRstBtn" type="button" hidden>恢复默认</button>
        </div>
        <input type="file" id="lpFile" accept="image/png,image/jpeg,image/webp" hidden>
        <label>字标长度（mm）</label><input type="number" id="lpLen" step="1" min="5" max="300">
        <label>旋转角度（顺时针，度）</label><input type="number" id="lpRot" step="1">
        <label>颜色</label>
        <div class="lp-color-row">
          <input type="color" id="lpColor" value="#a6a7ac">
          <label class="lp-color-use" title="不勾选 = 保留上传图片的原本颜色">
            <input type="checkbox" id="lpColorPicked"> 使用此颜色
          </label>
        </div>
        </div>
        <div class="lp-btns">
          <button class="ghost-btn warn" id="lpClear" style="flex:1 1 100%">清除该型号LOGO</button>
          <button class="ghost-btn" id="lpCancel" style="flex:1">取消</button>
          <button class="dark-btn" id="lpSave" style="flex:1">保存定位</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 安全区（可定制范围）编辑面板 -->
<div class="overlay" id="zonePanel" hidden>
  <div class="lp-card">
    <h3 id="znTitle">安全区</h3>
    <div class="lp-stage-wrap">
      <div style="flex:0 0 320px">
        <div class="lp-stage" id="znStage" style="width:320px"></div>
        <p class="lp-pos" id="znPos"></p>
      </div>
      <div class="lp-ctrl">
        <button class="dark-btn lp-add" id="znAdd">＋ 添加安全区</button>
        <!-- ⛔ 2026-10-05 用户要求：删掉「这个型号还没有安全区，客户 LOGO 可以放在
             画布任意位置。点上面的按钮开始画。」这句说明。
             元素保留（套件与 renderZonePanel 都还引用 #znNone），

function token(){return localStorage.getItem(TK)||'';}
function gh(path,opt){
  opt=opt||{};
  var h={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  if(token())h.Authorization='Bearer '+token();
  if(opt.body)h['Content-Type']='application/json';
  return fetch(API+path,{method:opt.method||'GET',headers:h,body:opt.body}).then(function(r){
    return r.json().then(function(j){
      if(!r.ok)throw new Error((j&&j.message)||('HTTP '+r.status));

function ghFile(path){

/* ⛔⛔ 2026-10-08：写入**不许静默跳过**（用户报「自定义LOGO 上传后消失」的真凶之一）。
   静默跳过会让调用方以为「上传成功」，于是配置里写下一个指向不存在文件的路径 ——
   前端取图 404、LOGO 消失，而且中间没有任何一处报错，极难排查。
   正式版里本页写的就是正式的 models.json 与根目录素材，一律放行。
   ⛔ 这个函数必须保留本体：ghPut / ghDel 里各调一次，删了就是 ReferenceError。 */
function assertWritable(path){
  return;

function ghPut(path,b64,msg,sha){
  assertWritable(path);
  var body={message:msg,content:b64,branch:BRANCH};
  if(sha)body.sha=sha;
  return gh(path,{method:'PUT',body:JSON.stringify(body)});

function ghDel(path,sha,msg){
  assertWritable(path);

/* ========== 读取配置 ========== */
/* base64 → UTF-8 文本。api.github.com 的 contents 端点返回 base64，
   配置里有中文色名，不能 atob 了事，必须按 UTF-8 还原。
   ⛔ 不要用 decodeURIComponent(escape(...))：escape 对部分字节会产出 %uXXXX，
   decodeURIComponent 直接抛 URI malformed，把整条读取打掉、静默退回 CDN，修复等于没做。 */
function b64ToText(b64){
  var bin=atob(String(b64).replace(/\s/g,''));
  var arr=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(arr);
}
/* ⛔ 读取顺序固定为：api.github.com → 同源文件 → raw.githubusercontent.com。
   为什么 api 优先：raw 是 CDN，带 Cache-Control: max-age=300。提交写回成功后立刻重读，
   会拿到 5 分钟前的旧配置并把页面状态覆盖回去 —— 表现就是「删了型号，刷新它又回来了」。
   api 的 contents 端点没有 CDN 缓存，公开仓库不登录也能读。
   同源文件排第二：带 ?t= 的 URL 在 Pages 上是缓存未命中，会回源取最新文件。
   raw 排最后：它是最可能仍在发旧内容的一环，只当兜底。
   ⛔ 光靠顺序不够用：实测出现过「刚写回、api 仍返回上一版」，所以再加一道 updatedAt 防线 ——
   读回来的版本比本机刚写回的还旧，就判定读到的是缓存副本，直接采用本机快照。 */
function loadModels(){
  /* ⛔ 本地有草稿就直接用它，不发那三个请求 —— 本地要看的就是「本机刚存的那一版」，
     这正是三级门禁第①级要验的东西。
     ⛔ 前置的 IS_LOCAL 不能省：dkGet() 自己不判环境，少了它，只要线上那台机器的
        localStorage 里恰好有同名键，线上后台就会被本机草稿接管 —— 事故级。
        （草稿只在本地写，所以线上正常也读不到；但这条防线必须显式写着。） */
  var dk=IS_LOCAL?dkGet():null;
  if(dk&&dk.cfg&&dk.cfg.models){
    lastSrc='本机草稿';
    lastRead='本机草稿 '+draftStamp();
    state.models=dk.cfg.models;
    state.pinnedCount=dk.cfg.pinnedCount;
    state.dirty=false;state.puts=[];state.dels=[];state.pendingCopy=[];
    draft={model:'',items:[],editKey:'',geo:null,brandLogo:null,brandLogos:null};
    $('newModel').value='';
    $('upTitle').textContent='新增型号与图片';
    renderList();renderPreviews();refreshPending();syncDraftChip();
    /* ⛔ 不许静默：必须说清「这是本机草稿、没上传线上」，并给出回到线上版的办法 */
    toastMsg('本地草稿模式：当前是 '+draftStamp()+' 存的本机草稿（未上传线上）。点左下角角标可清掉它、读回线上配置。');
    return Promise.resolve(state.models);
  }
  var src='api';
  return fetch(API+CFG+'?t='+Date.now(),{cache:'no-store'}).then(function(r){
    if(!r.ok)throw new Error('api 读不到 '+CFG);
    return r.json();
  }).then(function(j){
    if(!j||!j.content)throw new Error('api 返回里没有 content');
    return JSON.parse(b64ToText(j.content));
  }).catch(function(){
    src='同源文件';
    return fetch(CFG+'?t='+Date.now(),{cache:'no-store'}).then(function(r){
      if(!r.ok)throw new Error('同源读不到 '+CFG);
      return r.json();
    });
  }).catch(function(){
    src='raw CDN 缓存';
    return fetch(RAW+'?t='+Date.now(),{cache:'no-store'}).then(function(r){
      if(!r.ok)throw new Error('线上还没有 '+CFG);
      return r.json();
    });
  }).then(function(j){
    /* ---- 拒绝用旧版本覆盖新版本 ---- */
    var lw=lwGet();
    if(lw&&lw.cfg){
      var lt=Date.parse(lw.updatedAt||''), rt=Date.parse((j&&j.updatedAt)||'');
      if(rt&&lt&&rt>=lt)lwDrop();               /* 线上已追平本机写回的那版，快照退休 */
      else if(Date.now()-lw.t<1800000){         /* 快照只在 30 分钟内作数 */
        j=lw.cfg;src='本机刚写回的版本';
      }
    }
    lastSrc=src;      /* ⛔ 必须记在守卫之后：守卫会改写 src，记早了等于没记 */
    lastRead=src+' '+(j&&j.updatedAt?String(j.updatedAt).slice(5,16).replace('T',' '):'');
    state.models=(j&&j.models)||{};
    state.pinnedCount=(j&&j.pinnedCount);
    state.dirty=false;state.puts=[];state.dels=[];state.pendingCopy=[];
    draft={model:'',items:[],editKey:'',geo:null,brandLogo:null,brandLogos:null};
    $('newModel').value='';
    $('upTitle').textContent='新增型号与图片';
    renderList();renderPreviews();refreshPending();syncDraftChip();
    /* ⛔ 降级读取必须说出来。以前这里是静默 fallback：api 一旦读不到就悄悄换 CDN 缓存副本，
       用户看到的是「刚删掉的型号刷新又回来了」，却完全无从归因。 */
    if(src==='本机刚写回的版本')
      toastMsg('⚠ GitHub 缓存还没更新，本页采用本机最后写回的那一版（内容已提交，前端约 30–60 秒后同步）。');
    else if(src!=='api')
      toastMsg('⚠ 读到的是'+src+'，可能不是最新。稍等片刻再刷新；若持续如此，多半是 PAT 失效或网络受限。');
    return state.models;
  });
}

/* 颜色行只有真的放不下才出现横向滚动条：逐个量 scrollWidth 与 clientWidth。
   写完 innerHTML 立刻量拿不到正确值（字体还没算完），放到下一帧再测一次。 */
/* 只有真的放不下才显示滚动条：逐个比 scrollWidth 与 clientWidth。
   覆盖两处横向列表：型号卡里的颜色行 .m-colors、上传区 .uprow。 */
function markOverflow(){
  var rows=$('list').querySelectorAll('.m-colors');

/* 两栏等高：把较高一栏的高度写成 --card-h，另一栏跟着长。
   左栏型号多时先靠自身滚动，所以只量「内容高度」，不量被滚动截断后的可视高度。 */
/* 左栏列表最多露 3 张型号卡，第 4 张起靠内部滚动。
   ⛔ 2026-10-05 用户报「第三张卡最底部的边框被吞掉 1 像素」。根因有**两层**，
      只修第一层会看起来「好了一点但还是差一点」：
      ① `offsetHeight` 是**取整**的：单卡真实高 146.391px，取整成 146，
         三张各抹掉 0.391px 的零头，求和得 466px，比真实内容 467.173px 矮 1.173px。
      ② `scrollHeight` 会**被 max-height 反向夹住**，不能当「内容真实高度」用 ——
         这才是第一版修法（`Math.max(ceil(h), scrollHeight) + 1`）失败的原因：
         max-height 写 629px 后，scrollHeight 直接返回 clientHeight 628，
         于是 `max(max(466,628),628)+1 = 629` 把错误值放大而不是纠正。
      ✅ 正解：**用几何量「第 1 张卡顶边 → 第 3 张卡底边」的距离**，
         再向上取整。它不受 max-height 影响（rect 是真渲染位置），
         也自带亚像素精度。实测 467.173 → ceil → 468px，
         第 3 张卡底边 = 182 + 467.173 = 649.173，列表可视底边 = 182 + 468 = 650
         → 余量 +0.827px，底边框不再被吞。
   ⛔ 不要退回 offsetHeight 求和：三张卡零头叠加的误差会随卡高变化漂移。
   ⛔ 这段测量必须在下面那个「先置 none 再量」的窗口里做 ——
      提前把 --list-h 设成最小值会让列表滚动、rect 位置整体偏移，量出来就废了。 */
function syncListHeight(){
  var list=$('list');
  if(!list)return;
  list.style.setProperty('--list-h','none');
  var cards=list.querySelectorAll('.model-card');
  if(!cards.length)return;
  var n=Math.min(3,cards.length);
  /* 几何量：第 1 张卡顶边 → 第 n 张卡底边。
     间距已经包含在这段距离里，不用另外加 marginBottom。 */
  var m=cards[n-1].getBoundingClientRect().bottom-cards[0].getBoundingClientRect().top;
  list.style.setProperty('--list-h',Math.ceil(m)+'px');
}
function syncCardHeight(){
  var cards=document.querySelectorAll('.cols .card');
  if(cards.length<2)return;
  /* ⛔ 隐藏状态下 offsetHeight 一律是 0，写进 --card-h 会让卡片永远停在 min-height 地板。
     退出登录后窗口 resize 也会走到这里，所以这道守卫不能省。 */
  if($('main').hidden)return;
  cards.forEach(function(c){c.style.setProperty('--card-h','auto');});
  syncListHeight();
  /* ⛔ 测量前必须保证右栏的「＋」上传格已经生成。
     本函数是由 renderList() 调用的，而 renderPreviews() 排在它后面 —— 型号少的时候，
     量高度的这一刻右栏还没有上传格（整整少掉 266px），于是 --card-h 被写小、
     卡片掉到 min-height:420px 地板，接着 .upbox(266px) 被 .uprow(overflow-y:hidden)
     裁成 ~146px、.big-btn(56px) 被压成 31px，按钮正好压在上传格上。
     用户看到的就是「这个板块高度不对 / 按钮压住上传格」。 */
  var pv=$('previews');
  if(pv&&!pv.querySelector('.upbox'))renderPreviews();
  /* 先把左右两栏的高度差异量出来，再统一取较大的那个。 */
  var natural=0;
  cards.forEach(function(c){natural=Math.max(natural,c.offsetHeight);});
  /* 但不能无限长高：最多占视口的一部分，超出的部分让左栏型号列表自己滚。
     ⛔ 这个上限只能压左栏（左栏列表自己有滚动条），不能压右栏：
        右栏没有内部滚动，它的内容高度就是硬下限，压矮它 = 把上传格裁掉。 */
  var dz=document.querySelector('.dropzone');
  var rightNat=dz?dz.offsetHeight:0;
  var cap=Math.max(560,window.innerHeight-170);
  var want=Math.max(rightNat,Math.min(natural,cap));
  cards.forEach(function(c){c.style.setProperty('--card-h',want+'px');});
  /* 卡片被压到 cap 之后左栏列表的可用高度会变，再按实际剩余空间收敛一次，
     保证滚动条出现在列表内部、并且露出的正好是 3 张卡。 */
  syncListHeight();
}

/* ========== 型号顺序：人工置顶 + 人工拖拽（2026-09-30） ==========
   ⛔ 顺序的载体 = models.json 里 models 对象的 key 顺序（不加新字段）。
      前端 applyRemoteModels() 按 key 顺序重建 MODELS，下拉顺序天然跟着走 → 前端不用改。
   写回走 autoCommit()：它自己判 IS_LOCAL（本地落草稿 / 线上才 PUT），与删型号同一条路。 */
function modelKeys(){return Object.keys(state.models);}
/* ===== 置顶（2026-09-30 用户定：不限数量，能置顶也能取消置顶）=====
   ⛔ 不给每个型号加字段，只用一个顶层整数 pinnedCount。语义 =「models 的 key 顺序里，
      前 pinnedCount 个就是置顶区」。于是：
        置顶     = 移到第一位 + pinnedCount+1
        取消置顶 = 移到第 pinnedCount 位（离开置顶区）+ pinnedCount-1
   好处：物理顺序（= 前端下拉的真实顺序）与「谁被置顶」永远一致；拖拽跨过边界时
   置顶状态会自动跟着走，不会出现「标着已置顶却排在后面」的自相矛盾。 */
function clampPinned(n){
  var N=modelKeys().length;
  n=Math.floor(Number(n)||0);
  if(!(n>0))return 0;
  return n>N?N:n;
}
function pinnedCount(){state.pinnedCount=clampPinned(state.pinnedCount);return state.pinnedCount;}
function isPinned(k){var i=modelKeys().indexOf(k);return i>=0&&i<pinnedCount();}
/* 把 fromKey 挪到 toKey 的前面或后面，就地重排 state.models 的 key 顺序。
   ⛔ 必须「就地删光再按新顺序塞回」：state.models 的引用被很多地方持有（renderList / buildConfigJobs /
      写回时的 merged），整体替换成新对象会让那些引用指向旧数据。 */
function moveModelOrder(fromKey,toKey,after){
  var ks=modelKeys();
  var i=ks.indexOf(fromKey);if(i<0)return false;
  if(fromKey===toKey)return false;
  ks.splice(i,1);
  var j=ks.indexOf(toKey);if(j<0)return false;
  ks.splice(after?j+1:j,0,fromKey);
  var keep={};
  ks.forEach(function(k){keep[k]=state.models[k];});
  Object.keys(state.models).forEach(function(k){delete state.models[k];});
  ks.forEach(function(k){state.models[k]=keep[k];});
  return true;
}
function pinModelOrder(k){
  var ks=modelKeys();
  if(!ks.length)return false;
  var i=ks.indexOf(k);
  if(i<0)return false;
  if(i<pinnedCount())return false;          /* 已在置顶区里，不重复计数 */
  if(!moveModelOrder(k,ks[0],false))return false;
  state.pinnedCount=pinnedCount()+1;
  return true;
}
/* 取消置顶 = 离开置顶区，落在「非置顶区最前」（即新置顶区的紧后一位）。
   ⛔ 不能用 moveModelOrder(k,ks[n-1],true)：取消的恰好是置顶区最后一个时 toKey===fromKey，
   会被它当成「没动」直接返回 false。 */
function unpinModelOrder(k){
  var ks=modelKeys();
  var i=ks.indexOf(k);
  var n=pinnedCount();
  if(i<0||i>=n)return false;
  ks.splice(i,1);
  var t=n-1;
  if(t<0)t=0;
  ks.splice(t,0,k);
  var keep={};
  ks.forEach(function(x){keep[x]=state.models[x];});
  Object.keys(state.models).forEach(function(x){delete state.models[x];});
  ks.forEach(function(x){state.models[x]=keep[x];});
  state.pinnedCount=n-1;
  return true;
}
/* 顺序变了才写回。publishConfig()/saveLocalDraft() 成功时返回 'ok'（与删型号同一判据）。 */
function commitModelOrder(what){
  state.dirty=true;
  renderList();refreshPending();
  autoCommit(what||'调整型号顺序').then(function(r){
    if(r==='ok')toastMsg((what||'型号顺序')+' 已更新');
  });
}

function stageCopy(from,to){if(from!==to)state.pendingCopy.push({from:from,to:to});}
/* ⛔ 正式版：要删的就是正式素材，一律入删除队列（没有『受保护路径』这回事）。 */
function stageDel(path){if(path&&state.dels.indexOf(path)<0)state.dels.push(path);}
function stageNoticeTail(){

/* ========== 上传与裁切 ========== */
/* 把 dataURL 字符串转成 Blob，好让后面统一走 createImageBitmap 一条路。
   注意：createImageBitmap 不接受字符串（只收 Blob/Canvas/ImageBitmap 等），
   直接丢 dataURL 进去会抛 TypeError —— 这是「修改图片」弹窗读不出线上配色的根因。 */
function dataUrlToBlob(u){
  var i=u.indexOf(',');
  var head=u.slice(0,i),body=u.slice(i+1);
  var mime=(head.match(/data:([^;]+)/)||[])[1]||'image/png';
  var bin=atob(body);
  var arr=new Uint8Array(bin.length);
  for(var k=0;k<bin.length;k++)arr[k]=bin.charCodeAt(k);
  return new Blob([arr],{type:mime});
}
function readImage(fileOrBlob){
  /* 输入可能是 File/Blob（用户上传），也可能是 dataURL 字符串（从 GitHub 取回的线上图）。
     一律先归一成 Blob，再用 createImageBitmap 解码；预览用 ObjectURL。
     不要用 FileReader→dataURL 做预览：千像素 PNG 的 base64 有 1MB+，
     塞进 DOM 的 img.src 会让渲染线程长时间阻塞（实测直接卡死）。 */
  var blob=fileOrBlob;
  if(typeof fileOrBlob==='string'){
    try{blob=dataUrlToBlob(fileOrBlob);}catch(e){return Promise.reject(new Error('图片数据解析失败'));}
  }
  if(window.createImageBitmap&&blob instanceof Blob){
    return createImageBitmap(blob).then(function(bmp){
      var cv=document.createElement('canvas');
      cv.width=bmp.width;cv.height=bmp.height;
      cv.getContext('2d').drawImage(bmp,0,0);
      if(bmp.close)bmp.close();
      return {canvas:cv,W:cv.width,H:cv.height,url:URL.createObjectURL(blob),revoke:true};
    }).catch(function(){return readImageFallback(blob);});
  }
  return readImageFallback(blob);
}
/* 回退路径：createImageBitmap 不可用或解码失败时，用 <img> 解一次再画进 canvas。
   入参已由 readImage 归一成 Blob。 */
function readImageFallback(blob){
  if(!(blob instanceof Blob))return Promise.reject(new Error('图片解码失败'));
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(blob);
    var img=new Image();
    img.onload=function(){
      var cv=document.createElement('canvas');
      cv.width=img.naturalWidth;cv.height=img.naturalHeight;
      cv.getContext('2d').drawImage(img,0,0);
      res({canvas:cv,W:cv.width,H:cv.height,url:url,revoke:true});
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('图片解码失败'));};
    img.src=url;
  });
}
function bboxOf(cv){
  /* 逐像素遍历在 1000px 图上会让主线程卡死几秒（浏览器可能提示无响应）。
     这里只用 alpha 通道做「行/列扫描」：先取一次 ImageData（不可避免），
     但判断循环改成按行取 Uint8 视图 + 逐行提前退出，比双重 for 快一个量级。 */
  var W=cv.width,H=cv.height;
  var d=cv.getContext('2d').getImageData(0,0,W,H).data;
  var x0=W,y0=H,x1=-1,y1=-1;
  var i,y,x;
  for(y=0;y<H;y++){
    var row=y*W*4,rowHit=false;
    for(x=0;x<W;x++){
      if(d[row+x*4+3]>10){
        rowHit=true;
        if(x<x0)x0=x;
        if(x>x1)x1=x;
      }
    }
    if(rowHit){if(y<y0)y0=y;if(y>y1)y1=y;}
  }
  if(x1<0)throw new Error('图片全透明，找不到产品轮廓');
  return {W:W,H:H,x0:x0,x1:x1,y0:y0,y1:y1};
}
function cropTo(cv,cx,cy,side){
  var out=document.createElement('canvas');
  out.width=out.height=side;
  out.getContext('2d').drawImage(cv,-Math.round(cx-side/2),-Math.round(cy-side/2));
  return out;
}
function toBlob(cv,type,q){
  return new Promise(function(res){cv.toBlob(function(b){res(b);},type,q);});
}
function toB64(blob){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){var s=String(fr.result);res(s.slice(s.indexOf(',')+1));};
    fr.onerror=function(){rej(new Error('转换失败'));};
    fr.readAsDataURL(blob);
  });
}
function addFiles(files){
  var arr=[].slice.call(files||[]);
  if(!arr.length)return;
  var names=arr.map(function(f){return f.name||'';});
  Promise.all(arr.map(function(f){return readImage(f);})).then(function(list){
    list.forEach(function(it,i){
      var p=parseName(names[i]||'');
      /* bbox 计算放在解码后立刻做，但用 try 包住：单张图算不出来不该拖死整批 */
      var bx=null;
      try{bx=bboxOf(it.canvas);}catch(e){bx={W:it.W,H:it.H,x0:0,x1:it.W-1,y0:0,y1:it.H-1};}
      draft.items.push({label:p.color,name:names[i],canvas:it.canvas,W:it.W,H:it.H,
        bbox:bx,url:it.url,revoke:it.revoke});
      if(!draft.model&&p.model)draft.model=p.model;
    });
    /* 只有解析出真实型号时才回填输入框；解析不出来（文件名不规范）就保持原样，
       绝不要把文件名塞进「型号名称」。 */
    if(!$('newModel').value&&draft.model)$('newModel').value=draft.model;
    /* 让浏览器先画一帧，避免大图解码后紧接着的布局计算把主线程憋住 */
    return new Promise(function(r){requestAnimationFrame(function(){setTimeout(r,0);});});
  }).then(function(){
    renderPreviews();
  }).catch(function(e){alert(e.message||e);});
}
function removeItem(i){
  draft.items.splice(i,1);
  renderPreviews();
}
function renderPreviews(){
  var box=$('previews');

  draft.items.forEach(function(it,i){

  add.addEventListener('click',function(){$('file').click();});

/* 统一方框计算：同一型号所有配色取包围盒并集 + 四周固定留白，再取正方形。
   与 add_model.py 完全一致（这也是后台的价值：不用记住脚本参数）。
   warnEl 传 null 时不提示宽度不一致，由调用方自己判断。 */
function calcGeo(items,warnEl){
  if(!items.length)return null;
  var widths={};
  items.forEach(function(it){widths[it.W]=1;});
  var ws=Object.keys(widths).map(Number);
  if(ws.length>1){
    var msg='图片宽度不一致（'+ws.join(' / ')+'px），同一个型号必须用同样宽度的图。';
    if(warnEl){
      if(warnEl.dataset.shown==='1')warnEl.textContent=msg;
      else{warnEl.textContent=msg;warnEl.dataset.shown='1';}
    }
    return null;
  }
  if(warnEl&&warnEl.dataset.shown==='1'){warnEl.textContent='';warnEl.dataset.shown='0';}
  var W=ws[0],px=W/1000,pad=Math.round(PAD_MM*px);
  var ux0=Math.min.apply(null,items.map(function(i){return i.bbox.x0;}));
  var ux1=Math.max.apply(null,items.map(function(i){return i.bbox.x1;}));
  var uy0=Math.min.apply(null,items.map(function(i){return i.bbox.y0;}));
  var uy1=Math.max.apply(null,items.map(function(i){return i.bbox.y1;}));
  return {px:px,pad:pad,cx:(ux0+ux1)/2,cy:(uy0+uy1)/2,
    side:Math.max(ux1-ux0+1,uy1-uy0+1)+2*pad,W:W};
}
function calcDraft(){
  draft.geo=null;
  var items=draft.items;
  var warnEl=$('warnW');
  if(!items.length){if(warnEl)warnEl.textContent='';return null;}
  var g=calcGeo(items,warnEl);
  draft.geo=g;
  return g;
}

/* 编辑现有型号：弹窗形式。下载现有配色图 → 与上传图合并 → 统一重算方框。
   不再占用右侧「新增型号与图片」栏，避免把新增和修改两种意图混在一处。 */
function fetchExistingColors(key){
  var m=state.models[key];
  if(!m)return Promise.resolve([]);
  return Promise.all((m.colors||[]).map(function(c){
    /* 数据源由 colorSource() 决定：本地读本机图片仓/同源文件，线上读 GitHub contents。
       ⛔ 本地若仍走 GitHub，会拿回线上的**旧图** —— 方框按旧图重算，用户接着上传就被裁歪。 */
    return colorSource(c).then(function(src){
      return readImage(src).then(function(it){
        return {label:c.label||c.key,canvas:it.canvas,W:it.W,H:it.H,bbox:bboxOf(it.canvas),url:it.url,old:c};
      });
    }).catch(function(e){
      /* 单张读不到不该整批失败，但必须留下痕迹 —— 静默 return null 会让弹窗
         变成空白且毫无线索（曾经因为 createImageBitmap 不吃 dataURL 而全空）。 */
      console.warn('读取配色失败 '+c.image+'：'+(e&&e.message||e));
      return null;
    });
  })).then(function(list){return list.filter(Boolean);});
}
/* ⛔ removed = 本次在弹窗里「点 ×」删掉的配色（元素是原来的 color 对象）。
   为什么必须单独存一份：`ip.items` 里删掉的那个直接消失了，光看 items 根本
   推断不出「有东西被删」—— 于是点「确认」会被判成「没有检测到改动」而不提交
   （2026-10-05 用户报的正是这个：「删除了里面的图片后，点击保存 会弹窗提示『没有检测到改动』」）。
   存的是**引用**：提交时要靠 `old===c` 把原配色对象从 state.models 里挑出来做 del。 */
var ip={key:'',items:[],removed:[],loading:false};
function openImgPanel(k){
  ip.key=k;ip.items=[];ip.removed=[];ip.loading=true;
  /* ⛔ 2026-10-05 用户要求：标题只留型号名（去掉「修改图片 · 」前缀）。 */
  $('ipTitle').textContent=k;
  $('ipSub').textContent='正在读取现有配色…';
  $('ipPreviews').innerHTML='<p class="empty-tip">加载中…</p>';
  $('imgPanel').hidden=false;
  var m=state.models[k];
  var have=(m&&m.colors)||[];
  fetchExistingColors(k).then(function(list){
    ip.items=list;
    ip.loading=false;
    /* ⛔ 2026-10-05 用户要求：读完后不再显示「共 N 个配色。新传的同名颜色会替换原图…」
       那句说明，清空即可（进度播报位留给下面的解码/提交状态）。 */
    $('ipSub').textContent='';
    renderIpPreviews();
  }).catch(function(e){
    ip.loading=false;
    $('ipPreviews').innerHTML='<p class="empty-tip" style="color:#c0392b">读取失败：'+esc(e.message||e)+'</p>';
  });
}
function renderIpPreviews(){
  var box=$('ipPreviews');
  box.innerHTML='';
  ip.items.forEach(function(it,i){
    var d=document.createElement('div');
    d.className='upbox';
    var th=document.createElement('div');
    th.className='thumb';
    var img=document.createElement('img');
    img.src=it.url;
    th.appendChild(img);
    var inp=document.createElement('input');
    inp.className='cname';inp.value=it.label;
    inp.placeholder='点此填色名';
    inp.addEventListener('input',function(){it.label=inp.value;});
    var rm=document.createElement('button');
    rm.className='rm';rm.textContent='×';rm.title='删除该颜色';
    /* ⛔ 2026-10-05 用户要求：点 × 要先弹确认框，确认后才从弹窗里移除。
       ⛔ 这里只是「移出待提交列表」，**不落盘** —— 真正生效要等用户点右下角「确认」。
          （颜色是与型号图片一起提交的，所以不能在这里直接删线上。）
       ⛔ 必须把删掉的那条记进 `ip.removed`：只从 items 里 splice 掉的话，
          提交时无从得知「有东西被删」→ 会被判成「没有检测到改动」（2026-10-05 用户报的 bug）。 */
    rm.addEventListener('click',function(){

/* 把一批「已解码的图」打包成待上传数据。
   items 每项含 canvas/W/H/bbox/label；keepColors 是本次没重传、但要保留在 colors 里的旧配色。
   型号卡里两个「什么都不做也必须原样继承」的字段在这里兜底（见下方注释）。 */
function packUpload(items,model,keepColors,opt){
  opt=opt||{};
  var g=opt.geo||calcGeo(items,null);
  if(!g)return Promise.reject(new Error('图片宽度不一致，同一个型号必须用同样宽度的图'));
  var bad=items.filter(function(it){return !fileSlug(it.label);});
  if(bad.length)return Promise.reject(new Error('这些颜色名还没有英文名，告诉我我来加：'+
    bad.map(function(b){return b.label;}).join('、')));

  var key='MR_'+model,lower=model.toLowerCase();
  var prev=state.models[key]||null;
  /* 四个字段必须在后台「什么都不做」时原样继承，否则等于每次上传图片都把它们抹掉：
     · brandLogo  —— 品牌 LOGO 落点（老字段，正式版仍认它）。
     · brandLogos —— 品牌 LOGO 落点数组（2026-10-08 起，支持 1~3 个）。
     · logoMax  —— 用户可上传 LOGO 的尺寸上限。原本每个型号不同（如 9100 是 120×80），
                   早前这里写死 MAX_LOGO_MM(60×60)，导致只要从后台上传一次图片，
                   该型号的上限就被永久改成 60×60。
     · safeZones —— 可定制范围。用「修改」重传图片是很日常的操作，
                   丢了它等于安全区每次改图都要重画一遍。 */
  var keepLogo=opt.brandLogo||(prev&&prev.brandLogo)||null;
  var keepLogos=Array.isArray(opt.brandLogos)?opt.brandLogos
               :((prev&&Array.isArray(prev.brandLogos))?prev.brandLogos:null);
  var keepLogoMax=(prev&&prev.logoMax)||{wMm:MAX_LOGO_MM,hMm:MAX_LOGO_MM};
  var keepZones=(prev&&Array.isArray(prev.safeZones))?prev.safeZones:[];
  var out={key:key,model:{id:key,pxPerMm:g.px,canvasMm:Math.round(g.side/g.px*10)/10,
    logoMax:{wMm:Number(keepLogoMax.wMm)||MAX_LOGO_MM,hMm:Number(keepLogoMax.hMm)||MAX_LOGO_MM},
    colors:[]},files:[],keepColors:keepColors||[]};
  if(keepLogo)out.model.brandLogo=keepLogo;
  if(keepLogos&&keepLogos.length)out.model.brandLogos=keepLogos;
  if(keepZones.length)out.model.safeZones=keepZones;
  /* ⛔ 2026-10-08：新型号若带了自定义 LOGO，图必须跟着型号图片一起提交 ——
     配置里只有 src 路径，图不上传就是死链（前端取不到图，LOGO 直接不显示）。
     ⛔ 文件名用 **out.key 现算**，不能用 lpKey（新型号这时它还是空的）。
     ⛔ 支持多张：opt.customLogoBlobs = [{path,blob}]，各自独立上传。 */
  if(Array.isArray(opt.customLogoBlobs)&&opt.customLogoBlobs.length)out.customLogoBlobs=opt.customLogoBlobs;
  return Promise.all(items.map(function(it){
    var cv=cropTo(it.canvas,g.cx,g.cy,g.side);
    var base='mr_'+lower+'_'+fileSlug(it.label)+'_trim';
    return Promise.all([toBlob(cv,'image/png'),toBlob(cv,'image/webp',WEBP_Q)]).then(function(bs){
      out.files.push({path:base+'.png',blob:bs[0]},{path:base+'.webp',blob:bs[1]});
      out.model.colors.push({key:fileSlug(it.label),label:it.label.trim(),image:base+'.png',webp:base+'.webp'});
    });
  })).then(function(){
    /* 自定义 LOGO 图：跟在产品图后面一起进 files，走同一套上传通道 */
    if(out.customLogoBlobs&&out.customLogoBlobs.length){
      out.customLogoBlobs.forEach(function(f){if(f&&f.path&&f.blob)out.files.push(f);});
      delete out.customLogoBlobs;
    }
    return out;
  });
}

     （同一把 customLogoPath 尺子），否则配置里的 src 指向一个没人上传过的路径。
     ⛔ 只在还没有正式键名（lpKey 为空）时接管：覆盖已有型号时 buildUpload 不负责它，
        那条路走 lpSave 自己。 */
  var blobs=[];

/* ========== 本机图片仓（仅开发环境 / 第①级本地） ==========
   ⛔ 为什么必须有：本机草稿（localStorage）只装得下配置、装不下图片，
      于是「新增型号」在本地根本做不了 —— 纯新增图片不计入 pendingCount()，
      publish() 一路落到最后那句 toast，用户点「确认提交上传」只看到一行小灰字，像没反应。
   ⛔ 而「图片写不进浏览器」这个前提是错的：IndexedDB 存 Blob 是浏览器原生能力。
   做法：本地沿用**同一套裁切管线** packUpload（与线上逐字节同源），产出线上同名的
      *.png|*.webp，写进本机图片仓（key = 线上同名路径）；配置照旧写本机草稿。
      前端在开发环境启动时把图片仓预载成 objectURL，modelSrc() 优先命中
      → 「本地新增型号 → 前端跟着出现产品图」这条绑定在本地就能完整验证。
   ⛔ 全部关在 IS_LOCAL 分支内：线上走的 ghPut / models.json 一个字节都不经过这里。 */
var ASSET_DB='mr_local_assets';
function idbOpen(){
  return new Promise(function(res,rej){
    if(!window.indexedDB)return rej(new Error('这个浏览器不支持 IndexedDB，本机存不了图片'));
    var req;
    try{req=indexedDB.open(ASSET_DB,1);}catch(e){return rej(e);}
    req.onupgradeneeded=function(){var db=req.result;if(!db.objectStoreNames.contains('files'))db.createObjectStore('files');};
    req.onerror=function(){rej(req.error||new Error('打不开本机图片仓'));};
    req.onsuccess=function(){res(req.result);};
  });
}
function idbPutFiles(pairs){
  return idbOpen().then(function(db){
    return new Promise(function(res,rej){
      var tx,st;
      try{tx=db.transaction('files','readwrite');st=tx.objectStore('files');}catch(e){return rej(e);}
      pairs.forEach(function(p){st.put(p.blob,p.path);});
      tx.oncomplete=function(){res(pairs.length);};
      tx.onerror=function(){rej(tx.error||new Error('写入本机图片仓失败'));};
      tx.onabort=function(){rej(tx.error||new Error('写入本机图片仓被中止（多半是空间不足）'));};
    });
  });
}
/* 从本机图片仓删掉若干路径（删除配色时用）。
   ⛔ 删不掉不算致命：配置里已经不带这个颜色了，前端就不会去取它；
      图片仓里留个孤儿文件只是占点空间。所以**失败不抛**，只返回删了几个。 */
function idbDelFiles(paths){
  var arr=(paths||[]).filter(Boolean);
  if(!arr.length)return Promise.resolve(0);
  return idbOpen().then(function(db){
    return new Promise(function(res){
      var tx;
      try{tx=db.transaction('files','readwrite');}catch(e){return res(0);}
      var st=tx.objectStore('files');
      arr.forEach(function(p){try{st.delete(p);}catch(e){}});
      tx.oncomplete=function(){res(arr.length);};
      tx.onerror=function(){res(0);};
      tx.onabort=function(){res(0);};
    });
  }).catch(function(){return 0;});
}
function idbClearFiles(){
  return idbOpen().then(function(db){
    return new Promise(function(res){
      var tx;
      try{tx=db.transaction('files','readwrite');}catch(e){return res(0);}
      tx.objectStore('files').clear();
      tx.oncomplete=function(){res(1);};
      tx.onerror=function(){res(0);};
      tx.onabort=function(){res(0);};
    });
  }).catch(function(){return 0;});
}
/* ==== 本机图片仓：读取侧（仅开发环境） ====
   ⛔ 后台自己也会处于「本地重新上传过图」的状态：新图只落进图片仓（IDB），磁盘上没有。
      弹窗若照配置路径直接取文件 → 404 → <img> 高度塌成 16px → 整个左侧视图被压扁成一条
      （2026-09-17 用户报「安全区 / 品牌LOGO定位弹窗左边视图高度被压缩」的根因）。
      前端 test.html 早就有同款预载（localAssetsReady / modelSrc），后台缺这一层。
   做法与前端逐条对齐：解析期就异步预载成 objectURL 表，取图时同步查表，
   查不到就原样返回原路径 —— 线上/同源素材完全不受影响。 */
var adminAssetMap={};
/* ⛔⛔ 2026-10-08（第七轮）：把「扫本机图片仓 → 生成 objectURL 表」抽成可重复调用的函数。
   为什么必须能重扫：旧写法是**页面加载时扫一次就结账**（IIFE 一次性）。
   于是发生（用户报的「上传自定义LOGO → 提示成功 → 但图没更新/消失」的最底层一环）：
     ① 页面打开时扫 IDB —— 那时仓是空的 → adminAssetMap = {}；
     ② 用户传图 → 图确实写进了 IDB（key 正确）→ 配置里的 src 也写对了；
     ③ 关面板、重开 / 任何重新取图 → adminAssetUrl(路径) **查的是第①步那张空表** →
        查不到 → 原样返回相对路径 → 浏览器去请求 /logo-custom/xx_logo.png →
        **本地磁盘上根本没有这个文件**（它只在 IDB 里）→ 404 → 缩略图 0x0、画布上没图。
   ⛔ 所以：任何「往本机图片仓写文件」之后都必须再扫一次。
   ⛔ 不要每次 adminAssetUrl 都重扫（切色/拖动会被拖慢），只在写入后扫。 */
/* 写入本机图片仓后调用：就地补齐／刷新 objectURL 表。
   ⛔⛔ 2026-10-08（第七轮·第二处）：**必须允许覆盖同名 key**。
      旧写法加了 `&&!adminAssetMap[c.key]` 想"避免重复建 URL"，结果正好反了 ——
      自定义图路径按「型号+序号」命名，**替换图时路径不变**：
        ① 传 A → map['logo-custom/21_logo.png'] = blob:A
        ② 替换成 B → IDB 里的同名记录已变成 B，但重扫时因为 key 已存在 → **跳过**
        ③ 重开面板 → 仍旧拿 blob:A → 用户看到的还是第一张图
      这正是用户报的「替换后提示成功、但显示的还是第一次那张」。
      → 正确做法：**重扫一律以 IDB 当前内容为准**，同名就覆盖，
        并把旧的 objectURL 显式 revoke 掉（不 revoke 会泄漏内存）。
      ⛔ 注意：覆盖是安全的，因为重扫**只在写入完成后**发生，
        此时页面上的图都已渲染完；下一次渲染会拿到新 URL。 */
function adminAssetsScan(){
  if(!IS_LOCAL||!window.indexedDB)return Promise.resolve(0);
  return idbOpen().then(function(db){
    return new Promise(function(res){
      var cur;
      try{cur=db.transaction('files','readonly').objectStore('files').openCursor();}catch(e){return res(0);}
      var n=0;
      cur.onsuccess=function(){
        var c=cur.result;
        if(!c){res(n);return;}
        try{
          if(c.value instanceof Blob){
            var old=adminAssetMap[c.key];
            var nu=URL.createObjectURL(c.value);
            if(old&&old!==nu){try{URL.revokeObjectURL(old);}catch(e){}}
            adminAssetMap[c.key]=nu;
          }
        }catch(e){}
        n++;c.continue();
      };
      cur.onerror=function(){res(n);};
    });
  }).catch(function(){return 0;});
}
function adminAssetsRescan(){return adminAssetsScan();}
var adminAssetsPromise=adminAssetsScan();
function adminAssetUrl(p){
  if(!p||!IS_LOCAL)return p;
  if(adminAssetMap[p])return adminAssetMap[p];
  /* png / webp 互为兄弟文件：只有一边在仓里也认（与前端 modelSrc 同一策略） */
  var alt=/\.webp$/i.test(p)?p.replace(/\.webp$/i,'.png'):p.replace(/\.png$/i,'.webp');
  return adminAssetMap[alt]||p;
}
/* 底图取不到时的可见兜底：塌成一条灰线是静默失败，必须说出原因。
   （最小高度保证提示看得见 —— 否则 16px 高的 stage 里任何文字都显示不出来）
   after：弹窗原本就用 onload/onerror 重量尺寸，这里接管后回调它，别把原有行为吃掉。 */
function stageImgGuard(stage,img,path,after){
  if(!stage||!img)return;
  var triedRaw=false;
  img.onerror=function(){
    /* 本地多一级兜底：同源取不到（例如图是在**线上测试版**上传的、本地磁盘没有）
       → 回源线上 raw 再试一次。⛔ 少了这一级就会 404 塌成一条灰线（静默失败）。 */
    if(IS_LOCAL&&!triedRaw&&/^https?:$/.test(location.protocol)){
      triedRaw=true;
      img.src=RAW_DIR+String(path).replace(/^\.?\//,'');
      return;
    }
    stage.classList.add('bad');
    if(!stage.querySelector('.stage-err')){
      var d=document.createElement('div');
      d.className='stage-err';
      d.textContent='产品图没加载出来，请重试：'+path;
      stage.appendChild(d);
    }
    if(after)after();
  };
  img.onload=function(){
    stage.classList.remove('bad');
    var d=stage.querySelector('.stage-err');
    if(d&&d.parentNode)d.parentNode.removeChild(d);
    if(after)after();
  };
}
/* 取某张配色的原图数据：本地优先本机图片仓（本地刚上传的图只在那里），
   其次同源静态文件；线上照旧走 GitHub contents。 */
function colorSource(c){
  if(!IS_LOCAL)return ghFile(c.image).then(function(f){return 'data:image/png;base64,'+f.content;});
  var one=function(u){
    return fetch(u,{cache:'no-store'}).then(function(r){
      if(!r.ok)throw new Error('HTTP '+r.status+' '+u);
      return r.blob();
    });
  };
  var u=adminAssetUrl(c.image);
  if(u.indexOf('blob:')===0)return one(u);   /* 命中本机图片仓，没有回源的必要 */
  /* 同源没有 → 回源线上 raw（与 stageImgGuard 同一策略：图可能是线上测试版传的） */
  return one(u).catch(function(){return one(RAW_DIR+String(c.image).replace(/^\.?\//,''));});
}
/* 本地「新增型号 / 覆盖型号」：图片落本机图片仓，配置落本机草稿。
   与线上分支共用 packUpload 与合并规则，所以「本地测出来的效果」就是「线上会得到的效果」。 */
var localBusy=false;    /* ⛔ 不能用 state.busy：saveLocalDraft() 第一道守卫就是它，
                           先置起来会让草稿直接不写、却又被下面的成功提示盖住（假成功）。 */

/* 本地落盘（本机图片仓 + 本机草稿）—— 三个入口共用这一份：
     · 「确认提交上传」（localPublishUpload，新增 / 覆盖型号）
     · 「修改图片」弹窗的「确认提交上传」（ipSave）
     · 将来任何新的「会产出图片」的写回入口
   ⛔ 不要各写一遍：三份实现必然漂移，本项目已经吃过「两份实现不一致」的亏
      （线上 json 任务里的字段合并就是被漏过一次，直接把 brandLogo/safeZones 抹了）。
   返回 {ok:true,key,files} = 真的写进去了；{ok:false,reason} = 没写。 */
function localCommitUpload(up){
  return idbPutFiles(up.files.map(function(f){return {path:f.path,blob:f.blob};})).then(function(n){
    /* ⛔⛔ 2026-10-08（第七轮）：刚往本机图片仓写了文件 → objectURL 表立即重扫。
       不重扫的话，同一次会话里任何「重新按路径取图」都会 404
       （表是页面加载时扫的快照，那时仓里还没有这些新文件）。
       产品图与自定义 LOGO 是同一个坑。 */
    return adminAssetsRescan().then(function(){return n;});
  }).then(function(n){
    /* 与线上 json 任务同一套合并：以新配置为基准，用旧配置补齐本次没动的字段，
       否则覆盖已有型号会把 brandLogo / logoMax / safeZones 整段抹掉（历史事故）。 */
    var old=state.models[up.key];
    if(old)Object.keys(old).forEach(function(f){if(up.model[f]===undefined)up.model[f]=old[f];});
    state.models[up.key]=up.model;
    (up.keepColors||[]).forEach(function(c){
      if(!state.models[up.key].colors.some(function(x){return x.key===c.key;}))state.models[up.key].colors.push(c);
    });
    /* 纯新增图片本来不计入 pendingCount()，这里明确标脏，否则 saveLocalDraft()
       会以「还没有任何改动」直接返回 —— 草稿一个字都不写，等于白传。 */
    state.dirty=true;
    return saveLocalDraft('型号 '+up.key+'（'+n+' 个图片文件）').then(function(r){
      /* ⛔ 只有真的写进草稿（'draft'）才允许报成功；saveLocalDraft 自己已经说清了
         没写的原因，调用方再盖一句「已存到本机」就变成假成功。 */
      return r==='draft'?{ok:true,key:up.key,files:n}:{ok:false,reason:r};
    });
  });
}

function localPublishUpload(){
  if(localBusy){toastMsg('上一次本机保存还在进行中，请稍候…');return Promise.resolve('busy');}
  var g=calcDraft();
  if(!draft.items.length){toastMsg('请先放几张颜色图');return Promise.resolve('noimg');}
  if(!g){toastMsg('图片宽度不一致，同一个型号必须用同样宽度的图');return Promise.resolve('badgeo');}
  if(!requireModelName())return Promise.resolve('noname');
  localBusy=true;$('btnPublish').disabled=true;
  return buildUpload().then(function(up){
    if(state.models[up.key]&&!confirm('型号 '+up.key+' 已存在，覆盖它的配色？'))return 'cancel';
    return localCommitUpload(up).then(function(r){
      if(!r.ok)return r.reason;
      draft.items.forEach(function(it){if(it&&it.revoke){try{it.revoke();}catch(e){}}});
      draft.items=[];draft.model='';
      var nm=$('newModel');if(nm)nm.value='';
      renderPreviews();renderList();
      toastMsg('已存到本机（'+draftStamp()+'）：型号 '+r.key+' 进了本机草稿，'+
        r.files+' 个图片文件进了本机图片仓。刷新前端页面就能看到产品图。');
      return 'local';
    });
  }).catch(function(e){
    refreshPending();
    alert('本机保存中断：'+((e&&e.message)||e)+'\n配置与图片都没有写进去，修好后可以重试。');
    return 'error';
  }).then(function(r){
    localBusy=false;$('btnPublish').disabled=false;
    return r;
  });
}

/* ========== 发布 ========== */
/* ⛔ ui.prog 必须是「进度条元素」（#jobFill），不是 prog 函数本身。
   踩过的坑：publish() 和 LOGO 保存两处写成 {prog:prog,...}，把函数当元素传进来，
   fill.style 是 undefined 却仍执行 fill.style.width=… —— 直接抛
   「Cannot set properties of undefined (setting 'width')」，
   一次完整的「确认提交上传」在第一个任务之前就被打断。
   统一走 progEl() 归一：拿不到元素就回落 #jobFill，再拿不到就静默不画，
   进度条画不出来不该让发布失败。 */
function progEl(ui){
  var el=(ui&&ui.prog)||null;
  if(!el||!el.style)el=$('jobFill');
  if(!el||!el.style)return null;
  return el;
}
function prog(p,ui){
  var fill=progEl(ui);
  if(!fill)return;
  fill.style.width=Math.round(p*100)+'%';
}
/* 进度条和上传明细都关在「提交中」弹窗里：提交期间出现，提交结束整块消失，
   不再把「上传 xx.png / 更新 models.json」这些行堆在页面底部。 */
function openJobPanel(title){
  var p=$('jobPanel');if(!p)return;
  var t=$('jobTitle');if(t&&title)t.textContent=title;
  var f=$('jobFill');if(f)f.style.width='0%';
  var l=$('jobLog');if(l)l.textContent='';
  p.hidden=false;
}
function closeJobPanel(){
  var p=$('jobPanel');if(!p)return;
  p.hidden=true;
  var f=$('jobFill');if(f)f.style.width='0%';
}
/* 兼容旧调用点：进度条现在随弹窗一起收，这里只做兜底复位。 */
function progDone(ui){closeJobPanel();}
/* 执行一组发布任务。ui={prog,log,title} 可选；
   不传就统一落到「提交中」弹窗（#jobFill / #jobLog）。
   弹窗由本函数自己开关：进来就弹，跑完（成功或失败）自动消失。 */
function runJobs(jobs,ui){
  ui=ui||{};
  var total=jobs.length,done=0;
  var logEl=$('jobLog')||ui.log||null;
  if(logEl)logEl.textContent='';
  openJobPanel(ui.title||'正在提交到 GitHub');
  var log=function(s){
    if(!logEl)return;
    logEl.textContent+=s+'\n';logEl.scrollTop=logEl.scrollHeight;
  };
  prog(0.02,ui);
  var runOne=function(){
    if(!jobs.length)return Promise.resolve();
    var j=jobs.shift();
    var task,label='';
    try{
      if(j.kind==='put'){
        label='上传 '+j.path;
        task=toB64(j.blob).then(function(b64){
          return ghFile(j.path).catch(function(){return null;}).then(function(cur){
            return ghPut(j.path,b64,'后台：上传 '+j.path,cur&&cur.sha);
          });
        });
      }else if(j.kind==='refile'){
        label='重算 '+j.key+' '+j.color.label;
        task=(function(){
          /* 用当前方框重裁保留色：从 draft 合并后的几何重裁需要原图，这里直接重传原文件内容 */
          return ghFile(j.color.image).then(function(cur){
            return ghPut(j.color.image,cur.content,'后台：重算 '+j.color.image,cur.sha).then(function(){
              return ghFile(j.color.webp).then(function(c2){
                return ghPut(j.color.webp,c2.content,'后台：重算 '+j.color.webp,c2.sha);
              });
            });
          });
        })();
      }else if(j.kind==='del'){
        label='删除 '+j.path;
        /* ⛔ 一次性：删成功（或被跳过）后立刻把它从 state.dels 里摘掉。
           为什么必须摘：buildJobs 现在**无条件**带上 state.dels（见那里的说明），
           如果这里不消费，同一次会话里后续任何一次提交都会把同一批文件再删一遍
           （第二次会拿不到 sha 而记「跳过删除」，日志里一路报错、还烧 GitHub 额度）。
           用 `catch` 兜底摘除：文件本来就不在（404）也算「已经不在」，不该再试。 */
        task=ghFile(j.path).then(function(cur){return ghDel(j.path,cur.sha,'后台：删除 '+j.path);})
          .catch(function(e){log('跳过删除 '+j.path+'：'+e.message);})
          .then(function(){
            var di=state.dels.indexOf(j.path);
            if(di>=0)state.dels.splice(di,1);
          });
      }else if(j.kind==='copy'){
        label='改名 '+j.from;
        task=ghFile(j.from).then(function(cur){
          return ghPut(j.to,cur.content,'后台：改名 '+j.from+' → '+j.to,null);
        }).then(function(){
          return ghFile(j.from).then(function(c2){return ghDel(j.from,c2.sha,'后台：改名删除 '+j.from);});
        }).catch(function(e){log('跳过改名 '+j.from+'：'+e.message);})
          .then(function(){
            /* ⛔ 与 del 同理：copy 完成后摘掉，避免重复改名。 */
            var ci=state.pendingCopy.findIndex(function(cp){return cp.from===j.from;});
            if(ci>=0)state.pendingCopy.splice(ci,1);
          });
      }else{
        label='更新 models.json';
        var merged=state.models;
        /* j.model 为空表示「只写配置」：删型号 / 删颜色 / 改颜色名这些操作
           已经在 state.models 上改完了，直接把当前配置落盘即可。 */
        if(j.model){
          /* 覆盖已有型号时不能直接 merged[key]=newModel —— 那样会把 brandLogo、
             logoMax 这类「本次没动的字段」整段抹掉（9100 的 logoMax 就是这样
             被改成 60×60、9031SJ 之外的型号品牌 LOGO 就是这样消失的）。
             改为：以新配置为基准，再用旧配置补齐所有未出现的键。 */
          var old=merged[j.model.key];
          var nm2=j.model.model;
          if(old){
            Object.keys(old).forEach(function(f){
              if(nm2[f]===undefined)nm2[f]=old[f];
            });
          }
          merged[j.model.key]=nm2;
          (j.model.keepColors||[]).forEach(function(c){
            var exist=merged[j.model.key].colors.some(function(x){return x.key===c.key;});
            if(!exist)merged[j.model.key].colors.push(c);
          });
        }
        var body=JSON.stringify({updatedAt:new Date().toISOString(),pinnedCount:pinnedCount(),models:merged},null,2);
        task=(function(){
          var b64=btoa(unescape(encodeURIComponent(body)));
          var snap=JSON.parse(body);
          return ghFile('models.json').catch(function(){return null;}).then(function(cur){
            return ghPut('models.json',b64,'后台：更新型号配置',cur&&cur.sha);
          }).then(function(r){
            /* 记下「这一版是本机写上去的」，供 loadModels() 识别线上读回来的是不是缓存旧版。
               写入被拦下（skipped）时不能记，否则会拿本机的假想状态去压真实线上配置。 */
            if(!(r&&r.skipped))lwSave(snap);
            return r;
          });
        })();
      }
    }catch(e){task=Promise.reject(e);}
    log(label);
    return task.catch(function(e){if(e&&e.message!=='__skip__')log('  出错：'+e.message);throw e;})
      .then(function(){done++;prog(done/total,ui);return runOne();});
  };
  /* 收尾一定要关弹窗：否则失败时「上传 xx.png」这些行会一直挂在页面上。 */
  return runOne().then(function(r){closeJobPanel();return r;},
                       function(e){closeJobPanel();throw e;});
}
/* 组装本次要跑的任务（新增/修改弹窗共用） */
/* 组装本次要跑的任务（新增/修改弹窗共用）
   ⛔ `skipGlobalEdits` 只该屏蔽 **pendingCopy**（改名的 copy 任务），
      绝不能连 `state.dels` 一起屏蔽 —— 2026-10-05 用户报的
      「删除图片后线上图片还在」根因就在这里：
      · 「修改图片」弹窗点 × 后，dropFiles() 会把该配色的 png/webp 逐个
        stageDel() 进 `state.dels`（= 「本次要删掉的 GitHub 文件」）；
      · 但 ipSave 走的是 `buildJobs(up,{skipGlobalEdits:true})`，
        旧写法把 `state.dels` 也一起跳过了 → `del` 任务一个都没生成；
      · 结果：配置里那个颜色没了、**GitHub 上的两张图却还在**（孤儿文件），
        下次再传同名颜色时还会撞上旧图。
      现在只屏蔽 copy：`state.dels` 永远参与组装（它是「本弹窗的预期结果」，
      不是「别处攒着的全局改动」）。 */
function buildJobs(up,opt){
  opt=opt||{};
  var jobs=[];
  if(!opt.skipGlobalEdits){
    state.pendingCopy.forEach(function(cp){jobs.push({kind:'copy',from:cp.from,to:cp.to});});
  }
  up.files.forEach(function(f){jobs.push({kind:'put',path:f.path,blob:f.blob});});
  up.keepColors.forEach(function(c){jobs.push({kind:'refile',color:c,key:up.key});});
  /* ⛔ 无条件：本次 stageDel 进来的文件必须真的删掉，见上面的说明。 */
  state.dels.forEach(function(p){jobs.push({kind:'del',path:p});});
  jobs.push({kind:'json',model:up});
  return jobs;
}
/* 只改配置、不新增图片时的任务清单（删型号 / 删颜色 / 改颜色名 / 改型号名）。
   这些改动都直接落在 state.models 上，所以只需要把图片增删跑完，
   再把当前配置整体写回 models.json。 */
function buildConfigJobs(){
  var jobs=[];
  state.pendingCopy.forEach(function(cp){jobs.push({kind:'copy',from:cp.from,to:cp.to});});
  state.dels.forEach(function(p){jobs.push({kind:'del',path:p});});
  jobs.push({kind:'json',model:null});
  return jobs;
}
/* 型号名称是必填项：为空就拦在提交之前，聚焦并高亮输入框，
   不要让用户走完一整遍流程才收到「发布中断」。 */
function requireModelName(){
  var nm=$('newModel');
  if(normModel((nm?nm.value:'')||draft.model))return true;
  if(nm){
    nm.focus();
    var box=nm.closest('.name-field')||nm;
    box.classList.add('need');
    setTimeout(function(){box.classList.remove('need');},2600);
  }
  toastMsg('型号名称是必填项，请先填写');
  return false;
}
function publish(){
  /* ⛔ 不能静默 return：以前 busy 卡住时点提交毫无反应、也不报错，
     用户看到的就是「点了提交但什么都没发生」。 */
  if(state.busy){toastMsg('上一次提交还在进行中，请稍候…');return;}
  /* 开发环境 → 一律存本机草稿，与有没有连 GitHub 无关。
     ⛔ 以前这里直接弹 token 面板，等于「本地要先连 GitHub 才能保存」，
     而连上 GitHub 就已经是发到线上测试版了 —— 第①级本地验收根本走不通。
     后来改成 `IS_LOCAL&&!token()`：只要本机存过 token，本地保存又会去写线上，
     写失败就把删改全丢了（表象与改之前一样）。
     ⛔ 「图片写不进浏览器」是错的 —— IndexedDB 能存 Blob。图片现在落本机图片仓，
     配置落本机草稿，所以本地也能完整走「新增型号」这条路（见 localPublishUpload）。 */
  if(IS_LOCAL){
    /* ⛔ 「图片写不进浏览器、本地只存配置」这个前提是错的（IndexedDB 能存 Blob）。
       纯新增图片时 pendingCount()=0，以前一路落到最后那句 toast —— 用户点了提交
       只看到一行小灰字，新增型号在本地根本做不了。现在有图片就走本机图片仓。 */
    if(draft.items.length)return localPublishUpload();
    if(pendingCount())return saveLocalDraft('配置');
    toastMsg('还没有任何改动');
    return;
  }
  if(!token()){openTokenPanel();alert('还没有连接 GitHub，请先连接');return;}
  /* ⛔ 右侧栏没有待传图片时必须走「纯配置提交」。
     以前这里无条件 buildUpload()，会以「请先放几张颜色图」软失败 ——
     于是「删掉的型号 / 删掉的颜色」永远写不进 models.json，刷新一下全长回来。
     删型号、删颜色、改颜色名、改型号名都只改配置，本来就不需要图片。 */
  if(!draft.items.length){
    /* 有待发布的配置改动（删型号/删颜色/改名）→ 纯配置提交，不需要型号名、也不需要图。
       什么都没有 → 只做引导：先填型号名，再放图。 */
    if(pendingCount())return publishConfig();
    if(!requireModelName())return;
    toastMsg('请先放几张颜色图');
    return;
  }
  if(!requireModelName())return;
  buildUpload().then(function(up){
    if(state.models[up.key]&&!confirm('型号 '+up.key+' 已存在，覆盖它的配色？'))return Promise.resolve();
    var jobs=buildJobs(up);
    state.busy=true;$('btnPublish').disabled=true;
    return runJobs(jobs,{title:'正在提交到 GitHub'}).then(function(){
      state.busy=false;$('btnPublish').disabled=false;
      state.puts=[];state.dels=[];state.pendingCopy=[];state.dirty=false;
      renderPreviews();
      alert('发布完成！\n前端页面约 30–60 秒后会自动显示新内容。'+stageNoticeTail());
      return afterWrite();
    });
  }).catch(function(e){
    state.busy=false;$('btnPublish').disabled=false;
    var m=(e&&e.message)||'';
    var soft=m.indexOf('请先')>=0||m.indexOf('宽度')>=0||m.indexOf('英文名')>=0;
    /* ⛔ 顺序不能反：refreshPending() 会把 #pendingTip 重写成「待发布项数」，
        先 toast 再 refresh 的话提示会被当场清掉，用户点了提交像什么都没发生。
        所以先刷新待发布数，再给出错提示。 */
    refreshPending();
    if(!soft)alert('发布中断：'+m+'\n已提交的部分不会回滚，修好后可重新发布。');
    else if(m)toastMsg(m);
  });
}
/* 只改配置的提交（右侧栏没有图片）：把图片增删跑完 + 当前配置写回 models.json。
   不需要型号名称，也不该被型号名称的必填校验拦住。 */
/* 写回成功之后：内存里的 state.models 就是刚写进线上那一版，直接复用即可。
   ⛔ 不要回头再 loadModels()：远端 / CDN 可能还没更新，重读会把刚删掉的型号重新装回内存，
   紧接着的下一次写回就把它整段覆盖回线上 —— 这就是「删了刷新又回来」的真因。
   渲染与待发布计数照旧刷新，页面表现不变。 */
function afterWrite(){state.puts=[];renderList();renderPreviews();refreshPending();return 'ok';}
function publishConfig(){
  /* ⛔ 开发环境无条件走草稿：不许因为「碰巧存过 token」就把本地删改直接推到线上。
     写线上是第②级的动作，要么用线上测试版后台、要么走发布脚本，不从开发环境偷偷做。 */
  if(IS_LOCAL)return saveLocalDraft('配置');
  if(!pendingCount()){toastMsg('还没有任何改动');return Promise.resolve('nochange');}
  state.busy=true;$('btnPublish').disabled=true;
  return runJobs(buildConfigJobs(),{title:'正在提交配置到 GitHub'}).then(function(){
    state.busy=false;$('btnPublish').disabled=false;
    state.dels=[];state.pendingCopy=[];state.dirty=false;
    renderPreviews();
    lastWrite='已推送 GitHub '+draftStamp();
    alert('发布完成！\n前端页面约 30–60 秒后会自动显示新内容。'+stageNoticeTail());
    return afterWrite();
  }).catch(function(e){
    state.busy=false;$('btnPublish').disabled=false;
    lastWrite='推送失败：'+((e&&e.message)||e);
    refreshPending();syncEnvChip();
    alert('发布中断：'+((e&&e.message)||e)+'\n已提交的部分不会回滚，修好后可重新发布。');
    return 'fail';
  });
}
/* 删除型号 / 删除颜色 / 清除品牌LOGO —— 这类操作的用户意图在确认框那一下就表达完了，
   不该再要求「记得去右上角点提交」。以前只改内存 + 标 dirty，用户以为删完就完了，
   实际上一个字都没写回 GitHub，刷新自然全长回来。
   所以：确认后直接写回，一步到位。返回 Promise，调用方可据此决定是否刷新界面。 */
function autoCommit(what){
  /* ⛔ 本地草稿模式同样要守住「确认即提交」这条红线：
     本地也不能只改内存 + 标脏，否则刷新就回退，用户会以为删不掉。
     ⛔ 而且必须无条件走草稿（不带 `!token()`）—— 见 saveLocalDraft 上方那段：
       带上 token 判定时，本机存过 token 的用户在本地删型号会去写线上，写失败就刷新回退。 */
  if(IS_LOCAL)return saveLocalDraft(what);
  if(!token()){
    openTokenPanel();
    toastMsg(what+'已记在页面上，但还没写回线上 —— 先连接 GitHub，再点右上角提交');
    return Promise.resolve('nologin');
  }
  return publishConfig();
}
/* 把当前配置存进本机草稿（完全不碰线上）。语义与 publishConfig() 对齐，只是落点换成本地浏览器。
   ⛔ 「写完不回头读」照旧：存完直接复用内存里的 state.models，不再 loadModels()。 */
function saveLocalDraft(what){
  /* ⛔ 以前这里 `if(state.busy)return Promise.resolve('busy')` —— 完全静默。
     一旦 busy 被卡住（runJobs 抛同步异常就会），用户点删除、点保存全都「没反应」，
     刷新自然回退，而且页面上一个字都不提示原因。这类静默分支一律不许留。 */
  if(state.busy){toastMsg('上一次提交还在进行中，这次改动没有保存 —— 请稍候再操作一次');return Promise.resolve('busy');}
  if(!pendingCount()){toastMsg('还没有任何改动');return Promise.resolve('nochange');}
  var wrote=dkSave({updatedAt:new Date().toISOString(),pinnedCount:pinnedCount(),models:state.models});
  if(!wrote){
    /* 写不进 localStorage（隐私模式 / 配额满）时必须大声说，否则又变成「刷新就回退」且查无原因 */
    alert('本机草稿写入失败：浏览器拒绝写入 localStorage（可能是隐私模式或存储已满）。\n'+
      '这次改动只留在页面上，刷新就会丢。建议改用线上测试版后台。');
    lastWrite='草稿写入失败';
    syncEnvChip();
    return Promise.resolve('fail');
  }
  lastWrite='已存本机草稿 '+draftStamp()+'（未上传线上）';
  var imgLeft=state.dels.length+state.pendingCopy.length;
  state.dirty=false;state.puts=[];state.dels=[];state.pendingCopy=[];
  afterWrite();      /* 清 puts / 重渲染 / 刷新待发布计数（它会重写 #pendingTip，所以提示必须放在它后面） */
  syncDraftChip();syncEnvChip();
  toastMsg('已存到本机草稿（'+draftStamp()+'）：'+(what||'配置')+
    '。仅本机浏览器可见、未上传线上；刷新前端页面即可看到。'+
    (imgLeft?('另有 '+imgLeft+' 项线上图片删除/改名没有执行（本地只动本机图片仓，线上文件不动）。'):''));
  return Promise.resolve('draft');
}
window.__mrLocalDraft={isLocal:function(){return IS_LOCAL;},get:dkGet,save:dkSave,drop:dkDrop,key:DK};

/* ========== 安全区（可定制范围） ==========
   每个型号可配 0~N 个轴对齐矩形安全区，单位 mm、画布左上为原点，
   与 brandLogo 同一坐标系，存在配置里的 safeZones 数组：
     "safeZones":[{"xMm":86,"yMm":120,"wMm":180,"hMm":140}, ...]
   · 不配 / 空数组 = 不限制（没配过的型号行为完全不变，向后兼容）
   · 客户 LOGO 与任一安全区有重叠即算合格（2026-09-17 用户定的宽松规则）
   · 区外做视觉淡化 + 超界变红提示，不阻断拖动、不阻断导出

      **内容换了、路径不变**。于是发生：

        ② 替换成 B → 保存成功、GitHub 上文件已变 B
        ③ 但任何一次重新渲染（重开面板 / 切色 / 拖动）都会走回 loadImgEl → **命中 A** → 画布还是第一张图

function lpImgCacheDrop(url){

  lpImgCache={};                       /* 不传参数 = 全清（换图/保存后最稳的兜底） */

function loadImgEl(u){
  if(lpImgCache[u])return Promise.resolve(lpImgCache[u]);

    im.onload=function(){lpImgCache[u]=im;res(im);};

          此时 lpImgCache 已被 lpImgCacheDrop() 清掉，会真的发一次请求；
          GitHub Pages 对同名文件更新的失效延迟通常在秒级，用户刷新页面即最新。
